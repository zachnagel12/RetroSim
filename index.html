    html += '</div>';
    
    let sidebarHtml = `
      <div style="margin-bottom:20px">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">Recent picks</div>
        ${recent.length === 0 ? '<div style="font-size:12px;color:var(--text-dim)">No picks yet</div>' : recent.map(pick => {
          const player = this.state.players[pick.playerId];
          const team = this.state.teams[pick.teamId];
          const isUser = pick.teamId === this.state.userTeamId;
          return `<div class="draft-recent-pick ${isUser ? 'user-pick' : ''}">
            <div class="pick-num">${pick.overall}</div>
            <div>
              <div style="font-weight:500">${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
              <div style="color:var(--text-muted);font-size:10px">${team.abbr} · R${pick.round}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
    
    if (userTeam) {
      const counts = {};
      userRoster.forEach(p => { counts[p.position] = (counts[p.position] || 0) + 1; });
      sidebarHtml += `
        <div style="margin-bottom:20px">
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">${userTeam.abbr} roster · ${userRoster.length}/52</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;line-height:1.6">
            ${POSITIONS_FOR_DRAFT.map(pos => `<span style="display:inline-block;margin-right:8px">${pos}: <strong style="color:var(--text)">${counts[pos] || 0}</strong>/${POSITION_COUNTS[pos]}</span>`).join('')}
          </div>
          ${userRoster.sort((a, b) => b.rating - a.rating).slice(0, 15).map(p => {
            const rc = this.ratingClass(p.rating);
            return `<div class="draft-roster-mini">
              <span class="position-tag">${p.position}</span>
              <span style="font-size:11px">${p.name}</span>
              <span class="rating ${rc}" style="font-size:10px;padding:1px 5px;min-width:24px">${p.rating}</span>
            </div>`;
          }).join('')}
          ${userRoster.length > 15 ? `<div style="font-size:10px;color:var(--text-muted);margin-top:6px">+ ${userRoster.length - 15} more</div>` : ''}
        </div>
      `;
    }
    
    document.getElementById('content').innerHTML = `<div class="draft-container">
      <div class="draft-main">${html}</div>
      <div class="draft-sidebar">${sidebarHtml}</div>
    </div>`;
  },

  setDraftFilter(pos) { this.draftFilter = pos; this.renderDraft(); },

  // ============================================================
  // SCHEDULE & SIM
  // ============================================================

  generateSchedule() {
    this.state.schedule = [];
    for (let week = 1; week <= 16; week++) {
      const shuffled = [...this.state.teams].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffled.length; i += 2) {
        if (shuffled[i+1]) {
          this.state.schedule.push({
            week, homeTeam: shuffled[i].id, awayTeam: shuffled[i+1].id,
            played: false, homeScore: 0, awayScore: 0, playerStats: {}
          });
        }
      }
    }
  },

  getCurrentEra() {
    return ERAS.find(e => this.state.year >= e.start && this.state.year <= e.end) || ERAS[ERAS.length - 1];
  },

  simWeek() {
    if (!this.state || this.state.draftActive) return;
    if (this.state.week >= 16) { this.endSeason(); return; }
    
    this.state.week++;
    const era = this.getCurrentEra();
    const weekGames = this.state.schedule.filter(g => g.week === this.state.week && !g.played);
    
    weekGames.forEach(g => this.simGame(g, era));
    this.generateWeeklyHeadlines();
    if (Math.random() < 0.08) this.generateScandal();
    
    this.state.lastWeekRecap = this.buildWeekRecap(weekGames);
    
    document.getElementById('newsFeed').style.display = '';
    document.getElementById('mainGrid').style.gridTemplateColumns = '200px 1fr 320px';
    
    this.saveGame();
    this.currentView = 'recap';
    this.render();
  },

  simGame(g, era) {
    const home = this.state.teams[g.homeTeam];
    const away = this.state.teams[g.awayTeam];
    const hs = this.getTeamStrength(home);
    const as = this.getTeamStrength(away);
    const homeWinProb = (hs / (hs + as)) + 0.05;
    const homeWins = Math.random() < homeWinProb;
    
    const base = 14 + Math.floor(era.gameRate * 8);
    const hScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? 7 : -7));
    const aScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? -7 : 7));
    
    g.homeScore = homeWins ? Math.max(hScore, aScore + 1) : hScore;
    g.awayScore = !homeWins ? Math.max(aScore, hScore + 1) : aScore;
    g.played = true;
    g.playerStats = {};
    
    if (g.homeScore > g.awayScore) {
      home.wins++; away.losses++;
      home.coachWins++; away.coachLosses++;
    } else {
      away.wins++; home.losses++;
      away.coachWins++; home.coachLosses++;
    }
    
    home.pointsFor += g.homeScore; home.pointsAgainst += g.awayScore;
    away.pointsFor += g.awayScore; away.pointsAgainst += g.homeScore;
    
    this.generateGameStats(g, home, away, era);
  },

  getTeamStrength(team) {
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    if (!roster.length) return 50;
    const sorted = [...roster].sort((a, b) => b.rating - a.rating).slice(0, 22);
    return sorted.reduce((s, p) => s + p.rating, 0) / sorted.length;
  },

  generateGameStats(gameObj, home, away, era) {
    [{ team: home, score: gameObj.homeScore }, { team: away, score: gameObj.awayScore }].forEach(({ team, score }) => {
      const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
      const ensureStats = (pid) => {
        if (!gameObj.playerStats[pid]) gameObj.playerStats[pid] = EMPTY_GAME_STATS();
        return gameObj.playerStats[pid];
      };
      const markPlayed = (p) => { p.seasonStats.gamesPlayed = (p.seasonStats.gamesPlayed || 0) + 1; };
      
      const qbs = roster.filter(p => p.position === 'QB').sort((a, b) => b.rating - a.rating);
      if (qbs[0]) {
        const qb = qbs[0];
        const yds = Math.floor((150 + Math.random() * 220) * era.gameRate * (qb.rating / 75));
        const att = Math.floor(20 + Math.random() * 18);
        const comp = Math.floor(att * (0.55 + Math.random() * 0.2));
        const tds = Math.floor(Math.random() * 4 * era.passEmph * 1.5);
        const ints = Math.random() < 0.4 ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(qb.id);
        gs.passingYards += yds; gs.passingTDs += tds; gs.attempts += att; gs.completions += comp; gs.interceptionsThrown += ints;
        gs.touchdowns += tds;
        qb.seasonStats.passingYards += yds; qb.seasonStats.passingTDs += tds;
        qb.seasonStats.attempts += att; qb.seasonStats.completions += comp;
        qb.seasonStats.interceptionsThrown += ints; qb.seasonStats.touchdowns += tds;
        markPlayed(qb);
      }
      
      const rbs = roster.filter(p => p.position === 'RB').sort((a, b) => b.rating - a.rating);
      rbs.slice(0, 2).forEach((rb, i) => {
        const share = i === 0 ? 0.7 : 0.3;
        const yds = Math.floor((50 + Math.random() * 100) * (2 - era.passEmph) * (rb.rating / 75) * share);
        const car = Math.floor((10 + Math.random() * 15) * share * 2);
        const tds = Math.random() < (i === 0 ? 0.5 : 0.2) ? Math.floor(Math.random() * 2) + (Math.random() < 0.3 ? 1 : 0) : 0;
        const gs = ensureStats(rb.id);
        gs.rushingYards += yds; gs.carries += car; gs.rushingTDs += tds; gs.touchdowns += tds;
        rb.seasonStats.rushingYards += yds; rb.seasonStats.carries += car;
        rb.seasonStats.rushingTDs += tds; rb.seasonStats.touchdowns += tds;
        markPlayed(rb);
      });
      
      const wrs = roster.filter(p => p.position === 'WR').sort((a, b) => b.rating - a.rating);
      wrs.slice(0, 3).forEach((wr, i) => {
        const share = [0.45, 0.30, 0.20][i] || 0.1;
        const yds = Math.floor((50 + Math.random() * 90) * era.gameRate * (wr.rating / 75) * share * 2);
        const rec = Math.floor((2 + Math.random() * 6) * share * 2);
        const tds = Math.random() < 0.4 * era.passEmph ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(wr.id);
        gs.receivingYards += yds; gs.receptions += rec; gs.receivingTDs += tds; gs.touchdowns += tds;
        wr.seasonStats.receivingYards += yds; wr.seasonStats.receptions += rec;
        wr.seasonStats.receivingTDs += tds; wr.seasonStats.touchdowns += tds;
        markPlayed(wr);
      });
      
      const tes = roster.filter(p => p.position === 'TE').sort((a, b) => b.rating - a.rating);
      if (tes[0]) {
        const te = tes[0];
        const yds = Math.floor((20 + Math.random() * 60) * (te.rating / 75));
        const rec = Math.floor(1 + Math.random() * 5);
        const tds = Math.random() < 0.25 ? 1 : 0;
        const gs = ensureStats(te.id);
        gs.receivingYards += yds; gs.receptions += rec; gs.receivingTDs += tds; gs.touchdowns += tds;
        te.seasonStats.receivingYards += yds; te.seasonStats.receptions += rec;
        te.seasonStats.receivingTDs += tds; te.seasonStats.touchdowns += tds;
        markPlayed(te);
      }
      
      const dls = roster.filter(p => p.position === 'DL').sort((a, b) => b.rating - a.rating);
      dls.slice(0, 4).forEach(dl => {
        const sacks = Math.random() < (dl.rating / 100) ? Math.floor(Math.random() * 2) + (Math.random() < 0.2 ? 1 : 0) : 0;
        const tackles = Math.floor(2 + Math.random() * 6);
        const gs = ensureStats(dl.id);
        gs.sacks += sacks; gs.tackles += tackles;
        dl.seasonStats.sacks += sacks; dl.seasonStats.tackles += tackles;
        markPlayed(dl);
      });
      
      const lbs = roster.filter(p => p.position === 'LB').sort((a, b) => b.rating - a.rating);
      lbs.slice(0, 3).forEach(lb => {
        const tackles = Math.floor(3 + Math.random() * 8);
        const sacks = Math.random() < 0.25 ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(lb.id);
        gs.tackles += tackles; gs.sacks += sacks;
        lb.seasonStats.tackles += tackles; lb.seasonStats.sacks += sacks;
        markPlayed(lb);
      });
      
      const dbs = roster.filter(p => p.position === 'CB' || p.position === 'S').sort((a, b) => b.rating - a.rating);
      dbs.slice(0, 4).forEach(db => {
        const tackles = Math.floor(1 + Math.random() * 6);
        const ints = Math.random() < (db.rating / 250) ? 1 : 0;
        const gs = ensureStats(db.id);
        gs.tackles += tackles; gs.interceptionsMade += ints;
        db.seasonStats.tackles += tackles; db.seasonStats.interceptionsMade += ints;
        markPlayed(db);
      });
      
      const kickers = roster.filter(p => p.position === 'K').sort((a, b) => b.rating - a.rating);
      if (kickers[0]) {
        const k = kickers[0];
        const fgAtt = Math.floor(1 + Math.random() * 4);
        const fgMade = Math.floor(fgAtt * (0.6 + (k.rating / 200)));
        const xp = Math.max(0, Math.floor(score / 7) - Math.floor(Math.random() * 2));
        const gs = ensureStats(k.id);
        gs.fieldGoalsMade += fgMade; gs.fieldGoalsAttempted += fgAtt; gs.extraPoints += xp;
        k.seasonStats.fieldGoalsMade += fgMade; k.seasonStats.fieldGoalsAttempted += fgAtt;
        k.seasonStats.extraPoints += xp;
        markPlayed(k);
      }
    });
  },

  buildWeekRecap(weekGames) {
    const offensiveScores = [], defensiveScores = [], specialScores = [];
    
    weekGames.forEach(g => {
      Object.entries(g.playerStats).forEach(([pid, stats]) => {
        const player = this.state.players[pid];
        if (!player) return;
        const offScore = stats.passingYards * 0.04 + stats.passingTDs * 6 +
                         stats.rushingYards * 0.1 + stats.rushingTDs * 6 +
                         stats.receivingYards * 0.1 + stats.receivingTDs * 6;
        const defScore = stats.sacks * 5 + stats.interceptionsMade * 8 + stats.tackles * 0.5;
        const spcScore = stats.fieldGoalsMade * 4 + stats.extraPoints * 1;
        if (offScore > 5) offensiveScores.push({ player, stats, score: offScore });
        if (defScore > 3) defensiveScores.push({ player, stats, score: defScore });
        if (spcScore > 2) specialScores.push({ player, stats, score: spcScore });
      });
    });
    
    offensiveScores.sort((a, b) => b.score - a.score);
    defensiveScores.sort((a, b) => b.score - a.score);
    specialScores.sort((a, b) => b.score - a.score);
    
    return {
      week: this.state.week,
      games: weekGames.map(g => ({ ...g })),
      offensiveStandout: offensiveScores[0] || null,
      defensiveStandout: defensiveScores[0] || null,
      specialStandout: specialScores[0] || null
    };
  },

  generateWeeklyHeadlines() {
    const games = this.state.schedule.filter(g => g.week === this.state.week && g.played);
    let biggest = null, closest = null;
    let bm = 0, cm = 999;
    games.forEach(g => {
      const m = Math.abs(g.homeScore - g.awayScore);
      if (m > bm) { bm = m; biggest = g; }
      if (m < cm) { cm = m; closest = g; }
    });
    if (biggest && bm >= 21) {
      const w = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.homeTeam] : this.state.teams[biggest.awayTeam];
      const l = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.awayTeam] : this.state.teams[biggest.homeTeam];
      this.addHeadline({
        title: `${w.city} ${w.name} rout ${l.city} ${l.name}`,
        body: `${w.city} dominated ${l.city} ${Math.max(biggest.homeScore, biggest.awayScore)}–${Math.min(biggest.homeScore, biggest.awayScore)} in a Week ${this.state.week} blowout.`
      });
    }
    if (closest && cm <= 3) {
      const w = closest.homeScore > closest.awayScore ? this.state.teams[closest.homeTeam] : this.state.teams[closest.awayTeam];
      const l = closest.homeScore > closest.awayScore ? this.state.teams[closest.awayTeam] : this.state.teams[closest.homeTeam];
      this.addHeadline({
        title: `${w.city} edges ${l.city} in late thriller`,
        body: `A one-score game decided in the final minutes: ${w.city} ${Math.max(closest.homeScore, closest.awayScore)}, ${l.city} ${Math.min(closest.homeScore, closest.awayScore)}.`
      });
    }
    if (Math.random() < 0.3) {
      const hot = this.state.teams.filter(t => t.wins >= 3 && t.losses <= 1).sort(() => Math.random() - 0.5)[0];
      if (hot) {
        this.addHeadline({
          title: `${hot.city} ${hot.name} surge to ${hot.wins}–${hot.losses} start`,
          body: `${hot.city} continues its impressive opening run with another statement win.`
        });
      }
    }
  },

  generateScandal() {
    const t = SCANDAL_TEMPLATES[Math.floor(Math.random() * SCANDAL_TEMPLATES.length)];
    const team = this.state.teams[Math.floor(Math.random() * this.state.teams.length)];
    const tf = team.city + ' ' + team.name;
    this.addHeadline({
      type: 'scandal',
      title: t.title.replace('{team}', tf).replace('{coach}', team.coachName),
      body: t.body.replace('{team}', tf)
    });
  },

  // ============================================================
  // AWARDS — formulas closely mirror real NFL voting
  // ============================================================

  awardScores() {
    const players = this.state.players.filter(p => !p.retired && p.seasonStats.gamesPlayed > 0);
    
    // MVP — heavily weighted toward QBs (matches real NFL: ~70% of MVPs since 2000 are QBs)
    const mvp = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (p.position === 'QB') {
        score = s.passingYards * 0.06 + s.passingTDs * 10 - s.interceptionsThrown * 8 + s.rushingYards * 0.08 + s.rushingTDs * 6;
        score *= 1.4; // QB bias
      } else if (p.position === 'RB') {
        score = s.rushingYards * 0.12 + s.rushingTDs * 8 + s.receivingYards * 0.08 + s.receivingTDs * 6;
      } else if (p.position === 'WR' || p.position === 'TE') {
        score = s.receivingYards * 0.10 + s.receivingTDs * 8;
      }
      // Team success bonus
      const team = this.state.teams[p.team];
      const winPct = team.wins / Math.max(1, team.wins + team.losses);
      score *= (0.7 + winPct * 0.6);
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    
    // Offensive POY — same as MVP but no QB bias, more total offensive value
    const opoy = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (['QB','RB','WR','TE'].includes(p.position)) {
        score = s.passingYards * 0.04 + s.passingTDs * 8 + s.rushingYards * 0.1 + s.rushingTDs * 7 + s.receivingYards * 0.1 + s.receivingTDs * 7;
      }
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    
    // Defensive POY
    const dpoy = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (['DL','LB','CB','S'].includes(p.position)) {
        score = s.sacks * 6 + s.interceptionsMade * 8 + s.tackles * 0.8;
        if (p.position === 'DL') score *= 1.1;
      }
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    
    // Offensive ROY — rookies only
    const oroy = players.filter(p => p.draftYear === this.state.year && ['QB','RB','WR','TE'].includes(p.position))
      .map(p => {
        const s = p.seasonStats;
        const score = s.passingYards * 0.04 + s.passingTDs * 8 + s.rushingYards * 0.1 + s.rushingTDs * 7 + s.receivingYards * 0.1 + s.receivingTDs * 7;
        return { player: p, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    
    // Defensive ROY
    const droy = players.filter(p => p.draftYear === this.state.year && ['DL','LB','CB','S'].includes(p.position))
      .map(p => {
        const s = p.seasonStats;
        const score = s.sacks * 6 + s.interceptionsMade * 8 + s.tackles * 0.8;
        return { player: p, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    
    // Coach of the Year — wins above expected (vs previous record). Real COY favors teams who exceed projections.
    const coy = this.state.teams.map(t => {
      const prevWP = t.historicalStats.seasons > 0 ? t.historicalStats.wins / Math.max(1, t.historicalStats.wins + t.historicalStats.losses) : 0.5;
      const curWP = t.wins / Math.max(1, t.wins + t.losses);
      const improvement = curWP - prevWP;
      const score = t.wins * 10 + improvement * 80;
      return { team: t, score };
    }).sort((a, b) => b.score - a.score);
    
    return { mvp, opoy, dpoy, oroy, droy, coy };
  },

  // ============================================================
  // END SEASON
  // ============================================================

  endSeason() {
    const sorted = [...this.state.teams].sort((a, b) => {
      const aWP = a.wins / Math.max(1, a.wins + a.losses);
      const bWP = b.wins / Math.max(1, b.wins + b.losses);
      if (bWP !== aWP) return bWP - aWP;
      return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
    });
    
    const champion = sorted[0];
    const runnerUp = sorted[1];
    champion.championships++;
    
    this.state.champions.push({
      year: this.state.year,
      team: champion.city + ' ' + champion.name,
      teamId: champion.id,
      record: champion.wins + '-' + champion.losses,
      runnerUp: runnerUp.city + ' ' + runnerUp.name
    });
    
    // Determine awards
    const aw = this.awardScores();
    const awardRecord = { year: this.state.year };
    
    const award = (key, list, type) => {
      if (list[0]) {
        const winner = list[0].player || list[0].team;
        awardRecord[key] = list[0].player ? { playerId: list[0].player.id, name: list[0].player.name } : { teamId: list[0].team.id, name: list[0].team.coachName };
        if (list[0].player) {
          winner.awards.push({ year: this.state.year, type });
        }
      }
    };
    award('mvp', aw.mvp, 'MVP');
    award('opoy', aw.opoy, 'OPOY');
    award('dpoy', aw.dpoy, 'DPOY');
    award('oroy', aw.oroy, 'OROY');
    award('droy', aw.droy, 'DROY');
    if (aw.coy[0]) {
      aw.coy[0].team.coachOfYears++;
      awardRecord.coy = { teamId: aw.coy[0].team.id, name: aw.coy[0].team.coachName };
    }
    this.state.awardsHistory.unshift(awardRecord);
    
    this.addHeadline({
      type: 'champ',
      title: `${champion.city} ${champion.name} win the ${this.state.year} championship`,
      body: `${champion.city} defeated ${runnerUp.city} to claim the title with a ${champion.wins}–${champion.losses} record.`
    });
    if (awardRecord.mvp) {
      this.addHeadline({ title: `${awardRecord.mvp.name} named ${this.state.year} MVP`, body: `An MVP-caliber season earns league's top individual honor.` });
    }
    if (awardRecord.dpoy) {
      this.addHeadline({ title: `${awardRecord.dpoy.name} wins Defensive Player of the Year`, body: `Voted the league's top defensive performer for the ${this.state.year} season.` });
    }
    if (awardRecord.coy) {
      this.addHeadline({ title: `${awardRecord.coy.name} named Coach of the Year`, body: `Honored for the most impactful coaching performance of the season.` });
    }
    
    // Update records
    const top = this.state.players.filter(p => !p.retired);
    top.forEach(p => {
      if (p.seasonStats.passingYards > this.state.records.seasonPassingYards.value) {
        this.state.records.seasonPassingYards = { value: p.seasonStats.passingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.rushingYards > this.state.records.seasonRushingYards.value) {
        this.state.records.seasonRushingYards = { value: p.seasonStats.rushingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.receivingYards > this.state.records.seasonReceivingYards.value) {
        this.state.records.seasonReceivingYards = { value: p.seasonStats.receivingYards, player: p.name, year: this.state.year };
      }
    });
    
    // Update team historical stats BEFORE resetting
    this.state.teams.forEach(t => {
      t.historicalStats.wins += t.wins;
      t.historicalStats.losses += t.losses;
      t.historicalStats.pointsFor += t.pointsFor;
      t.historicalStats.pointsAgainst += t.pointsAgainst;
      t.historicalStats.seasons++;
      if (t.id === champion.id) t.historicalStats.championships++;
      if (t.wins >= 10) t.historicalStats.playoffApps++;
    });
    
    // Age & retire players, accumulate career stats
    this.state.players.forEach(p => {
      if (p.retired) return;
      p.careerStats.passingYards += p.seasonStats.passingYards;
      p.careerStats.passingTDs += p.seasonStats.passingTDs;
      p.careerStats.rushingYards += p.seasonStats.rushingYards;
      p.careerStats.rushingTDs += p.seasonStats.rushingTDs;
      p.careerStats.receivingYards += p.seasonStats.receivingYards;
      p.careerStats.receivingTDs += p.seasonStats.receivingTDs;
      p.careerStats.sacks += p.seasonStats.sacks;
      p.careerStats.interceptionsMade += p.seasonStats.interceptionsMade;
      p.careerStats.tackles += p.seasonStats.tackles;
      p.careerStats.fieldGoalsMade += p.seasonStats.fieldGoalsMade;
      p.careerStats.touchdowns += p.seasonStats.touchdowns;
      p.careerStats.gamesPlayed += p.seasonStats.gamesPlayed || 16;
      p.careerStats.seasonsPlayed++;
      
      p.age++;
      p.yearsInLeague++;
      
      if (p.age >= 30) p.rating = Math.max(40, p.rating - Math.floor(Math.random() * 4));
      else if (p.age <= 25) p.rating = Math.min(99, p.rating + Math.floor(Math.random() * 3));
      
      if (p.age >= 35 || (p.age >= 32 && Math.random() < 0.3) || p.rating < 55) {
        p.retired = true;
        p.retiredYear = this.state.year;
        const isHOF = p.yearsInLeague >= 8 && (
          p.careerStats.passingYards > 25000 ||
          p.careerStats.rushingYards > 8000 ||
          p.careerStats.receivingYards > 8000 ||
          p.careerStats.touchdowns > 100 ||
          p.awards.length >= 2
        );
        if (isHOF) {
          p.hofInducted = true;
          this.state.hallOfFame.push({
            playerId: p.id, name: p.name, position: p.position,
            inductedYear: this.state.year + 5,
            careerStats: { ...p.careerStats },
            yearsInLeague: p.yearsInLeague,
            awards: [...p.awards]
          });
          this.addHeadline({ type: 'hof', title: `${p.name} retires after ${p.yearsInLeague} seasons`, body: `Legendary ${p.position} ${p.name} steps away from the game. ${this.formatCareerStats(p)}.` });
        } else if (p.yearsInLeague >= 5) {
          this.addHeadline({ title: `${p.name} announces retirement`, body: `${p.position} ${p.name} retires after ${p.yearsInLeague} seasons in the league.` });
        }
      }
      
      p.seasonStats = EMPTY_SEASON_STATS();
    });
    
    // Fill rosters with rookies
    this.state.teams.forEach(team => {
      team.roster = team.roster.filter(id => !this.state.players[id].retired);
      const byPos = {};
      team.roster.forEach(id => {
        const p = this.state.players[id];
        byPos[p.position] = (byPos[p.position] || 0) + 1;
      });
      Object.entries(POSITION_COUNTS).forEach(([pos, needed]) => {
        const cur = byPos[pos] || 0;
        for (let i = cur; i < needed; i++) {
          const np = this.generatePlayer(pos, team.id, 22);
          np.yearsInLeague = 0;
          this.state.players.push(np);
          team.roster.push(np.id);
        }
      });
      if (team.wins >= 10) team.playoffAppearances++;
      team.wins = 0; team.losses = 0; team.pointsFor = 0; team.pointsAgainst = 0;
      if (Math.random() < 0.1) {
        team.coachName = this.generateName(this.state.year);
        team.coachId = 'coach_' + team.id + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        team.coachWins = 0; team.coachLosses = 0;
      }
    });
    
    this.state.year++;
    this.state.week = 0;
    this.state.lastWeekRecap = null;
    
    const newEra = this.getCurrentEra();
    if (newEra.start === this.state.year) {
      this.addHeadline({ title: `New era begins: ${newEra.name}`, body: `The league enters a new chapter as the ${newEra.name} arrives.` });
    }
    
    this.generateSchedule();
    this.addHeadline({ title: `${this.state.year} season opens`, body: 'A new season begins with rosters refreshed and championship hopes renewed.' });
    
    this.currentView = this.state.userTeamId !== null ? 'myteam' : 'standings';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`[data-view="${this.currentView}"]`).classList.add('active');
    this.saveGame();
    this.render();
  },

  formatCareerStats(p) {
    const s = [];
    if (p.careerStats.passingYards > 0) s.push(p.careerStats.passingYards.toLocaleString() + ' pass yds');
    if (p.careerStats.rushingYards > 0) s.push(p.careerStats.rushingYards.toLocaleString() + ' rush yds');
    if (p.careerStats.receivingYards > 0) s.push(p.careerStats.receivingYards.toLocaleString() + ' rec yds');
    if (p.careerStats.touchdowns > 0) s.push(p.careerStats.touchdowns + ' TDs');
    return s.join(', ');
  },

  addHeadline(h) {
    this.state.headlines.unshift({ ...h, year: this.state.year, week: this.state.week });
    if (this.state.headlines.length > 150) this.state.headlines.pop();
  },

  ratingClass(r) {
    if (r >= 90) return 'rating-elite';
    if (r >= 80) return 'rating-great';
    if (r >= 70) return 'rating-good';
    if (r >= 60) return 'rating-avg';
    return 'rating-poor';
  },

  // ============================================================
  // RENDER ROUTER
  // ============================================================

  render() {
    if (!this.state) return;
    document.getElementById('currentYear').textContent = this.state.year;
    document.getElementById('currentWeek').textContent = this.state.week + '/16';
    document.getElementById('eraBadge').textContent = this.getCurrentEra().name;
    document.getElementById('simBtn').textContent = this.state.week >= 16 ? 'End Season →' : 'Simulate Week →';
    
    this.renderNews();
    
    switch (this.currentView) {
      case 'recap': this.renderRecap(); break;
      case 'standings': this.renderStandings(); break;
      case 'schedule': this.renderSchedule(); break;
      case 'teams': this.renderTeams(); break;
      case 'players': this.renderPlayers(); break;
      case 'statistics': this.renderStatistics(); break;
      case 'awards': this.renderAwards(); break;
      case 'myteam': this.renderMyTeam(); break;
      case 'hof': this.renderHOF(); break;
      case 'records': this.renderRecords(); break;
      case 'champions': this.renderChampions(); break;
      case 'about': this.renderAbout(); break;
      default: this.renderStandings();
    }
  },

  // ============================================================
  // MY TEAM
  // ============================================================

  renderMyTeam() {
    if (this.state.userTeamId === null || this.state.userTeamId === undefined) {
      this.currentView = 'standings'; this.render(); return;
    }
    const team = this.state.teams[this.state.userTeamId];
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const games = team.wins + team.losses;
    const pct = games > 0 ? (team.wins / games).toFixed(3) : '.000';
    
    let html = `<div class="page-header">
      <div class="page-title">${team.city} ${team.name}</div>
      <div class="page-subtitle">${team.conference} ${team.division} · Your franchise · ${this.state.year} season</div>
    </div>
    
    <div class="my-team-hero">
      <div class="my-team-hero-left">
        <div class="my-team-color" style="background:${team.primary}"></div>
        <div>
          <div class="my-team-name">${team.city} ${team.name}</div>
          <div class="my-team-meta">${team.conference} ${team.division}</div>
        </div>
      </div>
      <div class="my-team-stats">
        <div class="my-team-stat">
          <div class="my-team-stat-label">Record</div>
          <div class="my-team-stat-value">${team.wins}–${team.losses}</div>
        </div>
        <div class="my-team-stat">
          <div class="my-team-stat-label">PCT</div>
          <div class="my-team-stat-value">${pct}</div>
        </div>
        <div class="my-team-stat">
          <div class="my-team-stat-label">PF</div>
          <div class="my-team-stat-value">${team.pointsFor}</div>
        </div>
        <div class="my-team-stat">
          <div class="my-team-stat-label">PA</div>
          <div class="my-team-stat-value">${team.pointsAgainst}</div>
        </div>
        <div class="my-team-stat">
          <div class="my-team-stat-label">Titles</div>
          <div class="my-team-stat-value">${team.championships}</div>
        </div>
      </div>
    </div>
    
    <div class="coach-card">
      <div class="coach-face">${pixelFaceSVG(stringHash(team.coachId))}</div>
      <div>
        <div class="coach-label">Head Coach</div>
        <div class="coach-name">${team.coachName}</div>
        <div class="coach-meta">Career: ${team.coachWins}–${team.coachLosses}${team.coachOfYears > 0 ? ' · ' + team.coachOfYears + 'x Coach of the Year' : ''}</div>
      </div>
    </div>
    `;
    
    // Roster card with filters
    html += this.renderRosterCard(team, 'fullPage');
    
    document.getElementById('content').innerHTML = html;
  },

  renderRosterCard(team, ctx) {
    const allRoster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const filtered = this.rosterPosFilter === 'ALL' ? allRoster : allRoster.filter(p => p.position === this.rosterPosFilter);
    filtered.sort((a, b) => b.rating - a.rating);
    
    let html = `<div class="card">
      <div class="card-header">
        <div class="card-title">Roster</div>
        <div class="card-meta">${filtered.length} of ${allRoster.length} active</div>
      </div>
      <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
        <div class="draft-filters" style="margin:0">
          ${['ALL', ...POSITIONS_FOR_DRAFT].map(pos => `
            <button class="filter-btn ${this.rosterPosFilter === pos ? 'active' : ''}" onclick="game.setRosterFilter('${pos}', '${ctx}', ${team.id})">${pos}</button>
          `).join('')}
        </div>
      </div>
      <div class="roster-row head">
        <div>#</div><div>POS</div><div></div><div>NAME</div><div>AGE</div><div>OVR</div><div>YRS</div>
      </div>`;
    
    if (filtered.length === 0) {
      html += `<div class="empty-state" style="padding:32px">No players at this position</div>`;
    } else {
      filtered.forEach(p => {
        const rc = this.ratingClass(p.rating);
        html += `<div class="roster-row" onclick="game.showPlayer(${p.id})">
          <div class="jersey-num">${p.jerseyNumber}</div>
          <div><span class="position-tag">${p.position}</span></div>
          <div class="player-face-small">${pixelFaceSVG(p.faceSeed)}</div>
          <div>${p.name}</div>
          <div class="mono-num">${p.age}</div>
          <div><span class="rating ${rc}">${p.rating}</span></div>
          <div class="mono-num muted">${p.yearsInLeague}</div>
        </div>`;
      });
    }
    
    html += '</div>';
    return html;
  },

  setRosterFilter(pos, ctx, teamId) {
    this.rosterPosFilter = pos;
    if (ctx === 'fullPage') this.renderMyTeam();
    else if (ctx === 'modal') this.showTeam(teamId);
  },

  // ============================================================
  // RECAP
  // ============================================================

  renderRecap() {
    const recap = this.state.lastWeekRecap;
    if (!recap) { this.renderStandings(); return; }
    const userTeamId = this.state.userTeamId;
    
    let html = `<div class="page-header">
      <div class="page-title">Week ${recap.week} recap</div>
      <div class="page-subtitle">${this.state.year} season · ${recap.games.length} games · ${this.getCurrentEra().name}</div>
    </div>
    <div class="recap-section">
      <div class="section-label">Standout performances</div>
      <div class="standout-grid">
        ${this.renderStandoutCard('offense', 'Top offensive performance', recap.offensiveStandout)}
        ${this.renderStandoutCard('defense', 'Top defensive performance', recap.defensiveStandout)}
        ${this.renderStandoutCard('special', 'Top special teams performance', recap.specialStandout)}
      </div>
    </div>
    <div class="recap-section">
      <div class="section-label">All ${recap.games.length} games · Click any game for full box score</div>
      <div class="games-grid">`;
    
    recap.games.forEach(g => {
      const home = this.state.teams[g.homeTeam];
      const away = this.state.teams[g.awayTeam];
      const homeWon = g.homeScore > g.awayScore;
      const isUserGame = home.id === userTeamId || away.id === userTeamId;
      html += `<div class="game-card ${isUserGame ? 'user-game' : ''}" onclick="game.showBoxScore(${g.week}, ${g.homeTeam}, ${g.awayTeam})">
        <div class="game-card-teams">
          <div class="game-card-team ${!homeWon ? 'winner' : 'loser'}">
            <span class="team-abbr-inline">${away.abbr}</span>
            <span>${away.city} ${away.name}</span>
          </div>
          <div class="game-card-score ${homeWon ? 'loser' : ''}">${g.awayScore}</div>
        </div>
        <div class="game-card-teams">
          <div class="game-card-team ${homeWon ? 'winner' : 'loser'}">
            <span class="team-abbr-inline">${home.abbr}</span>
            <span>${home.city} ${home.name}</span>
          </div>
          <div class="game-card-score ${!homeWon ? 'loser' : ''}">${g.homeScore}</div>
        </div>
        <div class="game-card-detail">FINAL${isUserGame ? ' · your team' : ''}</div>
      </div>`;
    });
    html += '</div></div>';
    document.getElementById('content').innerHTML = html;
  },

  renderStandoutCard(type, label, standout) {
    if (!standout) {
      return `<div class="standout-card ${type}">
        <div></div>
        <div>
          <div class="standout-label">${label}</div>
          <div class="standout-name" style="color:var(--text-dim)">—</div>
          <div class="standout-meta">No standout performance</div>
        </div>
      </div>`;
    }
    const p = standout.player;
    const team = this.state.teams[p.team];
    const s = standout.stats;
    let line = '';
    if (type === 'offense') {
      const parts = [];
      if (s.passingYards > 0) parts.push(`${s.passingYards} pass yds${s.passingTDs ? ', ' + s.passingTDs + ' TD' : ''}`);
      if (s.rushingYards > 0) parts.push(`${s.rushingYards} rush yds${s.rushingTDs ? ', ' + s.rushingTDs + ' TD' : ''}`);
      if (s.receivingYards > 0) parts.push(`${s.receptions} rec, ${s.receivingYards} yds${s.receivingTDs ? ', ' + s.receivingTDs + ' TD' : ''}`);
      line = parts.join(' · ');
    } else if (type === 'defense') {
      const parts = [];
      if (s.tackles > 0) parts.push(`${s.tackles} tackles`);
      if (s.sacks > 0) parts.push(`${s.sacks} sack${s.sacks > 1 ? 's' : ''}`);
      if (s.interceptionsMade > 0) parts.push(`${s.interceptionsMade} INT`);
      line = parts.join(' · ');
    } else {
      const parts = [];
      if (s.fieldGoalsMade > 0) parts.push(`${s.fieldGoalsMade}/${s.fieldGoalsAttempted} FG`);
      if (s.extraPoints > 0) parts.push(`${s.extraPoints} XP`);
      line = parts.join(' · ');
    }
    return `<div class="standout-card ${type}">
      <div class="player-face-large" style="width:48px;height:48px">${pixelFaceSVG(p.faceSeed)}</div>
      <div>
        <div class="standout-label">${label}</div>
        <div class="standout-name">${p.name}</div>
        <div class="standout-meta">${p.position} · ${team.city} ${team.name}</div>
        <div class="standout-stat">${line}</div>
      </div>
    </div>`;
  },

  // ============================================================
  // BOX SCORE
  // ============================================================

  showBoxScore(week, homeId, awayId) {
    const g = this.state.schedule.find(g => g.week === week && g.homeTeam === homeId && g.awayTeam === awayId);
    if (!g || !g.played) return;
    const home = this.state.teams[homeId];
    const away = this.state.teams[awayId];
    const homeWon = g.homeScore > g.awayScore;
    
    let html = `<div class="boxscore-header">
      <div class="boxscore-team away">
        <div class="boxscore-team-name">${away.city} ${away.name}</div>
        <div class="boxscore-team-record">${away.wins}–${away.losses}</div>
      </div>
      <div class="boxscore-score-block">
        <div class="boxscore-score ${homeWon ? 'loser' : ''}">${g.awayScore}</div>
        <div class="boxscore-dash">·</div>
        <div class="boxscore-score ${!homeWon ? 'loser' : ''}">${g.homeScore}</div>
      </div>
      <div class="boxscore-team">
        <div class="boxscore-team-name">${home.city} ${home.name}</div>
        <div class="boxscore-team-record">${home.wins}–${home.losses}</div>
      </div>
    </div>`;
    
    [away, home].forEach(team => {
      const teamStats = Object.entries(g.playerStats)
        .filter(([pid]) => this.state.players[pid].team === team.id)
        .map(([pid, stats]) => ({ player: this.state.players[pid], stats }));
      
      html += `<div class="boxscore-team-header">
        <span class="team-color-bar" style="background:${team.primary}"></span>
        ${team.city} ${team.name}
      </div>`;
      
      const passing = teamStats.filter(t => t.stats.attempts > 0).sort((a, b) => b.stats.passingYards - a.stats.passingYards);
      if (passing.length) {
        html += `<div class="boxscore-stat-cat">Passing</div>
          <div class="box-row passing head"><div>PLAYER</div><div class="stat-num">C/A</div><div class="stat-num">YDS</div><div class="stat-num">TD</div></div>`;
        passing.forEach(({ player, stats }) => {
          html += `<div class="box-row passing">
            <div>${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
            <div class="stat-num">${stats.completions}/${stats.attempts}</div>
            <div class="stat-num">${stats.passingYards}</div>
            <div class="stat-num">${stats.passingTDs}</div>
          </div>`;
        });
      }
      
      const rushing = teamStats.filter(t => t.stats.carries > 0).sort((a, b) => b.stats.rushingYards - a.stats.rushingYards);
      if (rushing.length) {
        html += `<div class="boxscore-stat-cat">Rushing</div>
          <div class="box-row rushing head"><div>PLAYER</div><div class="stat-num">CAR/YDS</div><div class="stat-num">TD</div></div>`;
        rushing.forEach(({ player, stats }) => {
          html += `<div class="box-row rushing">
            <div>${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
            <div class="stat-num">${stats.carries}/${stats.rushingYards}</div>
            <div class="stat-num">${stats.rushingTDs}</div>
          </div>`;
        });
      }
      
      const receiving = teamStats.filter(t => t.stats.receptions > 0).sort((a, b) => b.stats.receivingYards - a.stats.receivingYards);
      if (receiving.length) {
        html += `<div class="boxscore-stat-cat">Receiving</div>
          <div class="box-row receiving head"><div>PLAYER</div><div class="stat-num">REC/YDS</div><div class="stat-num">TD</div></div>`;
        receiving.forEach(({ player, stats }) => {
          html += `<div class="box-row receiving">
            <div>${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
            <div class="stat-num">${stats.receptions}/${stats.receivingYards}</div>
            <div class="stat-num">${stats.receivingTDs}</div>
          </div>`;
        });
      }
      
      const defense = teamStats.filter(t => t.stats.tackles > 0 || t.stats.sacks > 0 || t.stats.interceptionsMade > 0).sort((a, b) => (b.stats.sacks * 5 + b.stats.interceptionsMade * 8 + b.stats.tackles) - (a.stats.sacks * 5 + a.stats.interceptionsMade * 8 + a.stats.tackles));
      if (defense.length) {
        html += `<div class="boxscore-stat-cat">Defense</div>
          <div class="box-row defense head"><div>PLAYER</div><div class="stat-num">TKL/SCK</div><div class="stat-num">INT</div></div>`;
        defense.forEach(({ player, stats }) => {
          html += `<div class="box-row defense">
            <div>${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
            <div class="stat-num">${stats.tackles}/${stats.sacks}</div>
            <div class="stat-num">${stats.interceptionsMade}</div>
          </div>`;
        });
      }
      
      const kicking = teamStats.filter(t => t.stats.fieldGoalsAttempted > 0 || t.stats.extraPoints > 0);
      if (kicking.length) {
        html += `<div class="boxscore-stat-cat">Kicking</div>
          <div class="box-row kicking head"><div>PLAYER</div><div class="stat-num">FG</div><div class="stat-num">XP</div></div>`;
        kicking.forEach(({ player, stats }) => {
          html += `<div class="box-row kicking">
            <div>${player.name} <span style="color:var(--text-muted);font-size:10px">${player.position}</span></div>
            <div class="stat-num">${stats.fieldGoalsMade}/${stats.fieldGoalsAttempted}</div>
            <div class="stat-num">${stats.extraPoints}</div>
          </div>`;
        });
      }
    });
    
    this.showModal(`Week ${week} · ${away.abbr} @ ${home.abbr}`, html);
  },

  // ============================================================
  // STANDINGS, SCHEDULE, TEAMS, PLAYERS
  // ============================================================

  renderStandings() {
    const divs = ['East', 'North', 'South', 'West'];
    const confs = ['AFC', 'NFC'];
    let html = `<div class="page-header">
      <div class="page-title">Standings</div>
      <div class="page-subtitle">${this.state.year} season · Week ${this.state.week} of 16 · ${this.getCurrentEra().name}</div>
    </div>`;
    
    if (this.state.lastWeekRecap) {
      html += `<div style="margin-bottom:16px"><button class="btn" onclick="game.currentView='recap';game.render()">← View Week ${this.state.lastWeekRecap.week} recap</button></div>`;
    }
    
    confs.forEach(conf => {
      html += `<div class="card">
        <div class="card-header"><div class="card-title">${conf === 'AFC' ? 'American Conference' : 'National Conference'}</div></div>`;
      divs.forEach(div => {
        const teams = this.state.teams.filter(t => t.conference === conf && t.division === div).sort((a, b) => {
          if (b.wins !== a.wins) return b.wins - a.wins;
          return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
        });
        html += `<div class="division-label">${conf} ${div}</div>
          <table><thead><tr>
            <th style="width:50%">Team</th><th class="text-center">W</th><th class="text-center">L</th>
            <th class="text-center">PCT</th><th class="text-center">PF</th><th class="text-center">PA</th><th class="text-center">DIFF</th>
          </tr></thead><tbody>`;
        teams.forEach((t, idx) => {
          const games = t.wins + t.losses;
          const pct = games > 0 ? (t.wins / games).toFixed(3) : '.000';
          const diff = t.pointsFor - t.pointsAgainst;
          const isUser = t.id === this.state.userTeamId;
          html += `<tr onclick="game.showTeam(${t.id})" ${isUser ? 'class="user-row"' : ''}>
            <td>
              <span class="team-color-bar" style="background:${t.primary}"></span>
              <strong>${t.city} ${t.name}</strong>
              ${idx === 0 && t.wins > 0 ? '<span class="leader-badge">DIV</span>' : ''}
              ${isUser ? '<span class="leader-badge" style="background:#ca8a04">YOU</span>' : ''}
            </td>
            <td class="text-center mono-num">${t.wins}</td>
            <td class="text-center mono-num">${t.losses}</td>
            <td class="text-center mono-num">${pct}</td>
            <td class="text-center mono-num muted">${t.pointsFor}</td>
            <td class="text-center mono-num muted">${t.pointsAgainst}</td>
            <td class="text-center mono-num ${diff > 0 ? 'win' : diff < 0 ? 'loss' : 'muted'}">${diff > 0 ? '+' : ''}${diff}</td>
          </tr>`;
        });
        html += '</tbody></table>';
      });
      html += '</div>';
    });
    document.getElementById('content').innerHTML = html;
  },

  renderSchedule() {
    const wn = Math.max(1, this.state.week);
    const weekGames = this.state.schedule.filter(g => g.week === wn);
    const upcoming = this.state.schedule.filter(g => g.week === this.state.week + 1 && this.state.week < 16);
    
    let html = `<div class="page-header"><div class="page-title">Schedule</div><div class="page-subtitle">${this.state.year} season</div></div>`;
    
    if (this.state.week > 0) {
      html += `<div class="card"><div class="card-header">
        <div class="card-title">Week ${this.state.week} results</div>
        <div class="card-meta">${weekGames.length} games · click for box score</div>
      </div>`;
      weekGames.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        const homeWon = g.homeScore > g.awayScore;
        html += `<div class="game-row" onclick="game.showBoxScore(${g.week}, ${g.homeTeam}, ${g.awayTeam})" style="cursor:pointer">
          <div class="team-side away">
            <span class="team-name-inline">${away.city} ${away.name}</span>
            <span class="team-abbr">${away.abbr}</span>
          </div>
          <div class="score">
            <span class="${!homeWon ? 'winner' : 'loser'}">${g.awayScore}</span>
            <span class="at"> – </span>
            <span class="${homeWon ? 'winner' : 'loser'}">${g.homeScore}</span>
          </div>
          <div class="team-side">
            <span class="team-abbr">${home.abbr}</span>
            <span class="team-name-inline">${home.city} ${home.name}</span>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    
    if (upcoming.length > 0) {
      html += `<div class="card"><div class="card-header"><div class="card-title">Week ${this.state.week + 1} upcoming</div><div class="card-meta">${upcoming.length} games</div></div>`;
      upcoming.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        html += `<div class="game-row">
          <div class="team-side away">
            <span class="team-name-inline">${away.city} ${away.name}</span>
            <span class="team-abbr">${away.abbr}</span>
          </div>
          <div class="score"><span class="at">@</span></div>
          <div class="team-side">
            <span class="team-abbr">${home.abbr}</span>
            <span class="team-name-inline">${home.city} ${home.name}</span>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  renderTeams() {
    let html = `<div class="page-header"><div class="page-title">Teams</div><div class="page-subtitle">All 32 franchises · Click for roster</div></div><div class="team-grid">`;
    this.state.teams.forEach(t => {

        <div class="team-card-name">${t.city} ${t.name} ${isUser ? '<span class="leader-badge" style="background:#ca8a04;margin-left:4px">YOU</span>' : ''}</div>

        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:24px;font-size:13px">

        <div><span class="muted">PF:</span> <strong class="mono">${team.pointsFor}</strong></div>

    const html = `<div class="player-detail">
      <div class="player-detail-header">
        <div class="player-face-large">${pixelFaceSVG(stringHash(team.coachId))}</div>

    if (!p) return;

    const rc = this.ratingClass(p.rating);
    
    let awardHtml = '';
    if (p.awards && p.awards.length) {
      awardHtml = `<div class="section-label">Awards (${p.awards.length})</div>
        <div style="margin-bottom:16px;font-size:13px">
          ${p.awards.map(a => `<div style="padding:4px 0"><span class="mono" style="color:var(--text-muted)">${a.year}</span> · <strong>${a.type}</strong></div>`).join('')}
        </div>`;
    }
    
    let html = `<div class="player-detail">
      <div class="player-detail-header">
        <div class="player-face-large">${pixelFaceSVG(p.faceSeed)}</div>
        <div>
          <div class="player-name-big">${p.name}</div>
          <div class="player-meta">#${p.jerseyNumber} · ${p.position} · ${team ? team.city + ' ' + team.name : 'Free Agent'}</div>
          <div><span class="rating ${rc}" style="font-size:14px;padding:4px 12px">${p.rating} OVR</span></div>
        </div>
      </div>
      <div class="player-detail-body">
        <div class="section-label">Profile</div>
        <table class="stat-table">
          <tr><td>Age</td><td>${p.age}</td></tr>
          <tr><td>Years in league</td><td>${p.yearsInLeague}</td></tr>
          <tr><td>Position</td><td>${p.position}</td></tr>
          <tr><td>Jersey</td><td>#${p.jerseyNumber}</td></tr>
        </table>
        ${awardHtml}
        <div class="section-label">${this.state.year} season</div>
        ${this.renderPlayerStatsTable(p.seasonStats, p.position)}
        <div class="section-label">Career</div>
        ${this.renderPlayerStatsTable(p.careerStats, p.position, true)}
      </div>
    </div>`;
    this.showModal(p.name, html);
  },

  renderPlayerStatsTable(stats, pos, isCareer) {
    const r = [];
    if (pos === 'QB') {
      r.push(['Passing yards', stats.passingYards.toLocaleString()]);
      r.push(['Passing TDs', stats.passingTDs]);
    }
    if (['QB', 'RB'].includes(pos)) {
      r.push(['Rushing yards', stats.rushingYards.toLocaleString()]);
      r.push(['Rushing TDs', stats.rushingTDs]);
    }
    if (['WR', 'TE', 'RB'].includes(pos)) {
      r.push(['Receiving yards', stats.receivingYards.toLocaleString()]);
      r.push(['Receiving TDs', stats.receivingTDs]);
    }
    if (['DL', 'LB'].includes(pos)) {
      r.push(['Sacks', stats.sacks]);
      r.push(['Tackles', stats.tackles || 0]);
    }
    if (['CB', 'S'].includes(pos)) {
      r.push(['Tackles', stats.tackles || 0]);
      r.push(['Interceptions', stats.interceptionsMade || 0]);
    }
    if (pos === 'K') {
      r.push(['Field goals', stats.fieldGoalsMade]);
      if (!isCareer) r.push(['FG attempted', stats.fieldGoalsAttempted]);
      r.push(['Extra points', stats.extraPoints || 0]);
    }
    r.push(['Total TDs', stats.touchdowns]);
    if (isCareer) {
      r.push(['Games played', stats.gamesPlayed]);
      r.push(['Seasons', stats.seasonsPlayed || 0]);
    }
    return '<table class="stat-table">' + r.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
  },

  renderPlayers() {
    const top = this.state.players.filter(p => !p.retired).sort((a, b) => b.rating - a.rating).slice(0, 50);
    let html = `<div class="page-header">
      <div class="page-title">Players</div>
      <div class="page-subtitle">Top 50 by overall rating · ${this.state.players.filter(p => !p.retired).length} active leaguewide</div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Overall rating leaders</div></div>
      <div class="roster-row head">
        <div>RK</div><div>POS</div><div></div><div>NAME</div><div>AGE</div><div>OVR</div><div>TEAM</div>
      </div>`;
    top.forEach((p, i) => {
      const rc = this.ratingClass(p.rating);
      html += `<div class="roster-row" onclick="game.showPlayer(${p.id})">
        <div class="jersey-num">${i + 1}</div>
        <div><span class="position-tag">${p.position}</span></div>
        <div class="player-face-small">${pixelFaceSVG(p.faceSeed)}</div>
        <div>${p.name}</div>
        <div class="mono-num">${p.age}</div>
        <div><span class="rating ${rc}">${p.rating}</span></div>
        <div class="mono-num muted">${this.state.teams[p.team].abbr}</div>
      </div>`;

    html += '</div>';
    document.getElementById('content').innerHTML = html;
  },

  // ============================================================
  // STATISTICS
  // ============================================================

  renderStatistics() {
    let html = `<div class="page-header">
      <div class="page-title">Statistics</div>
      <div class="page-subtitle">League leaders across seasons and history</div>
    </div>
    <div class="tab-bar">
      <div class="tab ${this.statsTab === 'season' ? 'active' : ''}" onclick="game.setStatsTab('season')">Current Season</div>
      <div class="tab ${this.statsTab === 'alltime' ? 'active' : ''}" onclick="game.setStatsTab('alltime')">All-Time</div>
      <div class="tab ${this.statsTab === 'byteam' ? 'active' : ''}" onclick="game.setStatsTab('byteam')">By Team (Historical)</div>
    </div>`;
    
    if (this.statsTab === 'season') {
      html += this.renderSeasonStats();
    } else if (this.statsTab === 'alltime') {
      html += this.renderAllTimeStats();
    } else {
      html += this.renderByTeamStats();
    }
    
    document.getElementById('content').innerHTML = html;
  },

  setStatsTab(tab) { this.statsTab = tab; this.renderStatistics(); },

  renderSeasonStats() {
    const pl = this.state.players.filter(p => !p.retired);
    const sections = [
      { label: 'Passing yards', stat: 'passingYards', extra: 'passingTDs', extraLabel: 'TD' },
      { label: 'Passing TDs', stat: 'passingTDs', extra: 'passingYards', extraLabel: 'yds' },
      { label: 'Rushing yards', stat: 'rushingYards', extra: 'rushingTDs', extraLabel: 'TD' },
      { label: 'Receiving yards', stat: 'receivingYards', extra: 'receptions', extraLabel: 'rec' },
      { label: 'Receiving TDs', stat: 'receivingTDs', extra: 'receivingYards', extraLabel: 'yds' },
      { label: 'Sacks', stat: 'sacks', extra: 'tackles', extraLabel: 'tkl' },
      { label: 'Interceptions', stat: 'interceptionsMade', extra: 'tackles', extraLabel: 'tkl' },
      { label: 'Tackles', stat: 'tackles', extra: 'sacks', extraLabel: 'sk' },
      { label: 'Field goals', stat: 'fieldGoalsMade', extra: 'fieldGoalsAttempted', extraLabel: 'att' }
    ];
    
    let html = '';
    sections.forEach(sec => {
      const leaders = [...pl].sort((a, b) => b.seasonStats[sec.stat] - a.seasonStats[sec.stat]).slice(0, 5);
      if (!leaders[0] || leaders[0].seasonStats[sec.stat] === 0) return;
      html += `<div class="card">
        <div class="card-header"><div class="card-title">${sec.label}</div><div class="card-meta">${this.state.year} season</div></div>`;
      leaders.forEach((p, i) => {
        const team = this.state.teams[p.team];
        html += `<div class="leader-row">
          <div class="leader-rank">${i + 1}</div>
          <div><span class="leader-name">${p.name}</span><span class="leader-team">${team.abbr} · ${p.position}</span></div>
          <div class="leader-stat">${p.seasonStats[sec.stat].toLocaleString()} · ${p.seasonStats[sec.extra]} ${sec.extraLabel}</div>
        </div>`;
      });
      html += '</div>';
    });
    
    if (!html) html = '<div class="card"><div class="empty-state">No stats yet. Simulate at least one week.</div></div>';
    return html;
  },

  renderAllTimeStats() {
    const allPlayers = this.state.players; // includes retired
    const sections = [
      { label: 'Career passing yards', stat: 'passingYards' },
      { label: 'Career passing TDs', stat: 'passingTDs' },
      { label: 'Career rushing yards', stat: 'rushingYards' },
      { label: 'Career rushing TDs', stat: 'rushingTDs' },
      { label: 'Career receiving yards', stat: 'receivingYards' },
      { label: 'Career receiving TDs', stat: 'receivingTDs' },
      { label: 'Career sacks', stat: 'sacks' },
      { label: 'Career interceptions', stat: 'interceptionsMade' },
      { label: 'Career touchdowns', stat: 'touchdowns' },
      { label: 'Games played', stat: 'gamesPlayed' }
    ];
    
    let html = '';
    sections.forEach(sec => {
      const leaders = [...allPlayers].sort((a, b) => b.careerStats[sec.stat] - a.careerStats[sec.stat]).slice(0, 5);
      if (!leaders[0] || leaders[0].careerStats[sec.stat] === 0) return;
      html += `<div class="card">
        <div class="card-header"><div class="card-title">${sec.label}</div><div class="card-meta">All-time</div></div>`;
      leaders.forEach((p, i) => {
        const teamLabel = p.retired ? 'RET' : (p.team !== null ? this.state.teams[p.team].abbr : '—');
        html += `<div class="leader-row">
          <div class="leader-rank">${i + 1}</div>
          <div><span class="leader-name">${p.name}</span><span class="leader-team">${teamLabel} · ${p.position}${p.hofInducted ? ' · HOF' : ''}</span></div>
          <div class="leader-stat">${p.careerStats[sec.stat].toLocaleString()}</div>
        </div>`;
      });
      html += '</div>';
    });
    
    if (!html) html = '<div class="card"><div class="empty-state">No career stats yet. Complete at least one season.</div></div>';
    return html;
  },

  renderByTeamStats() {
    let html = `<div class="card"><div class="card-header"><div class="card-title">Franchise records</div><div class="card-meta">All-time</div></div>
      <table><thead><tr>
        <th>Team</th>
        <th class="text-center">Seasons</th>
        <th class="text-center">W</th><th class="text-center">L</th><th class="text-center">PCT</th>
        <th class="text-center">PF</th><th class="text-center">PA</th>
        <th class="text-center">Titles</th><th class="text-center">Playoff</th>
      </tr></thead><tbody>`;
    
    const sorted = [...this.state.teams].sort((a, b) => {
      const aw = a.historicalStats.wins + a.wins;
      const bw = b.historicalStats.wins + b.wins;
      return bw - aw;
    });
    
    sorted.forEach(t => {
      const totalW = t.historicalStats.wins + t.wins;
      const totalL = t.historicalStats.losses + t.losses;
      const games = totalW + totalL;
      const pct = games > 0 ? (totalW / games).toFixed(3) : '.000';
      const isUser = t.id === this.state.userTeamId;
      html += `<tr onclick="game.showTeam(${t.id})" ${isUser ? 'class="user-row"' : ''}>
        <td><span class="team-color-bar" style="background:${t.primary}"></span><strong>${t.city} ${t.name}</strong>${isUser ? ' <span class="leader-badge" style="background:#ca8a04">YOU</span>' : ''}</td>
        <td class="text-center mono-num">${t.historicalStats.seasons + 1}</td>
        <td class="text-center mono-num win">${totalW}</td>
        <td class="text-center mono-num loss">${totalL}</td>
        <td class="text-center mono-num">${pct}</td>
        <td class="text-center mono-num muted">${(t.historicalStats.pointsFor + t.pointsFor).toLocaleString()}</td>
        <td class="text-center mono-num muted">${(t.historicalStats.pointsAgainst + t.pointsAgainst).toLocaleString()}</td>
        <td class="text-center mono-num">${t.championships}</td>
        <td class="text-center mono-num muted">${t.historicalStats.playoffApps}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  },

  // ============================================================
  // AWARDS
  // ============================================================

  renderAwards() {
    const aw = this.awardScores();
    const isInSeason = this.state.week > 0 && this.state.week <= 16;
    
    let html = `<div class="page-header">
      <div class="page-title">Awards</div>
      <div class="page-subtitle">${isInSeason ? `Current ${this.state.year} favorites · Week ${this.state.week}` : 'Awards page'}</div>
    </div>`;
    
    if (!isInSeason && this.state.awardsHistory.length === 0) {
      html += '<div class="card"><div class="empty-state">No awards data yet. Simulate at least one week.</div></div>';
      document.getElementById('content').innerHTML = html;
      return;
    }
    
    if (isInSeason) {
      html += '<div class="section-label">Current race · Live favorites</div>';
      
      html += this.renderAwardCard('Most Valuable Player', 'MVP', aw.mvp.slice(0, 5),
        'Heavily weighted toward QBs. Formula: passing yds × 0.06 + TDs × 10 − INTs × 8 + rushing contribution, multiplied by 1.4 for QBs and scaled by team win pct.', 'player');
      
      html += this.renderAwardCard('Offensive Player of the Year', 'OPOY', aw.opoy.slice(0, 5),
        'Best offensive performer regardless of position. Formula: 0.1 × yardage + 7–8 × TDs across passing, rushing, and receiving.', 'player');
      
      html += this.renderAwardCard('Defensive Player of the Year', 'DPOY', aw.dpoy.slice(0, 5),
        'Sacks × 6 + INTs × 8 + tackles × 0.8. DL gets a small positional bonus to reflect real DPOY voting tendencies.', 'player');
      
      html += this.renderAwardCard('Offensive Rookie of the Year', 'OROY', aw.oroy.slice(0, 5),
        'Same formula as OPOY, but eligibility limited to players in their first season.', 'player');
      
      html += this.renderAwardCard('Defensive Rookie of the Year', 'DROY', aw.droy.slice(0, 5),
        'Same formula as DPOY, but eligibility limited to defensive rookies.', 'player');
      
      html += this.renderAwardCard('Coach of the Year', 'COY', aw.coy.slice(0, 5),
        'Total wins × 10 + (win pct improvement from prior franchise pct × 80). Rewards both team success and exceeding expectations.', 'coach');
    }
    
    // Past winners
    if (this.state.awardsHistory.length > 0) {
      html += '<div class="section-label" style="margin-top:24px">Past winners</div>';
      html += '<div class="card"><table><thead><tr><th>Year</th><th>MVP</th><th>OPOY</th><th>DPOY</th><th>OROY</th><th>DROY</th><th>COY</th></tr></thead><tbody>';
      this.state.awardsHistory.slice(0, 30).forEach(a => {
        html += `<tr>
          <td class="mono-num"><strong>${a.year}</strong></td>
          <td>${a.mvp ? a.mvp.name : '—'}</td>
          <td>${a.opoy ? a.opoy.name : '—'}</td>
          <td>${a.dpoy ? a.dpoy.name : '—'}</td>
          <td>${a.oroy ? a.oroy.name : '—'}</td>
          <td>${a.droy ? a.droy.name : '—'}</td>
          <td>${a.coy ? a.coy.name : '—'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
    
    document.getElementById('content').innerHTML = html;
  },

  renderAwardCard(title, key, favorites, formula, type) {
    let html = `<div class="award-card">
      <div class="award-header">${key}</div>
      <div class="award-title">${title}</div>
      <div class="award-formula">${formula}</div>`;
    
    if (favorites.length === 0) {
      html += '<div class="muted" style="font-size:12px">No qualifying candidates yet</div>';
    } else {
      favorites.forEach((f, i) => {
        if (type === 'player') {
          const p = f.player;
          const team = this.state.teams[p.team];
          const s = p.seasonStats;
          let line = '';
          if (key === 'MVP' || key === 'OPOY' || key === 'OROY') {
            const parts = [];
            if (s.passingYards > 100) parts.push(`${s.passingYards} pass · ${s.passingTDs} TD`);
            if (s.rushingYards > 50) parts.push(`${s.rushingYards} rush · ${s.rushingTDs} TD`);
            if (s.receivingYards > 50) parts.push(`${s.receivingYards} rec · ${s.receivingTDs} TD`);
            line = parts.join(' · ');
          } else {
            const parts = [];
            if (s.sacks > 0) parts.push(`${s.sacks} sk`);
            if (s.interceptionsMade > 0) parts.push(`${s.interceptionsMade} INT`);
            if (s.tackles > 0) parts.push(`${s.tackles} tkl`);
            line = parts.join(' · ');
          }
          html += `<div class="award-fav-row" style="cursor:pointer" onclick="game.showPlayer(${p.id})">
            <div class="award-rank ${i === 0 ? 'first' : ''}">${i + 1}</div>
            <div class="player-face-small" style="width:32px;height:32px">${pixelFaceSVG(p.faceSeed)}</div>
            <div>
              <div class="award-fav-name">${p.name}</div>
              <div class="award-fav-meta">${p.position} · ${team.abbr} · ${line}</div>
            </div>
            <div class="award-fav-stat">${f.score.toFixed(0)} pts</div>
          </div>`;
        } else {
          // coach
          const t = f.team;
          html += `<div class="award-fav-row" style="cursor:pointer" onclick="game.showCoach(${t.id})">
            <div class="award-rank ${i === 0 ? 'first' : ''}">${i + 1}</div>
            <div class="coach-face" style="width:32px;height:32px">${pixelFaceSVG(stringHash(t.coachId))}</div>
            <div>
              <div class="award-fav-name">${t.coachName}</div>
              <div class="award-fav-meta">${t.city} ${t.name} · ${t.wins}–${t.losses}</div>
            </div>
            <div class="award-fav-stat">${f.score.toFixed(0)} pts</div>
          </div>`;
        }
      });
    }
    html += '</div>';
    return html;
  },

  // ============================================================
  // HOF, RECORDS, CHAMPIONS, ABOUT
  // ============================================================

  renderHOF() {
    let html = `<div class="page-header"><div class="page-title">Hall of Fame</div><div class="page-subtitle">${this.state.hallOfFame.length} inductee${this.state.hallOfFame.length !== 1 ? 's' : ''} all-time</div></div>`;
    if (!this.state.hallOfFame.length) {
      html += `<div class="card"><div class="empty-state">No inductees yet.</div></div>`;
    } else {
      html += '<div class="card">';
      [...this.state.hallOfFame].sort((a, b) => b.inductedYear - a.inductedYear).forEach(p => {
        html += `<div class="hof-row" onclick="game.showPlayer(${p.playerId})" style="cursor:pointer">
          <div class="hof-year-class">Class of ${p.inductedYear}</div>
          <div>
            <div class="hof-name-main">${p.name}</div>
            <div class="hof-pos">${p.position} · ${p.yearsInLeague} seasons · ${p.careerStats.gamesPlayed} games${p.awards && p.awards.length ? ' · ' + p.awards.length + ' awards' : ''}</div>
          </div>
          <div class="hof-stats">
            ${p.careerStats.passingYards > 1000 ? p.careerStats.passingYards.toLocaleString() + ' pass<br>' : ''}
            ${p.careerStats.rushingYards > 1000 ? p.careerStats.rushingYards.toLocaleString() + ' rush<br>' : ''}
            ${p.careerStats.receivingYards > 1000 ? p.careerStats.receivingYards.toLocaleString() + ' rec<br>' : ''}
            ${p.careerStats.touchdowns} TD
          </div>
        </div>`;
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  renderRecords() {
    const r = this.state.records;
    let html = `<div class="page-header"><div class="page-title">Records</div><div class="page-subtitle">All-time league records</div></div>
      <div class="card"><div class="card-header"><div class="card-title">Single-season records</div></div>
      <div class="record-item">
        <div class="record-label">Passing yards</div>
        <div class="record-value">${r.seasonPassingYards.value.toLocaleString()}</div>
        ${r.seasonPassingYards.player ? `<div class="record-holder">${r.seasonPassingYards.player} · ${r.seasonPassingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
      <div class="record-item">
        <div class="record-label">Rushing yards</div>
        <div class="record-value">${r.seasonRushingYards.value.toLocaleString()}</div>
        ${r.seasonRushingYards.player ? `<div class="record-holder">${r.seasonRushingYards.player} · ${r.seasonRushingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
      <div class="record-item">
        <div class="record-label">Receiving yards</div>
        <div class="record-value">${r.seasonReceivingYards.value.toLocaleString()}</div>
        ${r.seasonReceivingYards.player ? `<div class="record-holder">${r.seasonReceivingYards.player} · ${r.seasonReceivingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
      </div>`;
    document.getElementById('content').innerHTML = html;
  },

  renderChampions() {
    let html = `<div class="page-header"><div class="page-title">Champions</div><div class="page-subtitle">${this.state.champions.length} season${this.state.champions.length !== 1 ? 's' : ''} completed</div></div>`;
    if (!this.state.champions.length) {
      html += `<div class="card"><div class="empty-state">No champions yet.</div></div>`;
    } else {
      html += '<div class="card">';
      [...this.state.champions].reverse().forEach(c => {
        html += `<div class="champ-row" ${c.teamId !== undefined ? `onclick="game.showTeam(${c.teamId})" style="cursor:pointer"` : ''}>
          <div class="champ-year">${c.year}</div>
          <div>
            <div class="champ-team">${c.team}</div>
            <div class="champ-record">${c.record}</div>
          </div>
          <div class="champ-runnerup">def. ${c.runnerUp}</div>
        </div>`;
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  renderAbout() {
    document.getElementById('content').innerHTML = `<div class="page-header">
      <div class="page-title">About</div>
      <div class="page-subtitle">Gridiron Dynasty v1.2</div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">League overview</div></div>
      <div class="stats-grid">
        <div class="stat-block"><div class="stat-block-label">Current era</div><div class="stat-block-value" style="font-size:14px;font-family:inherit">${this.getCurrentEra().name}</div></div>
        <div class="stat-block"><div class="stat-block-label">Seasons</div><div class="stat-block-value">${this.state.year - 1970}</div></div>
        <div class="stat-block"><div class="stat-block-label">Active players</div><div class="stat-block-value">${this.state.players.filter(p => !p.retired).length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Hall of Famers</div><div class="stat-block-value">${this.state.hallOfFame.length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Champions</div><div class="stat-block-value">${this.state.champions.length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Total players</div><div class="stat-block-value">${this.state.players.length}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">League management</div></div>
      <div style="padding:16px;display:flex;gap:8px">
        <button class="btn" onclick="game.showModeChoice()">Start new league</button>
        <button class="btn btn-danger" onclick="game.deleteSave()">Delete save</button>
      </div>
    </div>`;
  },

  renderNews() {
    const el = document.getElementById('newsContent');
    document.getElementById('newsCount').textContent = this.state.headlines.length;
    if (!this.state.headlines.length) {
      el.innerHTML = '<div class="empty-state" style="padding:24px 0;font-size:12px">No news yet</div>';
      return;
    }
    let html = '';
    this.state.headlines.slice(0, 40).forEach(h => {
      const cls = h.type ? 'headline ' + h.type : 'headline';
      html += `<div class="${cls}">
        <div class="headline-date">${h.year}${h.week > 0 ? ' · Wk ' + h.week : ''}</div>
        <div class="headline-title">${h.title}</div>
        <div class="headline-body">${h.body}</div>
      </div>`;
    });
    el.innerHTML = html;
  },

  showModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('show');
  },

  saveGame() {
    try { localStorage.setItem('gridironDynastySave', JSON.stringify(this.state)); }
    catch (e) { console.error('Save failed:', e); }
  },

  loadGame() {
    try {
      const s = localStorage.getItem('gridironDynastySave');
      if (s) { this.state = JSON.parse(s); return true; }
    } catch (e) { console.error('Load failed:', e); }
    return false;
  },

  deleteSave() {
    if (!confirm('Delete your save? This cannot be undone.')) return;
    localStorage.removeItem('gridironDynastySave');
    this.state = null;
    this.showWelcome();
    document.getElementById('userTeamTag').style.display = 'none';
    document.getElementById('navMyTeam').style.display = 'none';
  }
};

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

game.init();
</script>

</body>
</html>
