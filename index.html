
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Dynasty</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --surface-2: #f5f5f4;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
  --text: #1c1917;
  --text-muted: #78716c;
  --text-dim: #a8a29e;
  --accent: #1c1917;
  --success: #15803d;
  --danger: #b91c1c;
  --warning: #b45309;
  --info: #1e40af;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}

.mono { font-family: 'JetBrains Mono', monospace; }

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  background: var(--text);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.5px;
}

.brand-name {
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.2px;
}

.brand-name span {
  color: var(--text-muted);
  font-weight: 400;
}

.status-bar {
  display: flex;
  gap: 24px;
  align-items: center;
}

.status-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.status-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.status-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 500;
}

.era-tag {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

/* LAYOUT */
main {
  display: grid;
  grid-template-columns: 200px 1fr 320px;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
}

.nav-section {
  margin-bottom: 20px;
}

.nav-title {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 0 20px 8px;
  font-weight: 600;
}

.nav-item {
  padding: 7px 20px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.1s;
  border-left: 2px solid transparent;
}

.nav-item:hover { background: var(--surface-2); }

.nav-item.active {
  background: var(--surface-2);
  border-left-color: var(--text);
  font-weight: 500;
}

.nav-icon {
  width: 16px;
  display: inline-flex;
  justify-content: center;
  opacity: 0.6;
}

.nav-item.active .nav-icon { opacity: 1; }

/* CONTENT */
.content {
  background: var(--bg);
  overflow-y: auto;
  padding: 24px 32px;
}

.page-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
}

.page-subtitle {
  color: var(--text-muted);
  font-size: 13px;
}

/* CARDS / PANELS */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.card-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-title {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.2px;
}

.card-meta {
  font-size: 12px;
  color: var(--text-muted);
}

.card-body { padding: 0; }

/* TABLES */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

tbody tr {
  transition: background 0.1s;
  cursor: pointer;
}

tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }

.text-center { text-align: center; }
.text-right { text-align: right; }
.mono-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

.win { color: var(--success); font-weight: 500; }
.loss { color: var(--danger); }
.muted { color: var(--text-muted); }
.dim { color: var(--text-dim); }

/* BUTTONS */
.btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 7px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  background: var(--surface-2);
  border-color: var(--text-muted);
}

.btn-primary {
  background: var(--text);
  color: white;
  border-color: var(--text);
}

.btn-primary:hover {
  background: #292524;
  border-color: #292524;
}

.btn-danger {
  color: var(--danger);
  border-color: var(--border-strong);
}

.btn-danger:hover {
  background: #fef2f2;
  border-color: var(--danger);
}

.btn-lg {
  padding: 10px 20px;
  font-size: 14px;
}

/* DIVISION SECTION */
.division-block { margin-bottom: 24px; }
.division-block:last-child { margin-bottom: 0; }

.division-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 16px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.team-color-bar {
  display: inline-block;
  width: 3px;
  height: 14px;
  vertical-align: middle;
  margin-right: 8px;
}

.leader-badge {
  display: inline-block;
  background: var(--text);
  color: white;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.5px;
}

/* NEWS FEED */
.news-feed {
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

.news-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.headline {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: default;
}

.headline:last-child { border-bottom: none; }

.headline-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.headline-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 4px;
}

.headline-body {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.45;
}

.headline.scandal .headline-title { color: var(--danger); }
.headline.champ .headline-title { color: var(--warning); }
.headline.hof .headline-title { color: var(--info); }

/* WELCOME */
.welcome {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  text-align: center;
  padding: 40px;
  max-width: 720px;
  margin: 0 auto;
}

.welcome-title {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 12px;
}

.welcome-subtitle {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 32px;
  max-width: 500px;
  line-height: 1.5;
}

.welcome-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 40px;
  width: 100%;
}

.feature {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
  text-align: left;
}

.feature-title {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

.feature-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* TEAM GRID */
.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
}

.team-card:hover {
  border-color: var(--text-muted);
}

.team-card-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
}

.team-card-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
  margin-left: 8px;
}

.team-card-city {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  margin-left: 8px;
}

.team-card-record {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  margin-left: 8px;
}

.team-card-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  margin-left: 8px;
}

/* GAME RESULTS */
.game-row {
  display: grid;
  grid-template-columns: 1fr 70px 1fr;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.game-row:last-child { border-bottom: none; }

.team-side {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-side.away {
  justify-content: flex-end;
}

.team-abbr {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-muted);
  min-width: 36px;
  text-align: center;
}

.team-name-inline { font-weight: 500; }

.score {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 500;
}

.score .at { color: var(--text-dim); }
.score .winner { color: var(--text); font-weight: 600; }
.score .loser { color: var(--text-muted); }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 23, 0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(2px);
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 90%;
  max-width: 620px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
  line-height: 1;
}

.modal-close:hover { color: var(--text); }

.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

/* PLAYER ROWS */
.roster-row {
  display: grid;
  grid-template-columns: 36px 40px 1fr 50px 60px 40px;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.1s;
}

.roster-row:hover { background: var(--surface-2); }
.roster-row:last-child { border-bottom: none; }

.roster-row.head {
  background: var(--surface-2);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: default;
}

.position-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-2);
  padding: 2px 6px;
  border: 1px solid var(--border);
  text-align: center;
}

.rating {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  padding: 2px 7px;
  display: inline-block;
  min-width: 32px;
  text-align: center;
}

.rating-elite { background: #1c1917; color: white; }
.rating-good { background: #15803d; color: white; }
.rating-avg { background: var(--surface-2); color: var(--text); }
.rating-poor { background: var(--surface-2); color: var(--text-muted); }

.jersey-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

/* HOF */
.hof-row {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 20px;
  align-items: center;
}

.hof-row:last-child { border-bottom: none; }

.hof-year-class {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.hof-name-main {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}

.hof-pos {
  font-size: 11px;
  color: var(--text-muted);
}

.hof-stats {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
}

/* CHAMPIONS */
.champ-row {
  display: grid;
  grid-template-columns: 60px 1fr 1fr;
  gap: 20px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}

.champ-row:last-child { border-bottom: none; }

.champ-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
}

.champ-team {
  font-weight: 500;
}

.champ-record {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}

.champ-runnerup {
  font-size: 12px;
  color: var(--text-muted);
}

/* RECORDS */
.record-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.record-item:last-child { border-bottom: none; }

.record-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  font-weight: 600;
}

.record-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 2px;
}

.record-holder {
  font-size: 12px;
  color: var(--text-muted);
}

/* STATS GRID */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1px;
  background: var(--border);
}

.stat-block {
  background: var(--surface);
  padding: 14px 16px;
}

.stat-block-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  margin-bottom: 4px;
}

.stat-block-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 600;
}

/* PLAYER DETAIL */
.player-detail {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.player-header-detail {
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.player-name-big {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
}

.player-meta {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
}

.section-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.stat-table {
  width: 100%;
  font-size: 13px;
}

.stat-table td {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.stat-table td:first-child {
  color: var(--text-muted);
  font-size: 12px;
}

.stat-table td:last-child {
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

.stat-table tr:last-child td { border-bottom: none; }

/* SECTION HEADER */
.section-divider {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 24px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.section-divider:first-child { margin-top: 0; }

/* LEADERS */
.leader-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  align-items: center;
}

.leader-row:last-child { border-bottom: none; }

.leader-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}

.leader-name { font-weight: 500; }

.leader-team {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 6px;
}

.leader-stat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  text-align: right;
}

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

@media (max-width: 1024px) {
  main { grid-template-columns: 56px 1fr; }
  .news-feed { display: none; }
  .nav-item span:not(.nav-icon) { display: none; }
  .nav-title { display: none; }
  .nav-item { justify-content: center; padding: 7px 0; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">GD</div>
      <div class="brand-name">Gridiron <span>Dynasty</span></div>
    </div>
    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">Season</span>
        <span class="status-value" id="currentYear">1970</span>
      </div>
      <div class="status-item">
        <span class="status-label">Week</span>
        <span class="status-value" id="currentWeek">—</span>
      </div>
      <div class="era-tag" id="eraBadge">Foundation Era</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="game.saveGame()">Save</button>
      <button class="btn btn-primary" onclick="game.simWeek()" id="simBtn" style="display:none">Simulate Week →</button>
    </div>
  </header>

  <main>
    <nav class="sidebar">
      <div class="nav-section">
        <div class="nav-title">League</div>
        <div class="nav-item active" data-view="standings"><span class="nav-icon">▦</span><span>Standings</span></div>
        <div class="nav-item" data-view="schedule"><span class="nav-icon">◫</span><span>Schedule</span></div>
        <div class="nav-item" data-view="teams"><span class="nav-icon">◯</span><span>Teams</span></div>
        <div class="nav-item" data-view="players"><span class="nav-icon">◐</span><span>Players</span></div>
      </div>
      <div class="nav-section">
        <div class="nav-title">History</div>
        <div class="nav-item" data-view="hof"><span class="nav-icon">★</span><span>Hall of Fame</span></div>

<script>
const FIRST_NAMES_70S = ['John','Mike','David','Robert','James','Larry','Steve','Tom','Bill','Jim','Bob','Joe','Dan','Frank','Gary','Roger','Terry','Don','Ray','Ken','Bruce','Wayne','Carl','Glenn','Earl'];

const LAST_NAMES = ['Smith','Johnson','Williams','Brown','Miller','Davis','Wilson','Moore','Taylor','Anderson','Thomas','Jackson','White','Harris','Martin','Thompson','Garcia','Martinez','Robinson','Clark','Rodriguez','Lewis','Lee','Walker','Hall','Allen','Young','King','Wright','Scott','Green','Adams','Baker','Nelson','Carter','Mitchell','Roberts','Turner','Phillips','Campbell','Parker','Evans','Edwards','Collins','Stewart','Morris','Rogers','Reed','Cook','Bell','Murphy','Bailey','Cooper','Richardson','Cox','Howard','Ward','Peterson','Gray','James','Watson','Brooks','Kelly','Sanders','Price','Bennett','Wood','Barnes','Ross','Henderson','Coleman','Jenkins','Perry','Powell','Long','Patterson','Hughes','Foster','Bryant','Russell','Griffin','Hayes','Mason','Brock','Sullivan','Pierce','Hunter','Riley','Knight','Wells'];

const TEAM_DATA = [
  { city: 'Boston', name: 'Patriots', abbr: 'BOS', conf: 'AFC', div: 'East', primary: '#002244' },
  { city: 'New York', name: 'Jets', abbr: 'NYJ', conf: 'AFC', div: 'East', primary: '#125740' },

  { city: 'Pittsburgh', name: 'Steelers', abbr: 'PIT', conf: 'AFC', div: 'North', primary: '#FFB612' },

  { city: 'Detroit', name: 'Lions', abbr: 'DET', conf: 'NFC', div: 'North', primary: '#0076B6' },
  { city: 'Minnesota', name: 'Vikings', abbr: 'MIN', conf: 'NFC', div: 'North', primary: '#4F2683' },
  { city: 'New Orleans', name: 'Saints', abbr: 'NO', conf: 'NFC', div: 'South', primary: '#D3BC8D' },
  { city: 'Atlanta', name: 'Falcons', abbr: 'ATL', conf: 'NFC', div: 'South', primary: '#A71930' },
  { city: 'Tampa Bay', name: 'Buccaneers', abbr: 'TB', conf: 'NFC', div: 'South', primary: '#D50A0A' },
  { city: 'Carolina', name: 'Panthers', abbr: 'CAR', conf: 'NFC', div: 'South', primary: '#0085CA' },
  { city: 'San Francisco', name: 'Niners', abbr: 'SF', conf: 'NFC', div: 'West', primary: '#AA0000' },
  { city: 'Seattle', name: 'Seahawks', abbr: 'SEA', conf: 'NFC', div: 'West', primary: '#002244' },
  { city: 'Los Angeles', name: 'Rams', abbr: 'LAR', conf: 'NFC', div: 'West', primary: '#003594' },
  { city: 'Arizona', name: 'Cardinals', abbr: 'ARI', conf: 'NFC', div: 'West', primary: '#97233F' }
];

const POSITION_COUNTS = { QB: 3, RB: 4, WR: 6, TE: 3, OL: 8, DL: 6, LB: 6, CB: 5, S: 4 };

const ERAS = [
  { name: 'Foundation Era', start: 1970, end: 1979, passEmph: 0.30, gameRate: 1.0 },
  { name: 'Transition Era', start: 1980, end: 1989, passEmph: 0.45, gameRate: 1.1 },
  { name: 'Modern Begins', start: 1990, end: 1999, passEmph: 0.55, gameRate: 1.2 },
  { name: 'Cap Era', start: 2000, end: 2009, passEmph: 0.62, gameRate: 1.3 },
  { name: 'Passing Peak', start: 2010, end: 2019, passEmph: 0.68, gameRate: 1.4 },
  { name: 'Modern Era', start: 2020, end: 2099, passEmph: 0.72, gameRate: 1.5 }
];

const SCANDAL_TEMPLATES = [
  { title: '{team} owner under league investigation', body: 'League office is reviewing financial irregularities involving {team}\'s ownership group.' },
  { title: '{coach} fired amid locker room dispute', body: '{team} parts ways with head coach after weeks of internal tension.' },
  { title: 'Betting probe centers on {team}', body: 'Multiple {team} personnel are reportedly being interviewed in a league gambling investigation.' },
  { title: '{team} stadium funding in jeopardy', body: 'Public funding for a proposed new {team} stadium faces significant political opposition.' },
  { title: '{team} fined, loses draft pick', body: 'League sanctions {team} following a rules violation discovered during an audit.' }
];

let game = {
  state: null,
  currentView: 'standings',

  init() {
    this.loadGame();
    if (!this.state) {
      this.showWelcome();
    } else {
      document.getElementById('simBtn').style.display = '';
      this.render();
    }
    this.bindEvents();
  },

  bindEvents() {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        this.currentView = item.dataset.view;
        this.render();
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if (e.key === ' ' && this.state && !document.getElementById('modal').classList.contains('show')) {
        e.preventDefault();
        this.simWeek();
      }
    });
  },

  showWelcome() {
    document.getElementById('content').innerHTML = `
      <div class="welcome">
        <h1 class="welcome-title">Gridiron Dynasty</h1>
        <p class="welcome-subtitle">A 50-year alternate football league simulator. Watch the game evolve from the run-heavy 1970s through the modern passing era. Build dynasties, witness scandals, and crown champions.</p>
        <button class="btn btn-primary btn-lg" onclick="game.newLeague()">Start New League</button>
        <div class="welcome-features">
          <div class="feature">
            <div class="feature-title">32 Teams</div>
            <div class="feature-desc">8 divisions across 2 conferences, with full weekly simulation</div>
          </div>
          <div class="feature">
            <div class="feature-title">1,500+ Players</div>
            <div class="feature-desc">Procedurally generated with stats, ratings, and aging</div>
          </div>
          <div class="feature">
            <div class="feature-title">Six Eras</div>
            <div class="feature-desc">The game evolves: from ground-and-pound to air raid</div>
          </div>
          <div class="feature">
            <div class="feature-title">Dynamic Storylines</div>
            <div class="feature-desc">Headlines, scandals, and league-wide narratives</div>
          </div>
          <div class="feature">
            <div class="feature-title">Championships</div>
            <div class="feature-desc">Annual champions, MVPs, and all-time records</div>
          </div>
          <div class="feature">
            <div class="feature-title">Auto-Save</div>
            <div class="feature-desc">Your league persists across browser sessions</div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('simBtn').style.display = 'none';
  },

  newLeague() {
    if (this.state && !confirm('This will erase your current league. Continue?')) return;
    
    this.state = {
      year: 1970, week: 0,
      teams: [], players: [], headlines: [],
      hallOfFame: [], champions: [],
      records: {
        seasonPassingYards: { value: 0, player: null, year: null },
        seasonRushingYards: { value: 0, player: null, year: null },
        seasonReceivingYards: { value: 0, player: null, year: null }
      },
      schedule: []
    };
    
    this.generateTeams();
    this.generateAllPlayers();
    this.generateSchedule();
    this.addHeadline({
      title: 'New league inaugurates with 32 founding teams',
      body: 'The 1970 season begins across two conferences and eight divisions. The Foundation Era is officially underway.'
    });
    
    document.getElementById('simBtn').style.display = '';
    this.currentView = 'standings';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('[data-view="standings"]').classList.add('active');
    this.saveGame();
    this.render();
  },

  generateTeams() {
    this.state.teams = TEAM_DATA.map((d, i) => ({
      id: i, city: d.city, name: d.name, abbr: d.abbr,
      conference: d.conf, division: d.div, primary: d.primary,
      wins: 0, losses: 0, ties: 0,
      pointsFor: 0, pointsAgainst: 0,
      championships: 0, playoffAppearances: 0,
      roster: [], coachName: this.generateName(this.state.year)
    }));
  },

  generateName(year) {
    let firstNames;
    if (year < 1990) firstNames = FIRST_NAMES_70S;
    else if (year < 2015) firstNames = FIRST_NAMES_90S;
    else firstNames = FIRST_NAMES_2020S;
    return firstNames[Math.floor(Math.random() * firstNames.length)] + ' ' + LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
  },

  generateAllPlayers() {
    this.state.teams.forEach(team => {
      Object.entries(POSITION_COUNTS).forEach(([pos, count]) => {
        for (let i = 0; i < count; i++) {
          const p = this.generatePlayer(pos, team.id);
          this.state.players.push(p);
          team.roster.push(p.id);
        }
      });
    });
  },

  generatePlayer(position, teamId) {
    const age = 21 + Math.floor(Math.random() * 13);
    let rating = 50 + Math.floor(Math.random() * 40);
    if (age >= 26 && age <= 30) rating = Math.min(99, rating + 5);
    if (age >= 32) rating = Math.max(45, rating - 5);
    
    return {
      id: this.state.players.length,
      name: this.generateName(this.state.year),
      position, age, rating, team: teamId,
      jerseyNumber: this.assignJerseyNumber(position),
      yearsInLeague: Math.max(0, age - 22),
      careerStats: { gamesPlayed: 0, passingYards: 0, passingTDs: 0, rushingYards: 0, rushingTDs: 0, receivingYards: 0, receivingTDs: 0, sacks: 0, interceptions: 0, touchdowns: 0 },
      seasonStats: { passingYards: 0, passingTDs: 0, rushingYards: 0, rushingTDs: 0, receivingYards: 0, receivingTDs: 0, sacks: 0, interceptions: 0, touchdowns: 0 },
      retired: false, hofInducted: false
    };
  },

  assignJerseyNumber(position) {
    const r = { QB: [1, 19], RB: [20, 49], WR: [10, 19], TE: [80, 89], OL: [50, 79], DL: [50, 99], LB: [40, 59], CB: [20, 49], S: [20, 49] };
    const [min, max] = r[position] || [1, 99];
    return min + Math.floor(Math.random() * (max - min + 1));
  },

  generateSchedule() {
    this.state.schedule = [];
    for (let week = 1; week <= 16; week++) {
      const shuffled = [...this.state.teams].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffled.length; i += 2) {
        if (shuffled[i+1]) {
          this.state.schedule.push({
            week, homeTeam: shuffled[i].id, awayTeam: shuffled[i+1].id,
            played: false, homeScore: 0, awayScore: 0
          });
        }
      }
    }
  },

  getCurrentEra() {
    return ERAS.find(e => this.state.year >= e.start && this.state.year <= e.end) || ERAS[ERAS.length - 1];
  },

  simWeek() {
    if (!this.state) return;
    if (this.state.week >= 16) { this.endSeason(); return; }
    
    this.state.week++;
    const era = this.getCurrentEra();
    const weekGames = this.state.schedule.filter(g => g.week === this.state.week && !g.played);
    
    weekGames.forEach(g => this.simGame(g, era));
    this.generateWeeklyHeadlines();
    if (Math.random() < 0.08) this.generateScandal();
    
    this.saveGame();
    this.render();
  },

  simGame(g, era) {
    const home = this.state.teams[g.homeTeam];
    const away = this.state.teams[g.awayTeam];
    const hs = this.getTeamStrength(home);
    const as = this.getTeamStrength(away);
    const homeWinProb = (hs / (hs + as)) + 0.05;
    const homeWins = Math.random() < homeWinProb;
    
    const base = 14 + Math.floor(era.gameRate * 8);
    const hScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? 7 : -7));
    const aScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? -7 : 7));
    
    g.homeScore = homeWins ? Math.max(hScore, aScore + 1) : hScore;
    g.awayScore = !homeWins ? Math.max(aScore, hScore + 1) : aScore;
    g.played = true;
    
    if (g.homeScore > g.awayScore) { home.wins++; away.losses++; }
    else { away.wins++; home.losses++; }
    
    home.pointsFor += g.homeScore;
    home.pointsAgainst += g.awayScore;
    away.pointsFor += g.awayScore;
    away.pointsAgainst += g.homeScore;
    
    this.generateGameStats(home, away, era);
  },

  getTeamStrength(team) {
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    if (!roster.length) return 50;
    return roster.reduce((s, p) => s + p.rating, 0) / roster.length;
  },

  generateGameStats(home, away, era) {
    [home, away].forEach(team => {
      const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
      
      const qbs = roster.filter(p => p.position === 'QB').sort((a, b) => b.rating - a.rating);
      if (qbs[0]) {
        const yds = Math.floor((150 + Math.random() * 200) * era.gameRate);
        const tds = Math.floor(Math.random() * 4 * era.passEmph * 1.5);
        qbs[0].seasonStats.passingYards += yds;
        qbs[0].seasonStats.passingTDs += tds;
        qbs[0].seasonStats.touchdowns += tds;
      }
      const rbs = roster.filter(p => p.position === 'RB').sort((a, b) => b.rating - a.rating);
      if (rbs[0]) {
        const yds = Math.floor((50 + Math.random() * 100) * (2 - era.passEmph));
        const tds = Math.floor(Math.random() * 2);
        rbs[0].seasonStats.rushingYards += yds;
        rbs[0].seasonStats.rushingTDs += tds;
        rbs[0].seasonStats.touchdowns += tds;
      }
      const wrs = roster.filter(p => p.position === 'WR').sort((a, b) => b.rating - a.rating);
      if (wrs[0]) {
        const yds = Math.floor((40 + Math.random() * 80) * era.gameRate);
        const tds = Math.floor(Math.random() * 2 * era.passEmph * 2);
        wrs[0].seasonStats.receivingYards += yds;
        wrs[0].seasonStats.receivingTDs += tds;
        wrs[0].seasonStats.touchdowns += tds;
      }
      const dl = roster.filter(p => p.position === 'DL').sort((a, b) => b.rating - a.rating);
      if (dl[0]) dl[0].seasonStats.sacks += Math.floor(Math.random() * 3);
    });
  },

  generateWeeklyHeadlines() {
    const games = this.state.schedule.filter(g => g.week === this.state.week && g.played);
    let biggest = null, closest = null;
    let bm = 0, cm = 999;
    
    games.forEach(g => {
      const m = Math.abs(g.homeScore - g.awayScore);
      if (m > bm) { bm = m; biggest = g; }
      if (m < cm) { cm = m; closest = g; }
    });
    
    if (biggest && bm >= 21) {
      const w = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.homeTeam] : this.state.teams[biggest.awayTeam];
      const l = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.awayTeam] : this.state.teams[biggest.homeTeam];
      this.addHeadline({
        title: `${w.city} ${w.name} rout ${l.city} ${l.name}`,
        body: `${w.city} dominated ${l.city} ${Math.max(biggest.homeScore, biggest.awayScore)}–${Math.min(biggest.homeScore, biggest.awayScore)} in a Week ${this.state.week} blowout.`
      });
    }
    
    if (closest && cm <= 3) {
      const w = closest.homeScore > closest.awayScore ? this.state.teams[closest.homeTeam] : this.state.teams[closest.awayTeam];
      const l = closest.homeScore > closest.awayScore ? this.state.teams[closest.awayTeam] : this.state.teams[closest.homeTeam];
      this.addHeadline({
        title: `${w.city} edges ${l.city} in late thriller`,
        body: `A one-score game decided in the final minutes: ${w.city} ${Math.max(closest.homeScore, closest.awayScore)}, ${l.city} ${Math.min(closest.homeScore, closest.awayScore)}.`
      });
    }
    
    if (Math.random() < 0.3) {
      const hot = this.state.teams.filter(t => t.wins >= 3 && t.losses <= 1).sort(() => Math.random() - 0.5)[0];
      if (hot) {
        this.addHeadline({
          title: `${hot.city} ${hot.name} surge to ${hot.wins}–${hot.losses} start`,
          body: `${hot.city} continues its impressive opening run with another statement win.`
        });
      }
    }
  },

  generateScandal() {
    const t = SCANDAL_TEMPLATES[Math.floor(Math.random() * SCANDAL_TEMPLATES.length)];
    const team = this.state.teams[Math.floor(Math.random() * this.state.teams.length)];
    const tf = team.city + ' ' + team.name;
    this.addHeadline({
      type: 'scandal',
      title: t.title.replace('{team}', tf).replace('{coach}', team.coachName),
      body: t.body.replace('{team}', tf)
    });
  },

  endSeason() {
    const sorted = [...this.state.teams].sort((a, b) => {
      const aWP = a.wins / Math.max(1, a.wins + a.losses);
      const bWP = b.wins / Math.max(1, b.wins + b.losses);
      if (bWP !== aWP) return bWP - aWP;
      return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
    });
    
    const champion = sorted[0];
    const runnerUp = sorted[1];
    champion.championships++;
    
    this.state.champions.push({
      year: this.state.year,
      team: champion.city + ' ' + champion.name,
      record: champion.wins + '-' + champion.losses,
      runnerUp: runnerUp.city + ' ' + runnerUp.name
    });
    
    const topPlayers = this.state.players.filter(p => !p.retired);
    topPlayers.sort((a, b) => {
      const aS = a.seasonStats.passingYards + a.seasonStats.rushingYards * 2 + a.seasonStats.receivingYards * 1.5 + a.seasonStats.touchdowns * 50;
      const bS = b.seasonStats.passingYards + b.seasonStats.rushingYards * 2 + b.seasonStats.receivingYards * 1.5 + b.seasonStats.touchdowns * 50;
      return bS - aS;
    });
    const mvp = topPlayers[0];
    
    this.addHeadline({
      type: 'champ',
      title: `${champion.city} ${champion.name} win the ${this.state.year} championship`,
      body: `${champion.city} defeated ${runnerUp.city} to claim the title with a ${champion.wins}–${champion.losses} record.`
    });
    
    if (mvp) {
      this.addHeadline({
        title: `${mvp.name} named ${this.state.year} MVP`,
        body: `${mvp.position} ${mvp.name} of ${this.state.teams[mvp.team].name} takes home league MVP honors.`
      });
    }
    
    topPlayers.forEach(p => {
      if (p.seasonStats.passingYards > this.state.records.seasonPassingYards.value) {
        this.state.records.seasonPassingYards = { value: p.seasonStats.passingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.rushingYards > this.state.records.seasonRushingYards.value) {
        this.state.records.seasonRushingYards = { value: p.seasonStats.rushingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.receivingYards > this.state.records.seasonReceivingYards.value) {
        this.state.records.seasonReceivingYards = { value: p.seasonStats.receivingYards, player: p.name, year: this.state.year };
      }
    });
    
    this.state.players.forEach(p => {
      if (p.retired) return;
      
      Object.keys(p.seasonStats).forEach(k => { p.careerStats[k] += p.seasonStats[k]; });
      p.careerStats.gamesPlayed += 16;
      p.age++;
      p.yearsInLeague++;
      
      if (p.age >= 30) p.rating = Math.max(40, p.rating - Math.floor(Math.random() * 4));
      else if (p.age <= 25) p.rating = Math.min(99, p.rating + Math.floor(Math.random() * 3));
      
      if (p.age >= 35 || (p.age >= 32 && Math.random() < 0.3) || p.rating < 55) {
        p.retired = true;
        p.retiredYear = this.state.year;
        
        const isHOF = p.yearsInLeague >= 8 && (
          p.careerStats.passingYards > 25000 ||
          p.careerStats.rushingYards > 8000 ||
          p.careerStats.receivingYards > 8000 ||
          p.careerStats.touchdowns > 100
        );
        
        if (isHOF) {
          p.hofInducted = true;
          this.state.hallOfFame.push({
            name: p.name, position: p.position,
            inductedYear: this.state.year + 5,
            careerStats: { ...p.careerStats },
            yearsInLeague: p.yearsInLeague
          });
          this.addHeadline({
            type: 'hof',
            title: `${p.name} retires after ${p.yearsInLeague} seasons`,
            body: `Legendary ${p.position} ${p.name} steps away from the game. ${this.formatCareerStats(p)}.`
          });
        } else if (p.yearsInLeague >= 5) {
          this.addHeadline({
            title: `${p.name} announces retirement`,
            body: `${p.position} ${p.name} retires after ${p.yearsInLeague} seasons in the league.`
          });
        }
      }
      
      p.seasonStats = { passingYards: 0, passingTDs: 0, rushingYards: 0, rushingTDs: 0, receivingYards: 0, receivingTDs: 0, sacks: 0, interceptions: 0, touchdowns: 0 };
    });
    
    this.state.teams.forEach(team => {
      team.roster = team.roster.filter(id => !this.state.players[id].retired);
      const byPos = {};
      team.roster.forEach(id => {
        const p = this.state.players[id];
        byPos[p.position] = (byPos[p.position] || 0) + 1;
      });
      Object.entries(POSITION_COUNTS).forEach(([pos, needed]) => {
        const cur = byPos[pos] || 0;
        for (let i = cur; i < needed; i++) {
          const np = this.generatePlayer(pos, team.id);
          np.age = 22;
          np.yearsInLeague = 0;
          this.state.players.push(np);
          team.roster.push(np.id);
        }
      });
      if (team.wins >= 10) team.playoffAppearances++;
      team.wins = 0;
      team.losses = 0;
      team.pointsFor = 0;
      team.pointsAgainst = 0;
      if (Math.random() < 0.1) team.coachName = this.generateName(this.state.year);
    });
    
    this.state.year++;
    this.state.week = 0;
    
    const newEra = this.getCurrentEra();
    if (newEra.start === this.state.year) {
      this.addHeadline({
        title: `New era begins: ${newEra.name}`,
        body: `The league enters a new chapter as the ${newEra.name} arrives. Rules and playing styles continue to evolve.`
      });
    }
    
    this.generateSchedule();
    this.addHeadline({
      title: `${this.state.year} season opens`,
      body: 'A new season begins with rosters refreshed and championship hopes renewed across the league.'
    });
    
    this.saveGame();
    this.render();
  },

  formatCareerStats(p) {
    const s = [];
    if (p.careerStats.passingYards > 0) s.push(p.careerStats.passingYards.toLocaleString() + ' pass yds');
    if (p.careerStats.rushingYards > 0) s.push(p.careerStats.rushingYards.toLocaleString() + ' rush yds');
    if (p.careerStats.receivingYards > 0) s.push(p.careerStats.receivingYards.toLocaleString() + ' rec yds');
    if (p.careerStats.touchdowns > 0) s.push(p.careerStats.touchdowns + ' TDs');
    return s.join(', ');
  },

  addHeadline(h) {
    this.state.headlines.unshift({ ...h, year: this.state.year, week: this.state.week });
    if (this.state.headlines.length > 150) this.state.headlines.pop();
  },

  render() {
    if (!this.state) return;
    document.getElementById('currentYear').textContent = this.state.year;
    document.getElementById('currentWeek').textContent = this.state.week + '/16';
    document.getElementById('eraBadge').textContent = this.getCurrentEra().name;
    document.getElementById('simBtn').textContent = this.state.week >= 16 ? 'End Season →' : 'Simulate Week →';
    
    this.renderNews();
    
    switch (this.currentView) {
      case 'standings': this.renderStandings(); break;
      case 'schedule': this.renderSchedule(); break;
      case 'teams': this.renderTeams(); break;
      case 'players': this.renderPlayers(); break;
      case 'hof': this.renderHOF(); break;
      case 'records': this.renderRecords(); break;
      case 'champions': this.renderChampions(); break;
      case 'about': this.renderAbout(); break;
    }
  },

  renderStandings() {
    const divs = ['East', 'North', 'South', 'West'];
    const confs = ['AFC', 'NFC'];
    let html = `<div class="page-header">
      <div class="page-title">Standings</div>
      <div class="page-subtitle">${this.state.year} season · Week ${this.state.week} of 16 · ${this.getCurrentEra().name}</div>
    </div>`;
    
    confs.forEach(conf => {
      html += `<div class="card">
        <div class="card-header">
          <div class="card-title">${conf === 'AFC' ? 'American Conference' : 'National Conference'}</div>
        </div>`;
      
      divs.forEach(div => {
        const teams = this.state.teams.filter(t => t.conference === conf && t.division === div).sort((a, b) => {
          if (b.wins !== a.wins) return b.wins - a.wins;
          return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
        });
        
        html += `<div class="division-label">${conf} ${div}</div>
          <table>
            <thead><tr>
              <th style="width:50%">Team</th>
              <th class="text-center">W</th>
              <th class="text-center">L</th>
              <th class="text-center">PCT</th>
              <th class="text-center">PF</th>
              <th class="text-center">PA</th>
              <th class="text-center">DIFF</th>
            </tr></thead>
            <tbody>`;
        
        teams.forEach((t, idx) => {
          const games = t.wins + t.losses;
          const pct = games > 0 ? (t.wins / games).toFixed(3) : '.000';
          const diff = t.pointsFor - t.pointsAgainst;
          html += `<tr onclick="game.showTeam(${t.id})">
            <td>
              <span class="team-color-bar" style="background:${t.primary}"></span>
              <strong>${t.city} ${t.name}</strong>
              ${idx === 0 && t.wins > 0 ? '<span class="leader-badge">DIV</span>' : ''}
            </td>
            <td class="text-center mono-num">${t.wins}</td>
            <td class="text-center mono-num">${t.losses}</td>
            <td class="text-center mono-num">${pct}</td>
            <td class="text-center mono-num muted">${t.pointsFor}</td>
            <td class="text-center mono-num muted">${t.pointsAgainst}</td>
            <td class="text-center mono-num ${diff > 0 ? 'win' : diff < 0 ? 'loss' : 'muted'}">${diff > 0 ? '+' : ''}${diff}</td>
          </tr>`;
        });
        html += '</tbody></table>';
      });
      html += '</div>';
    });
    
    document.getElementById('content').innerHTML = html;
  },

  renderSchedule() {
    const wn = Math.max(1, this.state.week);
    const weekGames = this.state.schedule.filter(g => g.week === wn);
    const upcoming = this.state.schedule.filter(g => g.week === this.state.week + 1 && this.state.week < 16);
    
    let html = `<div class="page-header">
      <div class="page-title">Schedule</div>
      <div class="page-subtitle">${this.state.year} season</div>
    </div>`;
    
    if (this.state.week > 0) {
      html += `<div class="card">
        <div class="card-header">
          <div class="card-title">Week ${this.state.week} results</div>
          <div class="card-meta">${weekGames.length} games</div>
        </div>`;
      weekGames.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        const homeWon = g.homeScore > g.awayScore;
        html += `<div class="game-row">
          <div class="team-side away">
            <span class="team-name-inline">${away.city} ${away.name}</span>
            <span class="team-abbr">${away.abbr}</span>
          </div>
          <div class="score">
            <span class="${!homeWon ? 'winner' : 'loser'}">${g.awayScore}</span>
            <span class="at"> – </span>
            <span class="${homeWon ? 'winner' : 'loser'}">${g.homeScore}</span>
          </div>
          <div class="team-side">
            <span class="team-abbr">${home.abbr}</span>
            <span class="team-name-inline">${home.city} ${home.name}</span>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    
    if (upcoming.length > 0) {
      html += `<div class="card">
        <div class="card-header">
          <div class="card-title">Week ${this.state.week + 1} upcoming</div>
          <div class="card-meta">${upcoming.length} games</div>
        </div>`;
      upcoming.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        html += `<div class="game-row">
          <div class="team-side away">
            <span class="team-name-inline">${away.city} ${away.name}</span>
            <span class="team-abbr">${away.abbr}</span>
          </div>
          <div class="score"><span class="at">@</span></div>
          <div class="team-side">
            <span class="team-abbr">${home.abbr}</span>
            <span class="team-name-inline">${home.city} ${home.name}</span>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    
    document.getElementById('content').innerHTML = html;
  },

  renderTeams() {
    let html = `<div class="page-header">
      <div class="page-title">Teams</div>
      <div class="page-subtitle">All 32 franchises · Click for roster</div>
    </div>
    <div class="team-grid">`;
    
    this.state.teams.forEach(t => {
      const games = t.wins + t.losses;
      const pct = games > 0 ? (t.wins / games).toFixed(3) : '.000';
      html += `<div class="team-card" onclick="game.showTeam(${t.id})">
        <div class="team-card-bar" style="background:${t.primary}"></div>
        <div class="team-card-name">${t.city} ${t.name}</div>
        <div class="team-card-city">${t.conference} ${t.division}</div>
        <div class="team-card-record">${t.wins}–${t.losses} <span class="muted" style="font-size:11px">(${pct})</span></div>
        <div class="team-card-meta">Coach: ${t.coachName}</div>
        ${t.championships > 0 ? `<div class="team-card-meta">★ ${t.championships} championship${t.championships > 1 ? 's' : ''}</div>` : ''}
      </div>`;
    });
    
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  },

  showTeam(teamId) {
    const team = this.state.teams[teamId];
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    roster.sort((a, b) => b.rating - a.rating);
    
    let html = `<div style="padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:4px;height:36px;background:${team.primary}"></div>
        <div>
          <div style="font-size:18px;font-weight:600">${team.city} ${team.name}</div>
          <div class="muted" style="font-size:12px">${team.conference} ${team.division} · Coach ${team.coachName}</div>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:24px;font-size:13px">
        <div><span class="muted">Record:</span> <strong class="mono">${team.wins}–${team.losses}</strong></div>
        <div><span class="muted">PF:</span> <strong class="mono">${team.pointsFor}</strong></div>
        <div><span class="muted">PA:</span> <strong class="mono">${team.pointsAgainst}</strong></div>
        ${team.championships > 0 ? `<div><span class="muted">Titles:</span> <strong class="mono">${team.championships}</strong></div>` : ''}
      </div>
    </div>
    <div class="section-label">Roster · ${roster.length} active</div>
    <div class="roster-row head">
      <div>#</div><div>POS</div><div>NAME</div><div>AGE</div><div>OVR</div><div>YRS</div>
    </div>`;
    
    roster.forEach(p => {
      const rc = p.rating >= 85 ? 'rating-elite' : p.rating >= 75 ? 'rating-good' : p.rating >= 65 ? 'rating-avg' : 'rating-poor';
      html += `<div class="roster-row" onclick="game.showPlayer(${p.id})">
        <div class="jersey-num">${p.jerseyNumber}</div>
        <div><span class="position-tag">${p.position}</span></div>
        <div>${p.name}</div>
        <div class="mono-num">${p.age}</div>
        <div><span class="rating ${rc}">${p.rating}</span></div>
        <div class="mono-num muted">${p.yearsInLeague}</div>
      </div>`;
    });
    
    this.showModal(team.city + ' ' + team.name, html);
  },

  showPlayer(pid) {
    const p = this.state.players[pid];
    if (!p) return;
    const team = this.state.teams[p.team];
    const rc = p.rating >= 85 ? 'rating-elite' : p.rating >= 75 ? 'rating-good' : p.rating >= 65 ? 'rating-avg' : 'rating-poor';
    
    let html = `<div class="player-detail">
      <div class="player-header-detail">
        <div class="player-name-big">${p.name}</div>
        <div class="player-meta">#${p.jerseyNumber} · ${p.position} · ${team.city} ${team.name}</div>
        <div><span class="rating ${rc}" style="font-size:14px;padding:4px 12px">${p.rating} OVR</span></div>
      </div>
      
      <div>
        <div class="section-label">Profile</div>
        <table class="stat-table">
          <tr><td>Age</td><td>${p.age}</td></tr>
          <tr><td>Years in league</td><td>${p.yearsInLeague}</td></tr>
          <tr><td>Position</td><td>${p.position}</td></tr>
          <tr><td>Jersey</td><td>#${p.jerseyNumber}</td></tr>
        </table>
      </div>
      
      <div>
        <div class="section-label">${this.state.year} season</div>
        ${this.renderPlayerStatsTable(p.seasonStats, p.position)}
      </div>
      
      <div>
        <div class="section-label">Career</div>
        ${this.renderPlayerStatsTable(p.careerStats, p.position, true)}
      </div>
    </div>`;
    
    this.showModal(p.name, html);
  },

  renderPlayerStatsTable(stats, pos, isCareer) {
    const r = [];
    if (pos === 'QB') {
      r.push(['Passing yards', stats.passingYards.toLocaleString()]);
      r.push(['Passing TDs', stats.passingTDs]);
    }
    if (['QB', 'RB'].includes(pos)) {
      r.push(['Rushing yards', stats.rushingYards.toLocaleString()]);
      r.push(['Rushing TDs', stats.rushingTDs]);
    }
    if (['WR', 'TE', 'RB'].includes(pos)) {
      r.push(['Receiving yards', stats.receivingYards.toLocaleString()]);
      r.push(['Receiving TDs', stats.receivingTDs]);
    }
    if (['DL', 'LB'].includes(pos)) r.push(['Sacks', stats.sacks]);
    if (['CB', 'S'].includes(pos)) r.push(['Interceptions', stats.interceptions]);
    r.push(['Total TDs', stats.touchdowns]);
    if (isCareer) r.push(['Games played', stats.gamesPlayed]);
    
    return '<table class="stat-table">' + r.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
  },

  renderPlayers() {
    const top = this.state.players.filter(p => !p.retired).sort((a, b) => b.rating - a.rating).slice(0, 50);
    
    let html = `<div class="page-header">
      <div class="page-title">Players</div>
      <div class="page-subtitle">Top 50 by overall rating · ${this.state.players.filter(p => !p.retired).length} active leaguewide</div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Overall rating leaders</div>
      </div>
      <div class="roster-row head">
        <div>RK</div><div>POS</div><div>NAME</div><div>AGE</div><div>OVR</div><div>TEAM</div>
      </div>`;
    
    top.forEach((p, i) => {
      const rc = p.rating >= 85 ? 'rating-elite' : p.rating >= 75 ? 'rating-good' : p.rating >= 65 ? 'rating-avg' : 'rating-poor';
      html += `<div class="roster-row" onclick="game.showPlayer(${p.id})">
        <div class="jersey-num">${i + 1}</div>
        <div><span class="position-tag">${p.position}</span></div>
        <div>${p.name}</div>
        <div class="mono-num">${p.age}</div>
        <div><span class="rating ${rc}">${p.rating}</span></div>
        <div class="mono-num muted">${this.state.teams[p.team].abbr}</div>
      </div>`;
    });
    html += '</div>';
    
    if (this.state.week > 0) {
      const pl = this.state.players.filter(p => !p.retired);
      const sections = [
        { label: 'Passing yards', stat: 'passingYards', tdStat: 'passingTDs' },
        { label: 'Rushing yards', stat: 'rushingYards', tdStat: 'rushingTDs' },
        { label: 'Receiving yards', stat: 'receivingYards', tdStat: 'receivingTDs' }
      ];
      
      sections.forEach(sec => {
        const leaders = [...pl].sort((a, b) => b.seasonStats[sec.stat] - a.seasonStats[sec.stat]).slice(0, 5);
        if (leaders[0].seasonStats[sec.stat] === 0) return;
        
        html += `<div class="card">
          <div class="card-header">
            <div class="card-title">${sec.label} leaders</div>
            <div class="card-meta">Season</div>
          </div>`;
        leaders.forEach((p, i) => {
          html += `<div class="leader-row">
            <div class="leader-rank">${i + 1}</div>
            <div><span class="leader-name">${p.name}</span><span class="leader-team">${this.state.teams[p.team].abbr}</span></div>
            <div class="leader-stat">${p.seasonStats[sec.stat].toLocaleString()} yds · ${p.seasonStats[sec.tdStat]} TD</div>
          </div>`;
        });
        html += '</div>';
      });
    }
    
    document.getElementById('content').innerHTML = html;
  },

  renderHOF() {
    let html = `<div class="page-header">
      <div class="page-title">Hall of Fame</div>
      <div class="page-subtitle">${this.state.hallOfFame.length} inductee${this.state.hallOfFame.length !== 1 ? 's' : ''} all-time</div>
    </div>`;
    
    if (!this.state.hallOfFame.length) {
      html += `<div class="card"><div class="empty-state">No inductees yet. Players must retire with elite career statistics to be enshrined.</div></div>`;
    } else {
      html += '<div class="card">';
      [...this.state.hallOfFame].sort((a, b) => b.inductedYear - a.inductedYear).forEach(p => {
        html += `<div class="hof-row">
          <div class="hof-year-class">Class of ${p.inductedYear}</div>
          <div>
            <div class="hof-name-main">${p.name}</div>
            <div class="hof-pos">${p.position} · ${p.yearsInLeague} seasons · ${p.careerStats.gamesPlayed} games</div>
          </div>
          <div class="hof-stats">
            ${p.careerStats.passingYards > 1000 ? p.careerStats.passingYards.toLocaleString() + ' pass<br>' : ''}
            ${p.careerStats.rushingYards > 1000 ? p.careerStats.rushingYards.toLocaleString() + ' rush<br>' : ''}
            ${p.careerStats.receivingYards > 1000 ? p.careerStats.receivingYards.toLocaleString() + ' rec<br>' : ''}
            ${p.careerStats.touchdowns} TD
          </div>
        </div>`;
      });
      html += '</div>';
    }
    
    document.getElementById('content').innerHTML = html;
  },

  renderRecords() {
    const r = this.state.records;
    let html = `<div class="page-header">
      <div class="page-title">Records</div>
      <div class="page-subtitle">All-time league records</div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Single-season records</div></div>
      <div class="record-item">
        <div class="record-label">Passing yards</div>
        <div class="record-value">${r.seasonPassingYards.value.toLocaleString()}</div>
        ${r.seasonPassingYards.player ? `<div class="record-holder">${r.seasonPassingYards.player} · ${r.seasonPassingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
      <div class="record-item">
        <div class="record-label">Rushing yards</div>
        <div class="record-value">${r.seasonRushingYards.value.toLocaleString()}</div>
        ${r.seasonRushingYards.player ? `<div class="record-holder">${r.seasonRushingYards.player} · ${r.seasonRushingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
      <div class="record-item">
        <div class="record-label">Receiving yards</div>
        <div class="record-value">${r.seasonReceivingYards.value.toLocaleString()}</div>
        ${r.seasonReceivingYards.player ? `<div class="record-holder">${r.seasonReceivingYards.player} · ${r.seasonReceivingYards.year}</div>` : '<div class="record-holder">No record set</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Franchise championships</div></div>
      <table>
        <thead><tr><th>Team</th><th class="text-center">Titles</th><th class="text-center">Playoff appearances</th></tr></thead>
        <tbody>`;
    
    const sorted = [...this.state.teams].sort((a, b) => b.championships - a.championships).filter(t => t.championships > 0 || t.playoffAppearances > 0);
    if (sorted.length === 0) {
      html += '<tr><td colspan="3" class="text-center muted" style="padding:24px">No championships won yet</td></tr>';
    } else {
      sorted.slice(0, 15).forEach(t => {
        html += `<tr>
          <td><span class="team-color-bar" style="background:${t.primary}"></span><strong>${t.city} ${t.name}</strong></td>
          <td class="text-center mono-num">${t.championships}</td>
          <td class="text-center mono-num muted">${t.playoffAppearances}</td>
        </tr>`;
      });
    }
    html += '</tbody></table></div>';
    
    document.getElementById('content').innerHTML = html;
  },

  renderChampions() {
    let html = `<div class="page-header">
      <div class="page-title">Champions</div>
      <div class="page-subtitle">${this.state.champions.length} season${this.state.champions.length !== 1 ? 's' : ''} completed</div>
    </div>`;
    
    if (!this.state.champions.length) {
      html += `<div class="card"><div class="empty-state">No champions yet. Complete a season to crown the first.</div></div>`;
    } else {
      html += '<div class="card">';
      [...this.state.champions].reverse().forEach(c => {
        html += `<div class="champ-row">
          <div class="champ-year">${c.year}</div>
          <div>
            <div class="champ-team">${c.team}</div>
            <div class="champ-record">${c.record}</div>
          </div>
          <div class="champ-runnerup">def. ${c.runnerUp}</div>
        </div>`;
      });
      html += '</div>';
    }
    
    document.getElementById('content').innerHTML = html;
  },

  renderAbout() {
    document.getElementById('content').innerHTML = `<div class="page-header">
      <div class="page-title">About</div>
      <div class="page-subtitle">Gridiron Dynasty v1.0</div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">League overview</div></div>
      <div class="stats-grid">
        <div class="stat-block"><div class="stat-block-label">Current era</div><div class="stat-block-value" style="font-size:14px;font-family:inherit">${this.getCurrentEra().name}</div></div>
        <div class="stat-block"><div class="stat-block-label">Seasons</div><div class="stat-block-value">${this.state.year - 1970}</div></div>
        <div class="stat-block"><div class="stat-block-label">Active players</div><div class="stat-block-value">${this.state.players.filter(p => !p.retired).length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Hall of Famers</div><div class="stat-block-value">${this.state.hallOfFame.length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Champions crowned</div><div class="stat-block-value">${this.state.champions.length}</div></div>
        <div class="stat-block"><div class="stat-block-label">Total headlines</div><div class="stat-block-value">${this.state.headlines.length}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">How to play</div></div>
      <div style="padding:16px;line-height:1.6;font-size:13px">
        <p style="margin-bottom:8px">Click <strong>Simulate Week</strong> (or press Space) to advance through the season. After 16 weeks, the champion is crowned automatically and a new season begins.</p>
        <p style="margin-bottom:8px">Players age and retire over time, with new rookies arriving each offseason. Elite veterans may be inducted into the Hall of Fame five years after retirement.</p>
        <p>The league passes through six distinct eras between 1970 and the modern day. Each era subtly shifts scoring patterns and play-calling tendencies.</p>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">League management</div></div>
      <div style="padding:16px;display:flex;gap:8px">
        <button class="btn" onclick="game.newLeague()">Start new league</button>
        <button class="btn btn-danger" onclick="game.deleteSave()">Delete save</button>
      </div>
    </div>`;
  },

  renderNews() {
    const el = document.getElementById('newsContent');
    document.getElementById('newsCount').textContent = this.state.headlines.length;
    
    if (!this.state.headlines.length) {
      el.innerHTML = '<div class="empty-state" style="padding:24px 0;font-size:12px">No news yet</div>';
      return;
    }
    
    let html = '';
    this.state.headlines.slice(0, 40).forEach(h => {
      const cls = h.type ? 'headline ' + h.type : 'headline';
      html += `<div class="${cls}">
        <div class="headline-date">${h.year}${h.week > 0 ? ' · Wk ' + h.week : ''}</div>
        <div class="headline-title">${h.title}</div>
        <div class="headline-body">${h.body}</div>
      </div>`;
    });
    el.innerHTML = html;
  },

  showModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('show');
  },

  saveGame() {
    try { localStorage.setItem('gridironDynastySave', JSON.stringify(this.state)); }
    catch (e) { console.error('Save failed:', e); }
  },

  loadGame() {
    try {
      const s = localStorage.getItem('gridironDynastySave');
      if (s) { this.state = JSON.parse(s); return true; }
    } catch (e) { console.error('Load failed:', e); }
    return false;
  },

  deleteSave() {
    if (!confirm('Delete your save? This cannot be undone.')) return;
    localStorage.removeItem('gridironDynastySave');
    this.state = null;
    this.showWelcome();
  }
};

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

game.init();
</script>

</body>
</html>
