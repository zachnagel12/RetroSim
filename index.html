      '</div></div>';
    roster.sort((a, b) => {
      const ah = a.contract ? currentCapHit(a.contract) : 0;
      const bh = b.contract ? currentCapHit(b.contract) : 0;
      return bh - ah;
    });
    html += '<div class="card"><div class="card-header">' +
      '<div class="card-title">Contracts · sorted by ' + this.state.year + ' cap hit</div>' +
      '<div class="card-meta">' + roster.length + ' players</div></div>' +
      '<table><thead><tr><th>Player</th><th class="text-center">POS</th><th class="text-center">AGE</th><th class="text-center">OVR</th>' +
      '<th class="text-right">CAP HIT</th><th class="text-right">YRS LEFT</th><th class="text-right">DEAD IF CUT</th></tr></thead><tbody>';
    roster.forEach(p => {
      const c = p.contract;
      const rc = this.ratingClass(p.rating);
      const hit = c ? currentCapHit(c) : 0;
      const dead = c ? deadCapIfReleased(c) : 0;
      const sc = this.salaryClass(hit, cap);
      html += '<tr onclick="game.showPlayer(' + p.id + ')">' +
        '<td><strong>' + p.name + '</strong></td>' +
        '<td class="text-center"><span class="position-tag">' + p.position + '</span></td>' +
        '<td class="text-center mono-num">' + p.age + '</td>' +
        '<td class="text-center"><span class="rating ' + rc + '">' + p.rating + '</span></td>' +
        '<td class="text-right salary-tag ' + sc + '">' + formatMoney(hit) + '</td>' +
        '<td class="text-right mono-num">' + (c ? c.yearsRemaining : '—') + '</td>' +
        '<td class="text-right mono-num muted">' + formatMoney(dead) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  },

  // RECAP
  renderRecap() {
    const recap = this.state.lastWeekRecap;
    if (!recap) { this.renderStandings(); return; }
    const userTeamId = this.state.userTeamId;
    let html = '<div class="page-header">' +
      '<div class="page-title">Week ' + recap.week + ' recap</div>' +
      '<div class="page-subtitle">' + this.state.year + ' season · ' + recap.games.length + ' games · ' + this.getCurrentEra().name + '</div>' +
      '</div><div class="recap-section">' +
      '<div class="section-label">Standout performances</div>' +
      '<div class="standout-grid">' +
      this.renderStandoutCard('offense', 'Top offensive performance', recap.offensiveStandout) +
      this.renderStandoutCard('defense', 'Top defensive performance', recap.defensiveStandout) +
      this.renderStandoutCard('special', 'Top special teams performance', recap.specialStandout) +
      '</div></div>' +
      '<div class="recap-section">' +
      '<div class="section-label">All ' + recap.games.length + ' games · Click any game for full box score</div>' +
      '<div class="games-grid">';
    recap.games.forEach(g => {
      const home = this.state.teams[g.homeTeam];
      const away = this.state.teams[g.awayTeam];
      const homeWon = g.homeScore > g.awayScore;
      const isUserGame = home.id === userTeamId || away.id === userTeamId;
      html += '<div class="game-card ' + (isUserGame ? 'user-game' : '') + '" onclick="game.showBoxScore(' + g.week + ', ' + g.homeTeam + ', ' + g.awayTeam + ')">' +
        '<div class="game-card-teams"><div class="game-card-team ' + (!homeWon ? 'winner' : 'loser') + '">' +
        '<span class="team-abbr-inline">' + away.abbr + '</span><span>' + away.city + ' ' + away.name + '</span></div>' +
        '<div class="game-card-score ' + (homeWon ? 'loser' : '') + '">' + g.awayScore + '</div></div>' +
        '<div class="game-card-teams"><div class="game-card-team ' + (homeWon ? 'winner' : 'loser') + '">' +
        '<span class="team-abbr-inline">' + home.abbr + '</span><span>' + home.city + ' ' + home.name + '</span></div>' +
        '<div class="game-card-score ' + (!homeWon ? 'loser' : '') + '">' + g.homeScore + '</div></div>' +
        '<div class="game-card-detail">FINAL' + (isUserGame ? ' · your team' : '') + '</div></div>';
    });
    html += '</div></div>';
    document.getElementById('content').innerHTML = html;
  },

  renderStandoutCard(type, label, standout) {
    if (!standout) return '<div class="standout-card ' + type + '"><div></div><div>' +
      '<div class="standout-label">' + label + '</div>' +
      '<div class="standout-name" style="color:var(--text-dim)">—</div>' +
      '<div class="standout-meta">No standout performance</div></div></div>';
    const p = standout.player;
    const team = this.state.teams[p.team];
    const s = standout.stats;
    let line = '';
    if (type === 'offense') {
      const parts = [];
      if (s.passingYards > 0) parts.push(s.passingYards + ' pass yds' + (s.passingTDs ? ', ' + s.passingTDs + ' TD' : ''));
      if (s.rushingYards > 0) parts.push(s.rushingYards + ' rush yds' + (s.rushingTDs ? ', ' + s.rushingTDs + ' TD' : ''));
      if (s.receivingYards > 0) parts.push(s.receptions + ' rec, ' + s.receivingYards + ' yds' + (s.receivingTDs ? ', ' + s.receivingTDs + ' TD' : ''));
      line = parts.join(' · ');
    } else if (type === 'defense') {
      const parts = [];
      if (s.tackles > 0) parts.push(s.tackles + ' tackles');
      if (s.sacks > 0) parts.push(s.sacks + ' sack' + (s.sacks > 1 ? 's' : ''));
      if (s.interceptionsMade > 0) parts.push(s.interceptionsMade + ' INT');
      line = parts.join(' · ');
    } else {
      const parts = [];
      if (s.fieldGoalsMade > 0) parts.push(s.fieldGoalsMade + '/' + s.fieldGoalsAttempted + ' FG');
      if (s.extraPoints > 0) parts.push(s.extraPoints + ' XP');
      if (s.punts > 0) parts.push(s.punts + ' punts, ' + (s.puntYards/s.punts).toFixed(1) + ' avg, ' + s.puntsInside20 + ' I20');
      line = parts.join(' · ');
    }
    return '<div class="standout-card ' + type + '">' +
      '<div class="player-face-large" style="width:48px;height:48px">' + pixelFaceSVG(p.faceSeed) + '</div>' +
      '<div><div class="standout-label">' + label + '</div>' +
      '<div class="standout-name">' + p.name + '</div>' +
      '<div class="standout-meta">' + p.position + ' · ' + team.city + ' ' + team.name + '</div>' +
      '<div class="standout-stat">' + line + '</div></div></div>';
  },

  // BOX SCORE
  showBoxScore(week, homeId, awayId) {
    const g = this.state.schedule.find(g => g.week === week && g.homeTeam === homeId && g.awayTeam === awayId);
    if (!g || !g.played) return;
    const home = this.state.teams[homeId];
    const away = this.state.teams[awayId];
    const homeWon = g.homeScore > g.awayScore;
    let html = '<div class="boxscore-header">' +
      '<div class="boxscore-team away"><div class="boxscore-team-name">' + away.city + ' ' + away.name + '</div>' +
      '<div class="boxscore-team-record">' + away.wins + '–' + away.losses + '</div></div>' +
      '<div class="boxscore-score-block">' +
      '<div class="boxscore-score ' + (homeWon ? 'loser' : '') + '">' + g.awayScore + '</div>' +
      '<div class="boxscore-dash">·</div>' +
      '<div class="boxscore-score ' + (!homeWon ? 'loser' : '') + '">' + g.homeScore + '</div></div>' +
      '<div class="boxscore-team"><div class="boxscore-team-name">' + home.city + ' ' + home.name + '</div>' +
      '<div class="boxscore-team-record">' + home.wins + '–' + home.losses + '</div></div></div>';
    [away, home].forEach(team => {
      const teamStats = Object.entries(g.playerStats)
        .filter(([pid]) => this.state.players[pid].team === team.id)
        .map(([pid, stats]) => ({ player: this.state.players[pid], stats }));
      html += '<div class="boxscore-team-header"><span class="team-color-bar" style="background:' + team.primary + '"></span>' + team.city + ' ' + team.name + '</div>';
      const passing = teamStats.filter(t => t.stats.attempts > 0).sort((a, b) => b.stats.passingYards - a.stats.passingYards);
      if (passing.length) {
        html += '<div class="boxscore-stat-cat">Passing</div><div class="box-row passing head"><div>PLAYER</div><div class="stat-num">C/A</div><div class="stat-num">YDS</div><div class="stat-num">TD</div></div>';
        passing.forEach(({ player, stats }) => {
          html += '<div class="box-row passing"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.completions + '/' + stats.attempts + '</div>' +
            '<div class="stat-num">' + stats.passingYards + '</div>' +
            '<div class="stat-num">' + stats.passingTDs + '</div></div>';
        });
      }
      const rushing = teamStats.filter(t => t.stats.carries > 0).sort((a, b) => b.stats.rushingYards - a.stats.rushingYards);
      if (rushing.length) {
        html += '<div class="boxscore-stat-cat">Rushing</div><div class="box-row rushing head"><div>PLAYER</div><div class="stat-num">CAR/YDS</div><div class="stat-num">TD</div></div>';
        rushing.forEach(({ player, stats }) => {
          html += '<div class="box-row rushing"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.carries + '/' + stats.rushingYards + '</div>' +
            '<div class="stat-num">' + stats.rushingTDs + '</div></div>';
        });
      }
      const receiving = teamStats.filter(t => t.stats.receptions > 0).sort((a, b) => b.stats.receivingYards - a.stats.receivingYards);
      if (receiving.length) {
        html += '<div class="boxscore-stat-cat">Receiving</div><div class="box-row receiving head"><div>PLAYER</div><div class="stat-num">REC/YDS</div><div class="stat-num">TD</div></div>';
        receiving.forEach(({ player, stats }) => {
          html += '<div class="box-row receiving"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.receptions + '/' + stats.receivingYards + '</div>' +
            '<div class="stat-num">' + stats.receivingTDs + '</div></div>';
        });
      }
      const defense = teamStats.filter(t => t.stats.tackles > 0 || t.stats.sacks > 0 || t.stats.interceptionsMade > 0)
        .sort((a, b) => (b.stats.sacks * 5 + b.stats.interceptionsMade * 8 + b.stats.tackles) - (a.stats.sacks * 5 + a.stats.interceptionsMade * 8 + a.stats.tackles));
      if (defense.length) {
        html += '<div class="boxscore-stat-cat">Defense</div><div class="box-row defense head"><div>PLAYER</div><div class="stat-num">TKL/SCK</div><div class="stat-num">INT</div></div>';
        defense.forEach(({ player, stats }) => {
          html += '<div class="box-row defense"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.tackles + '/' + stats.sacks + '</div>' +
            '<div class="stat-num">' + stats.interceptionsMade + '</div></div>';
        });
      }
      const kicking = teamStats.filter(t => t.stats.fieldGoalsAttempted > 0 || t.stats.extraPoints > 0);
      if (kicking.length) {
        html += '<div class="boxscore-stat-cat">Kicking</div><div class="box-row kicking head"><div>PLAYER</div><div class="stat-num">FG</div><div class="stat-num">XP</div></div>';
        kicking.forEach(({ player, stats }) => {
          html += '<div class="box-row kicking"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.fieldGoalsMade + '/' + stats.fieldGoalsAttempted + '</div>' +
            '<div class="stat-num">' + stats.extraPoints + '</div></div>';
        });
      }
      const punting = teamStats.filter(t => t.stats.punts > 0);
      if (punting.length) {
        html += '<div class="boxscore-stat-cat">Punting</div><div class="box-row punting head"><div>PLAYER</div><div class="stat-num">P/YDS/AVG</div><div class="stat-num">I20</div></div>';
        punting.forEach(({ player, stats }) => {
          const avg = (stats.puntYards / stats.punts).toFixed(1);
          html += '<div class="box-row punting"><div>' + player.name + ' <span style="color:var(--text-muted);font-size:10px">' + player.position + '</span></div>' +
            '<div class="stat-num">' + stats.punts + '/' + stats.puntYards + '/' + avg + '</div>' +
            '<div class="stat-num">' + stats.puntsInside20 + '</div></div>';
        });
      }
    });
    this.showModal('Week ' + week + ' · ' + away.abbr + ' @ ' + home.abbr, html);
  },

  // STANDINGS
  renderStandings() {
    const divs = ['East', 'North', 'South', 'West'];
    const confs = ['AFC', 'NFC'];
    let html = '<div class="page-header"><div class="page-title">Standings</div>' +
      '<div class="page-subtitle">' + this.state.year + ' season · Week ' + this.state.week + ' of 16 · ' + this.getCurrentEra().name + '</div></div>';
    if (this.state.lastWeekRecap) {
      html += '<div style="margin-bottom:16px"><button class="btn" onclick="game.currentView=\'recap\';game.render()">← View Week ' + this.state.lastWeekRecap.week + ' recap</button></div>';
    }
    confs.forEach(conf => {
      html += '<div class="card"><div class="card-header"><div class="card-title">' + (conf === 'AFC' ? 'American Conference' : 'National Conference') + '</div></div>';
      divs.forEach(div => {
        const teams = this.state.teams.filter(t => t.conference === conf && t.division === div).sort((a, b) => {
          if (b.wins !== a.wins) return b.wins - a.wins;
          return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
        });
        html += '<div class="division-label">' + conf + ' ' + div + '</div>' +
          '<table><thead><tr><th style="width:50%">Team</th><th class="text-center">W</th><th class="text-center">L</th>' +
          '<th class="text-center">PCT</th><th class="text-center">PF</th><th class="text-center">PA</th><th class="text-center">DIFF</th></tr></thead><tbody>';
        teams.forEach((t, idx) => {
          const games = t.wins + t.losses;
          const pct = games > 0 ? (t.wins / games).toFixed(3) : '.000';
          const diff = t.pointsFor - t.pointsAgainst;
          const isUser = t.id === this.state.userTeamId;
          html += '<tr onclick="game.showTeam(' + t.id + ')" ' + (isUser ? 'class="user-row"' : '') + '>' +
            '<td><span class="team-color-bar" style="background:' + t.primary + '"></span>' +
            '<strong>' + t.city + ' ' + t.name + '</strong>' +
            (idx === 0 && t.wins > 0 ? '<span class="leader-badge">DIV</span>' : '') +
            (isUser ? '<span class="leader-badge" style="background:#ca8a04">YOU</span>' : '') + '</td>' +
            '<td class="text-center mono-num">' + t.wins + '</td>' +
            '<td class="text-center mono-num">' + t.losses + '</td>' +
            '<td class="text-center mono-num">' + pct + '</td>' +
            '<td class="text-center mono-num muted">' + t.pointsFor + '</td>' +
            '<td class="text-center mono-num muted">' + t.pointsAgainst + '</td>' +
            '<td class="text-center mono-num ' + (diff > 0 ? 'win' : diff < 0 ? 'loss' : 'muted') + '">' + (diff > 0 ? '+' : '') + diff + '</td></tr>';
        });
        html += '</tbody></table>';
      });
      html += '</div>';
    });
    document.getElementById('content').innerHTML = html;
  },

  // SCHEDULE
  renderSchedule() {
    const wn = Math.max(1, this.state.week);
    const weekGames = this.state.schedule.filter(g => g.week === wn);
    const upcoming = this.state.schedule.filter(g => g.week === this.state.week + 1 && this.state.week < 16);
    let html = '<div class="page-header"><div class="page-title">Schedule</div><div class="page-subtitle">' + this.state.year + ' season</div></div>';
    if (this.state.week > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">Week ' + this.state.week + ' results</div><div class="card-meta">' + weekGames.length + ' games · click for box score</div></div>';
      weekGames.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        const homeWon = g.homeScore > g.awayScore;
        html += '<div class="game-row" onclick="game.showBoxScore(' + g.week + ', ' + g.homeTeam + ', ' + g.awayTeam + ')" style="cursor:pointer">' +
          '<div class="team-side away"><span class="team-name-inline">' + away.city + ' ' + away.name + '</span><span class="team-abbr">' + away.abbr + '</span></div>' +
          '<div class="score"><span class="' + (!homeWon ? 'winner' : 'loser') + '">' + g.awayScore + '</span><span class="at"> – </span><span class="' + (homeWon ? 'winner' : 'loser') + '">' + g.homeScore + '</span></div>' +
          '<div class="team-side"><span class="team-abbr">' + home.abbr + '</span><span class="team-name-inline">' + home.city + ' ' + home.name + '</span></div></div>';
      });
      html += '</div>';
    }
    if (upcoming.length > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">Week ' + (this.state.week + 1) + ' upcoming</div><div class="card-meta">' + upcoming.length + ' games</div></div>';
      upcoming.forEach(g => {
        const home = this.state.teams[g.homeTeam];
        const away = this.state.teams[g.awayTeam];
        html += '<div class="game-row">' +
          '<div class="team-side away"><span class="team-name-inline">' + away.city + ' ' + away.name + '</span><span class="team-abbr">' + away.abbr + '</span></div>' +
          '<div class="score"><span class="at">@</span></div>' +
          '<div class="team-side"><span class="team-abbr">' + home.abbr + '</span><span class="team-name-inline">' + home.city + ' ' + home.name + '</span></div></div>';
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  // TEAMS
  renderTeams() {
    let html = '<div class="page-header"><div class="page-title">Teams</div><div class="page-subtitle">All 32 franchises · Click for roster</div></div><div class="team-grid">';
    this.state.teams.forEach(t => {
      const games = t.wins + t.losses;
      const pct = games > 0 ? (t.wins / games).toFixed(3) : '.000';
      const isUser = t.id === this.state.userTeamId;
      html += '<div class="team-card" onclick="game.showTeam(' + t.id + ')">' +
        '<div class="team-card-bar" style="background:' + t.primary + '"></div>' +
        '<div class="team-card-name">' + t.city + ' ' + t.name + (isUser ? ' <span class="leader-badge" style="background:#ca8a04;margin-left:4px">YOU</span>' : '') + '</div>' +
        '<div class="team-card-city">' + t.conference + ' ' + t.division + '</div>' +
        '<div class="team-card-record">' + t.wins + '–' + t.losses + ' <span class="muted" style="font-size:11px">(' + pct + ')</span></div>' +
        '<div class="team-card-meta">Coach: ' + t.coachName + '</div>' +
        (t.championships > 0 ? '<div class="team-card-meta">★ ' + t.championships + ' championship' + (t.championships > 1 ? 's' : '') + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  },

  showTeam(teamId) {
    const team = this.state.teams[teamId];
    let html = '<div style="padding:20px;border-bottom:1px solid var(--border)">' +
      '<div style="display:flex;align-items:center;gap:12px">' +
      '<div style="width:4px;height:36px;background:' + team.primary + '"></div>' +
      '<div><div style="font-size:18px;font-weight:600">' + team.city + ' ' + team.name + '</div>' +
      '<div class="muted" style="font-size:12px">' + team.conference + ' ' + team.division + '</div></div></div>' +
      '<div style="margin-top:12px;display:flex;gap:24px;font-size:13px">' +
      '<div><span class="muted">Record:</span> <strong class="mono">' + team.wins + '–' + team.losses + '</strong></div>' +
      '<div><span class="muted">PF:</span> <strong class="mono">' + team.pointsFor + '</strong></div>' +
      '<div><span class="muted">PA:</span> <strong class="mono">' + team.pointsAgainst + '</strong></div>' +
      (team.championships > 0 ? '<div><span class="muted">Titles:</span> <strong class="mono">' + team.championships + '</strong></div>' : '') +
      '</div></div>' +
      '<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;cursor:pointer" onclick="game.showCoach(' + team.id + ')">' +
      '<div class="coach-face" style="width:48px;height:48px">' + pixelFaceSVG(stringHash(team.coachId)) + '</div>' +
      '<div><div class="coach-label">Head Coach</div>' +
      '<div class="coach-name" style="font-size:14px">' + team.coachName + '</div>' +
      '<div class="coach-meta">' + team.coachWins + '–' + team.coachLosses + (team.coachOfYears > 0 ? ' · ' + team.coachOfYears + 'x COY' : '') + '</div></div></div>';
    const allRoster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const filtered = this.rosterPosFilter === 'ALL' ? allRoster : allRoster.filter(p => p.position === this.rosterPosFilter);
    filtered.sort((a, b) => b.rating - a.rating);
    const cap = getSalaryCap(this.state.year);
    html += '<div style="padding:12px 16px;border-bottom:1px solid var(--border)"><div class="draft-filters" style="margin:0">' +
      ['ALL'].concat(POSITIONS_FOR_DRAFT).map(pos =>
        '<button class="filter-btn ' + (this.rosterPosFilter === pos ? 'active' : '') + '" onclick="game.setRosterFilter(\'' + pos + '\', \'modal\', ' + team.id + ')">' + pos + '</button>'
      ).join('') + '</div></div>' +
      '<div class="roster-row head"><div>#</div><div>POS</div><div></div><div>NAME</div><div>AGE</div><div>OVR</div><div>CAP</div></div>';
    filtered.forEach(p => {
      const rc = this.ratingClass(p.rating);
      const hit = p.contract ? currentCapHit(p.contract) : 0;
      const sc = this.salaryClass(hit, cap);
      html += '<div class="roster-row" onclick="game.showPlayer(' + p.id + ')">' +
        '<div class="jersey-num">' + p.jerseyNumber + '</div>' +
        '<div><span class="position-tag">' + p.position + '</span></div>' +
        '<div class="player-face-small">' + pixelFaceSVG(p.faceSeed) + '</div>' +
        '<div>' + p.name + '</div>' +
        '<div class="mono-num">' + p.age + '</div>' +
        '<div><span class="rating ' + rc + '">' + p.rating + '</span></div>' +
        '<div class="salary-tag ' + sc + '">' + formatMoney(hit) + '</div></div>';
    });
    this.showModal(team.city + ' ' + team.name, html);
  },

  showCoach(teamId) {
    const team = this.state.teams[teamId];
    const html = '<div class="player-detail-header">' +
      '<div class="player-face-large">' + pixelFaceSVG(stringHash(team.coachId)) + '</div>' +
      '<div><div class="player-name-big">' + team.coachName + '</div>' +
      '<div class="player-meta">Head Coach · ' + team.city + ' ' + team.name + '</div></div></div>' +
      '<div class="player-detail-body">' +
      '<div class="section-label">Coaching record</div>' +
      '<table class="stat-table">' +
      '<tr><td>Wins</td><td>' + team.coachWins + '</td></tr>' +
      '<tr><td>Losses</td><td>' + team.coachLosses + '</td></tr>' +
      '<tr><td>Win pct</td><td>' + (team.coachWins / Math.max(1, team.coachWins + team.coachLosses)).toFixed(3) + '</td></tr>' +
      '<tr><td>Coach of the Year</td><td>' + team.coachOfYears + '</td></tr>' +

  // PLAYER DETAIL with contract section
  showPlayer(pid) {
    const p = this.state.players[pid];
    if (!p) return;
    const team = p.team !== null ? this.state.teams[p.team] : null;
    const rc = this.ratingClass(p.rating);
    const isOnUserTeam = team && team.id === this.state.userTeamId;
    const cap = getSalaryCap(this.state.year);

    let html = '<div class="player-detail-header">' +
      '<div class="player-face-large">' + pixelFaceSVG(p.faceSeed) + '</div>' +
      '<div><div class="player-name-big">' + p.name + '</div>' +
      '<div class="player-meta">#' + p.jerseyNumber + ' · ' + p.position + ' · Age ' + p.age + ' · ' +
      (team ? team.city + ' ' + team.name : (p.retired ? 'Retired' : 'Free Agent')) + '</div>' +
      '<span class="rating ' + rc + '" style="font-size:14px;padding:4px 10px">OVR ' + p.rating + '</span>' +
      '</div></div>' +
      '<div class="player-detail-body">';

    // Profile
    html += '<div class="section-label">Profile</div><table class="stat-table">' +
      '<tr><td>Position</td><td>' + p.position + '</td></tr>' +
      '<tr><td>Age</td><td>' + p.age + '</td></tr>' +
      '<tr><td>Years in league</td><td>' + p.yearsInLeague + '</td></tr>' +
      '<tr><td>Draft year</td><td>' + p.draftYear + '</td></tr>' +
      '<tr><td>Status</td><td>' + (p.retired ? 'Retired' + (p.hofInducted ? ' · HOF' : '') : (team ? 'Active' : 'Free Agent')) + '</td></tr>' +
      '</table>';

    // CONTRACT section
    if (p.contract && !p.retired) {
      const c = p.contract;
      const hit = currentCapHit(c);
      const dead = deadCapIfReleased(c);
      const proration = c.signingBonus / c.bonusProrationYears;
      html += '<div class="section-label">Contract</div><table class="stat-table">' +
        '<tr><td>Total value</td><td>' + formatMoney(c.totalValue) + ' over ' + c.years + ' years</td></tr>' +
        '<tr><td>Average annual value</td><td>' + formatMoney(c.aav) + '</td></tr>' +
        '<tr><td>Signing bonus</td><td>' + formatMoney(c.signingBonus) + '</td></tr>' +
        '<tr><td>Bonus proration</td><td>' + formatMoney(proration) + '/yr × ' + c.bonusProrationYears + ' yrs</td></tr>' +
        '<tr><td>Years remaining</td><td>' + c.yearsRemaining + '</td></tr>' +
        '<tr><td>' + this.state.year + ' cap hit</td><td>' + formatMoney(hit) + '</td></tr>' +
        '<tr><td>Dead cap if released</td><td>' + formatMoney(dead) + '</td></tr>' +
        '<tr><td>Signed in</td><td>' + c.signedYear + ' at OVR ' + c.signedAtRating + '</td></tr>' +
        '</table>';

      // Year-by-year breakdown
      html += '<div class="section-label">Base salary by year</div><div class="contract-years-grid">';
      c.baseSalaries.forEach((base, idx) => {
        const yearLabel = this.state.year + idx;
        const isCurrent = idx === 0;
        const yearIntoContract = (c.years - c.yearsRemaining) + idx;
        const proratedThisYear = yearIntoContract < c.bonusProrationYears ? proration : 0;
        const totalThisYear = base + proratedThisYear;
        html += '<div class="contract-year ' + (isCurrent ? 'current' : '') + '">' +
          '<div class="contract-year-label">' + yearLabel + (isCurrent ? ' · NOW' : '') + '</div>' +
          '<div class="contract-year-value">' + formatMoney(totalThisYear) + '</div>' +
          '<div class="contract-year-detail">base ' + formatMoney(base) + (proratedThisYear > 0 ? ' + ' + formatMoney(proratedThisYear) + ' bon' : '') + '</div>' +
          '</div>';
      });
      html += '</div>';
    }

    // Awards
    if (p.awards && p.awards.length > 0) {
      html += '<div class="section-label">Awards</div><table class="stat-table">';
      p.awards.forEach(a => {
        html += '<tr><td>' + a.year + '</td><td>' + a.type + '</td></tr>';
      });
      html += '</table>';
    }

    // Current season stats
    if (!p.retired && this.state.week > 0) {
      html += '<div class="section-label">' + this.state.year + ' season stats</div>' + this.renderPlayerStatsTable(p.seasonStats, p.position, false);
    }
    // Career stats
    if (p.careerStats.seasonsPlayed > 0 || p.retired) {
      html += '<div class="section-label">Career stats</div>' + this.renderPlayerStatsTable(p.careerStats, p.position, true);
    }
    html += '</div>';

    // Contract action buttons (only for players on user's team)
    let actionRow = '';
    if (isOnUserTeam && !p.retired) {
      actionRow = '<div class="modal-action-row">' +
        '<button class="btn btn-sm" onclick="game.restructureContract(' + p.id + ', \'restructure\')">Restructure</button>' +
        '<button class="btn btn-sm" onclick="game.restructureContract(' + p.id + ', \'frontload\')">Frontload</button>' +
        '<button class="btn btn-sm" onclick="game.restructureContract(' + p.id + ', \'backload\')">Backload</button>' +
        '<button class="btn btn-sm btn-success" onclick="game.extendContract(' + p.id + ')">Extend</button>' +
        '<button class="btn btn-sm btn-danger" onclick="game.releasePlayer(' + p.id + ')">Release</button>' +
        '</div>';
    }

    this.showModal(p.name, html + actionRow);
  },

  renderPlayerStatsTable(stats, pos, isCareer) {
    let html = '<table class="stat-table">';
    if (isCareer) {
      html += '<tr><td>Seasons played</td><td>' + (stats.seasonsPlayed || 0) + '</td></tr>';
      html += '<tr><td>Games played</td><td>' + (stats.gamesPlayed || 0) + '</td></tr>';
    } else {
      html += '<tr><td>Games played</td><td>' + (stats.gamesPlayed || 0) + '</td></tr>';
    }
    if (pos === 'QB') {
      html += '<tr><td>Passing yards</td><td>' + (stats.passingYards || 0).toLocaleString() + '</td></tr>';
      html += '<tr><td>Passing TDs</td><td>' + (stats.passingTDs || 0) + '</td></tr>';
      if (!isCareer) {
        html += '<tr><td>Completions/Attempts</td><td>' + (stats.completions || 0) + '/' + (stats.attempts || 0) + '</td></tr>';
        html += '<tr><td>Interceptions thrown</td><td>' + (stats.interceptionsThrown || 0) + '</td></tr>';
      }
      html += '<tr><td>Rushing yards</td><td>' + (stats.rushingYards || 0).toLocaleString() + '</td></tr>';
      html += '<tr><td>Rushing TDs</td><td>' + (stats.rushingTDs || 0) + '</td></tr>';
    } else if (pos === 'RB') {
      html += '<tr><td>Rushing yards</td><td>' + (stats.rushingYards || 0).toLocaleString() + '</td></tr>';
      html += '<tr><td>Rushing TDs</td><td>' + (stats.rushingTDs || 0) + '</td></tr>';
      if (!isCareer) html += '<tr><td>Carries</td><td>' + (stats.carries || 0) + '</td></tr>';
      html += '<tr><td>Receiving yards</td><td>' + (stats.receivingYards || 0).toLocaleString() + '</td></tr>';
      html += '<tr><td>Receiving TDs</td><td>' + (stats.receivingTDs || 0) + '</td></tr>';
    } else if (pos === 'WR' || pos === 'TE') {
      html += '<tr><td>Receiving yards</td><td>' + (stats.receivingYards || 0).toLocaleString() + '</td></tr>';
      html += '<tr><td>Receiving TDs</td><td>' + (stats.receivingTDs || 0) + '</td></tr>';
      if (!isCareer) html += '<tr><td>Receptions</td><td>' + (stats.receptions || 0) + '</td></tr>';
    } else if (pos === 'DL' || pos === 'LB') {
      html += '<tr><td>Sacks</td><td>' + (stats.sacks || 0) + '</td></tr>';
      html += '<tr><td>Tackles</td><td>' + (stats.tackles || 0) + '</td></tr>';
      if (stats.interceptionsMade > 0) html += '<tr><td>Interceptions</td><td>' + stats.interceptionsMade + '</td></tr>';
    } else if (pos === 'CB' || pos === 'S') {
      html += '<tr><td>Tackles</td><td>' + (stats.tackles || 0) + '</td></tr>';
      html += '<tr><td>Interceptions</td><td>' + (stats.interceptionsMade || 0) + '</td></tr>';
      if (stats.sacks > 0) html += '<tr><td>Sacks</td><td>' + stats.sacks + '</td></tr>';
    } else if (pos === 'K') {
      html += '<tr><td>Field goals made</td><td>' + (stats.fieldGoalsMade || 0) + (stats.fieldGoalsAttempted ? '/' + stats.fieldGoalsAttempted : '') + '</td></tr>';
      html += '<tr><td>Extra points</td><td>' + (stats.extraPoints || 0) + '</td></tr>';
    } else if (pos === 'P') {
      html += '<tr><td>Punts</td><td>' + (stats.punts || 0) + '</td></tr>';
      html += '<tr><td>Punt yards</td><td>' + (stats.puntYards || 0).toLocaleString() + '</td></tr>';
      const avg = stats.punts > 0 ? (stats.puntYards / stats.punts).toFixed(1) : '0.0';
      html += '<tr><td>Average</td><td>' + avg + '</td></tr>';
      html += '<tr><td>Inside 20</td><td>' + (stats.puntsInside20 || 0) + '</td></tr>';
    } else if (pos === 'OL') {
      html += '<tr><td>Position</td><td>Offensive Line</td></tr>';
      html += '<tr><td>Note</td><td>OL stats tracked via team performance</td></tr>';
    }
    html += '</table>';
    return html;
  },

  // PLAYERS LIST
  renderPlayers() {
    const active = this.state.players.filter(p => !p.retired && p.team !== null);
    const top = [...active].sort((a, b) => b.rating - a.rating).slice(0, 50);
    let html = '<div class="page-header"><div class="page-title">Top players</div>' +
      '<div class="page-subtitle">' + active.length + ' active players · top 50 by overall</div></div>' +
      '<div class="card"><div class="roster-row head">' +
      '<div>#</div><div>POS</div><div></div><div>NAME</div><div>AGE</div><div>OVR</div><div>TEAM</div></div>';
    top.forEach(p => {
      const team = this.state.teams[p.team];
      const rc = this.ratingClass(p.rating);
      html += '<div class="roster-row" onclick="game.showPlayer(' + p.id + ')">' +
        '<div class="jersey-num">' + p.jerseyNumber + '</div>' +
        '<div><span class="position-tag">' + p.position + '</span></div>' +
        '<div class="player-face-small">' + pixelFaceSVG(p.faceSeed) + '</div>' +
        '<div>' + p.name + '</div>' +
        '<div class="mono-num">' + p.age + '</div>' +
        '<div><span class="rating ' + rc + '">' + p.rating + '</span></div>' +
        '<div class="mono-num muted">' + team.abbr + '</div></div>';
    });
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  },

  // STATISTICS
  renderStatistics() {
    let html = '<div class="page-header"><div class="page-title">Statistics</div>' +
      '<div class="page-subtitle">' + this.state.year + ' season leaders and all-time records</div></div>' +
      '<div class="tab-bar">' +
      '<div class="tab ' + (this.statsTab === 'season' ? 'active' : '') + '" onclick="game.setStatsTab(\'season\')">Season leaders</div>' +
      '<div class="tab ' + (this.statsTab === 'alltime' ? 'active' : '') + '" onclick="game.setStatsTab(\'alltime\')">All-time leaders</div>' +
      '<div class="tab ' + (this.statsTab === 'byteam' ? 'active' : '') + '" onclick="game.setStatsTab(\'byteam\')">By team</div>' +
      '</div>';
    if (this.statsTab === 'season') html += this.renderSeasonLeaders();
    else if (this.statsTab === 'alltime') html += this.renderAllTimeLeaders();
    else html += this.renderByTeamStats();
    document.getElementById('content').innerHTML = html;
  },

  setStatsTab(tab) { this.statsTab = tab; this.renderStatistics(); },

  renderSeasonLeaders() {
    const players = this.state.players.filter(p => !p.retired);
    const cats = [
      { title: 'Passing yards', key: 'passingYards' },
      { title: 'Passing TDs', key: 'passingTDs' },
      { title: 'Rushing yards', key: 'rushingYards' },
      { title: 'Rushing TDs', key: 'rushingTDs' },
      { title: 'Receiving yards', key: 'receivingYards' },
      { title: 'Receptions', key: 'receptions' },
      { title: 'Sacks', key: 'sacks' },
      { title: 'Interceptions', key: 'interceptionsMade' },
      { title: 'Tackles', key: 'tackles' },
      { title: 'Field goals made', key: 'fieldGoalsMade' }
    ];
    let html = '';
    cats.forEach(c => {
      const sorted = [...players].sort((a, b) => (b.seasonStats[c.key] || 0) - (a.seasonStats[c.key] || 0)).slice(0, 5);
      html += '<div class="card"><div class="card-header"><div class="card-title">' + c.title + '</div></div>';
      sorted.forEach((p, i) => {
        const team = this.state.teams[p.team];
        html += '<div class="leader-row" onclick="game.showPlayer(' + p.id + ')">' +
          '<div class="leader-rank">' + (i + 1) + '</div>' +
          '<div><span class="leader-name">' + p.name + '</span><span class="leader-team">' + (team ? team.abbr : 'FA') + ' · ' + p.position + '</span></div>' +
          '<div class="leader-stat">' + (p.seasonStats[c.key] || 0).toLocaleString() + '</div></div>';
      });
      html += '</div>';
    });
    // Punting leaders
    const punters = players.filter(p => p.position === 'P' && p.seasonStats.punts > 0);
    const byAvg = [...punters].sort((a, b) => (b.seasonStats.puntYards/Math.max(1,b.seasonStats.punts)) - (a.seasonStats.puntYards/Math.max(1,a.seasonStats.punts))).slice(0, 5);
    if (byAvg.length > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">Punting · avg yards</div></div>';
      byAvg.forEach((p, i) => {
        const team = this.state.teams[p.team];
        const avg = (p.seasonStats.puntYards/p.seasonStats.punts).toFixed(1);
        html += '<div class="leader-row" onclick="game.showPlayer(' + p.id + ')">' +
          '<div class="leader-rank">' + (i + 1) + '</div>' +
          '<div><span class="leader-name">' + p.name + '</span><span class="leader-team">' + (team ? team.abbr : 'FA') + '</span></div>' +
          '<div class="leader-stat">' + avg + ' (' + p.seasonStats.punts + ' punts)</div></div>';
      });
      html += '</div>';
    }
    return html;
  },

  renderAllTimeLeaders() {
    const players = this.state.players;
    const cats = [
      { title: 'Career passing yards', key: 'passingYards' },
      { title: 'Career rushing yards', key: 'rushingYards' },
      { title: 'Career receiving yards', key: 'receivingYards' },
      { title: 'Career touchdowns', key: 'touchdowns' },
      { title: 'Career sacks', key: 'sacks' },
      { title: 'Career tackles', key: 'tackles' },
      { title: 'Career interceptions', key: 'interceptionsMade' }
    ];
    let html = '';
    cats.forEach(c => {
      const sorted = [...players].filter(p => (p.careerStats[c.key] || 0) > 0).sort((a, b) => (b.careerStats[c.key] || 0) - (a.careerStats[c.key] || 0)).slice(0, 10);
      if (sorted.length === 0) return;
      html += '<div class="card"><div class="card-header"><div class="card-title">' + c.title + '</div></div>';
      sorted.forEach((p, i) => {
        const team = p.team !== null ? this.state.teams[p.team] : null;
        html += '<div class="leader-row" onclick="game.showPlayer(' + p.id + ')">' +
          '<div class="leader-rank">' + (i + 1) + '</div>' +
          '<div><span class="leader-name">' + p.name + (p.hofInducted ? ' ★' : '') + '</span>' +
          '<span class="leader-team">' + (team ? team.abbr : 'Retired') + ' · ' + p.position + '</span></div>' +
          '<div class="leader-stat">' + (p.careerStats[c.key] || 0).toLocaleString() + '</div></div>';
      });
      html += '</div>';
    });
    return html;
  },

  renderByTeamStats() {
    const teams = [...this.state.teams].sort((a, b) => (b.historicalStats.wins) - (a.historicalStats.wins));
    let html = '<div class="card"><div class="card-header"><div class="card-title">Franchise records · all-time</div></div>' +
      '<table><thead><tr><th>Team</th><th class="text-center">W</th><th class="text-center">L</th><th class="text-center">PCT</th>' +
      '<th class="text-center">Titles</th><th class="text-center">Playoffs</th><th class="text-center">Seasons</th></tr></thead><tbody>';
    teams.forEach(t => {
      const hs = t.historicalStats;
      const games = hs.wins + hs.losses;
      const pct = games > 0 ? (hs.wins / games).toFixed(3) : '.000';
      html += '<tr onclick="game.showTeam(' + t.id + ')">' +
        '<td><span class="team-color-bar" style="background:' + t.primary + '"></span><strong>' + t.city + ' ' + t.name + '</strong></td>' +
        '<td class="text-center mono-num">' + hs.wins + '</td>' +
        '<td class="text-center mono-num">' + hs.losses + '</td>' +
        '<td class="text-center mono-num">' + pct + '</td>' +
        '<td class="text-center mono-num">' + hs.championships + '</td>' +
        '<td class="text-center mono-num muted">' + hs.playoffApps + '</td>' +
        '<td class="text-center mono-num muted">' + hs.seasons + '</td></tr>';
    });
    html += '</tbody></table></div>';
    return html;
  },

  // AWARDS
  renderAwards() {
    const aw = this.awardScores();
    let html = '<div class="page-header"><div class="page-title">Awards</div>' +
      '<div class="page-subtitle">' + this.state.year + ' season favorites and past winners</div></div>';
    html += this.renderAwardCard('Most Valuable Player', 'mvp', aw.mvp, 'Passing/rushing/receiving production weighted by team success. QB-heavy.', 'player');
    html += this.renderAwardCard('Offensive Player of the Year', 'opoy', aw.opoy, 'Best offensive output regardless of team record.', 'player');
    html += this.renderAwardCard('Defensive Player of the Year', 'dpoy', aw.dpoy, 'Sacks × 6 + INTs × 8 + tackles × 0.8. DL bonus.', 'player');
    html += this.renderAwardCard('Offensive Rookie of the Year', 'oroy', aw.oroy, 'Best offensive performance among first-year players.', 'player');
    html += this.renderAwardCard('Defensive Rookie of the Year', 'droy', aw.droy, 'Best defensive performance among first-year players.', 'player');
    html += this.renderAwardCard('Coach of the Year', 'coy', aw.coy, 'Wins × 10 + improvement over historical baseline × 80.', 'coach');

    // Past winners
    if (this.state.awardsHistory.length > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">Past winners</div></div>' +
        '<table><thead><tr><th>Year</th><th>MVP</th><th>OPOY</th><th>DPOY</th><th>OROY</th><th>DROY</th><th>COY</th></tr></thead><tbody>';
      this.state.awardsHistory.forEach(rec => {
        html += '<tr>' +
          '<td class="mono-num">' + rec.year + '</td>' +
          '<td>' + (rec.mvp ? rec.mvp.name : '—') + '</td>' +
          '<td>' + (rec.opoy ? rec.opoy.name : '—') + '</td>' +
          '<td>' + (rec.dpoy ? rec.dpoy.name : '—') + '</td>' +
          '<td>' + (rec.oroy ? rec.oroy.name : '—') + '</td>' +
          '<td>' + (rec.droy ? rec.droy.name : '—') + '</td>' +
          '<td>' + (rec.coy ? rec.coy.name : '—') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  renderAwardCard(title, key, list, formula, type) {
    let html = '<div class="award-card">' +
      '<div class="award-header">' + this.state.year + ' favorites</div>' +
      '<div class="award-title">' + title + '</div>' +
      '<div class="award-formula">' + formula + '</div>';
    if (list.length === 0) {
      html += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No candidates yet</div>';
    } else {
      list.slice(0, 5).forEach((entry, i) => {
        if (type === 'coach' && entry.team) {
          html += '<div class="award-fav-row" onclick="game.showCoach(' + entry.team.id + ')" style="cursor:pointer">' +
            '<div class="award-rank ' + (i === 0 ? 'first' : '') + '">' + (i + 1) + '</div>' +
            '<div class="coach-face" style="width:40px;height:40px">' + pixelFaceSVG(stringHash(entry.team.coachId)) + '</div>' +
            '<div><div class="award-fav-name">' + entry.team.coachName + '</div>' +
            '<div class="award-fav-meta">' + entry.team.city + ' ' + entry.team.name + ' · ' + entry.team.wins + '–' + entry.team.losses + '</div></div>' +
            '<div class="award-fav-stat">' + entry.score.toFixed(0) + '</div></div>';
        } else if (entry.player) {
          const p = entry.player;
          const team = this.state.teams[p.team];
          html += '<div class="award-fav-row" onclick="game.showPlayer(' + p.id + ')" style="cursor:pointer">' +
            '<div class="award-rank ' + (i === 0 ? 'first' : '') + '">' + (i + 1) + '</div>' +
            '<div class="player-face-small" style="width:40px;height:40px">' + pixelFaceSVG(p.faceSeed) + '</div>' +
            '<div><div class="award-fav-name">' + p.name + '</div>' +
            '<div class="award-fav-meta">' + p.position + ' · ' + (team ? team.abbr : 'FA') + '</div></div>' +
            '<div class="award-fav-stat">' + entry.score.toFixed(0) + '</div></div>';
        }
      });
    }
    html += '</div>';
    return html;
  },

  // HALL OF FAME
  renderHOF() {
    const sorted = [...this.state.hallOfFame].sort((a, b) => b.inductedYear - a.inductedYear);
    let html = '<div class="page-header"><div class="page-title">Hall of Fame</div>' +
      '<div class="page-subtitle">' + sorted.length + ' inductees</div></div>';
    if (sorted.length === 0) {
      html += '<div class="empty-state">No inductees yet. Star players retire into the HOF after 8+ seasons.</div>';
    } else {
      html += '<div class="card">';
      sorted.forEach(h => {
        const s = h.careerStats || {};
        const statLine = [];
        if (s.passingYards > 0) statLine.push(s.passingYards.toLocaleString() + ' pass yds');
        if (s.rushingYards > 0) statLine.push(s.rushingYards.toLocaleString() + ' rush yds');
        if (s.receivingYards > 0) statLine.push(s.receivingYards.toLocaleString() + ' rec yds');
        if (s.sacks > 0) statLine.push(s.sacks + ' sacks');
        html += '<div class="hof-row" onclick="game.showPlayer(' + h.playerId + ')" style="cursor:pointer">' +
          '<div class="hof-year-class">Class of<br>' + h.inductedYear + '</div>' +
          '<div><div class="hof-name-main">' + h.name + '</div>' +
          '<div class="hof-pos">' + h.position + ' · ' + h.yearsInLeague + ' seasons · ' + (h.awards ? h.awards.length : 0) + ' awards</div></div>' +
          '<div class="hof-stats">' + statLine.join('<br>') + '</div></div>';
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  // RECORDS
  renderRecords() {
    const r = this.state.records;
    let html = '<div class="page-header"><div class="page-title">Records</div>' +
      '<div class="page-subtitle">Single-season records and franchise championships</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title">Single-season records</div></div>' +
      '<div class="record-item"><div class="record-label">Passing yards</div>' +
      '<div class="record-value">' + (r.seasonPassingYards.value > 0 ? r.seasonPassingYards.value.toLocaleString() : '—') + '</div>' +
      '<div class="record-holder">' + (r.seasonPassingYards.player ? r.seasonPassingYards.player + ' · ' + r.seasonPassingYards.year : 'No record yet') + '</div></div>' +
      '<div class="record-item"><div class="record-label">Rushing yards</div>' +
      '<div class="record-value">' + (r.seasonRushingYards.value > 0 ? r.seasonRushingYards.value.toLocaleString() : '—') + '</div>' +
      '<div class="record-holder">' + (r.seasonRushingYards.player ? r.seasonRushingYards.player + ' · ' + r.seasonRushingYards.year : 'No record yet') + '</div></div>' +
      '<div class="record-item"><div class="record-label">Receiving yards</div>' +
      '<div class="record-value">' + (r.seasonReceivingYards.value > 0 ? r.seasonReceivingYards.value.toLocaleString() : '—') + '</div>' +
      '<div class="record-holder">' + (r.seasonReceivingYards.player ? r.seasonReceivingYards.player + ' · ' + r.seasonReceivingYards.year : 'No record yet') + '</div></div>' +

    // Championships by franchise
    const champs = [...this.state.teams].filter(t => t.historicalStats.championships > 0).sort((a, b) => b.historicalStats.championships - a.historicalStats.championships);
    if (champs.length > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">Most championships</div></div><table><thead><tr><th>Team</th><th class="text-center">Titles</th></tr></thead><tbody>';
      champs.forEach(t => {
        html += '<tr onclick="game.showTeam(' + t.id + ')">' +
          '<td><span class="team-color-bar" style="background:' + t.primary + '"></span>' + t.city + ' ' + t.name + '</td>' +
          '<td class="text-center mono-num"><strong>' + t.historicalStats.championships + '</strong></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  // CHAMPIONS
  renderChampions() {
    let html = '<div class="page-header"><div class="page-title">Champions</div>' +
      '<div class="page-subtitle">' + this.state.champions.length + ' champions in league history</div></div>';
    if (this.state.champions.length === 0) {
      html += '<div class="empty-state">No champion yet. Finish a season to crown one.</div>';
    } else {
      html += '<div class="card">';
      [...this.state.champions].reverse().forEach(c => {
        html += '<div class="champ-row" onclick="game.showTeam(' + c.teamId + ')" style="cursor:pointer">' +
          '<div class="champ-year">' + c.year + '</div>' +
          '<div><div class="champ-team">' + c.team + '</div>' +
          '<div class="champ-record">' + c.record + '</div></div>' +
          '<div class="champ-runnerup">Runner-up: ' + c.runnerUp + '</div></div>';
      });
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  },

  // ABOUT
  renderAbout() {
    const totalPlayers = this.state.players.length;
    const activePlayers = this.state.players.filter(p => !p.retired).length;
    const seasons = this.state.year - 1970;
    let html = '<div class="page-header"><div class="page-title">About this league</div>' +
      '<div class="page-subtitle">League overview and management</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title">League overview</div></div>' +
      '<div class="stats-grid">' +
      '<div class="stat-block"><div class="stat-block-label">Founded</div><div class="stat-block-value">1970</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Current year</div><div class="stat-block-value">' + this.state.year + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Seasons played</div><div class="stat-block-value">' + seasons + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Teams</div><div class="stat-block-value">32</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Active players</div><div class="stat-block-value">' + activePlayers + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Total players</div><div class="stat-block-value">' + totalPlayers + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">HOF inductees</div><div class="stat-block-value">' + this.state.hallOfFame.length + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Salary cap</div><div class="stat-block-value" style="font-size:14px">' + formatMoney(getSalaryCap(this.state.year)) + '</div></div>' +
      '</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title">Manage</div></div>' +
      '<div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" onclick="game.saveGame();alert(\'Saved!\')">Save now</button>' +
      '<button class="btn" onclick="game.showModeChoice()">Start new league</button>' +
      '<button class="btn btn-danger" onclick="game.deleteSave()">Delete save</button>' +
      '</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title">Tips</div></div>' +
      '<div style="padding:16px;font-size:13px;color:var(--text-muted);line-height:1.6">' +
      '<p style="margin-bottom:8px"><strong>Spacebar</strong> simulates the next week.</p>' +
      '<p style="margin-bottom:8px"><strong>Esc</strong> closes any modal.</p>' +
      '<p style="margin-bottom:8px"><strong>Cap management</strong> kicks in at season end. Restructure star contracts to free space.</p>' +
      '<p>Click any player, team, or coach for a detail view.</p>' +
      '</div></div>';
    document.getElementById('content').innerHTML = html;
  },

  // NEWS
  renderNews() {
    const news = document.getElementById('newsContent');
    const count = document.getElementById('newsCount');
    if (!this.state.headlines || this.state.headlines.length === 0) {
      news.innerHTML = '<div class="empty-state" style="padding:24px 0;font-size:12px">No news yet</div>';
      count.textContent = '0';
      return;
    }
    count.textContent = this.state.headlines.length;
    let html = '';
    this.state.headlines.slice(0, 30).forEach(h => {
      const cls = h.type ? 'headline ' + h.type : 'headline';
      html += '<div class="' + cls + '">' +
        '<div class="headline-date">' + h.year + (h.week ? ' · W' + h.week : '') + '</div>' +
        '<div class="headline-title">' + h.title + '</div>' +
        '<div class="headline-body">' + (h.body || '') + '</div></div>';
    });
    news.innerHTML = html;
  },

  // MODAL HELPER
  showModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('show');
  },

  // SAVE/LOAD
  saveGame() {
    if (!this.state) return;
    try {
      localStorage.setItem('gridironDynastySave', JSON.stringify(this.state));
    } catch (e) {
      console.error('Save failed', e);
    }
  },

  loadGame() {
    try {
      const data = localStorage.getItem('gridironDynastySave');
      if (data) this.state = JSON.parse(data);
    } catch (e) {
      console.error('Load failed', e);
      this.state = null;
    }
  },

  deleteSave() {
    if (!confirm('Delete your saved league? This cannot be undone.')) return;
    localStorage.removeItem('gridironDynastySave');
    this.state = null;
    location.reload();
  }
};

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

game.init();
</script>
</body>
</html>
