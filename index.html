<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Dynasty</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --surface-2: #f5f5f4;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
  --text: #1c1917;
  --text-muted: #78716c;
  --text-dim: #a8a29e;
  --success: #15803d;
  --danger: #b91c1c;
  --warning: #b45309;
  --info: #1e40af;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}

.mono { font-family: 'JetBrains Mono', monospace; }

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  width: 28px;
  height: 28px;
  background: var(--text);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.5px;
}

.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
.brand-name span { color: var(--text-muted); font-weight: 400; }

.status-bar { display: flex; gap: 24px; align-items: center; }
.status-item { display: flex; flex-direction: column; gap: 2px; }

.status-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.status-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }

.era-tag {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.user-team-tag {
  background: var(--text);
  color: white;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.header-actions { display: flex; gap: 8px; }

main {
  display: grid;
  grid-template-columns: 200px 1fr 320px;
  overflow: hidden;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
}

.nav-section { margin-bottom: 20px; }

.nav-title {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 0 20px 8px;
  font-weight: 600;
}

.nav-item {
  padding: 7px 20px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.1s;
  border-left: 2px solid transparent;
}

.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--surface-2); border-left-color: var(--text); font-weight: 500; }
.nav-item.user-team-item { color: var(--warning); }
.nav-item.user-team-item.active { border-left-color: var(--warning); }

.nav-icon { width: 16px; display: inline-flex; justify-content: center; opacity: 0.6; }
.nav-item.active .nav-icon { opacity: 1; }

.content { background: var(--bg); overflow-y: auto; padding: 24px 32px; }

.page-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 4px; }
.page-subtitle { color: var(--text-muted); font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--border); margin-bottom: 16px; }

.card-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-title { font-weight: 600; font-size: 13px; letter-spacing: -0.2px; }
.card-meta { font-size: 12px; color: var(--text-muted); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead th {
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tbody tr { transition: background 0.1s; cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }

.text-center { text-align: center; }
.text-right { text-align: right; }
.mono-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.win { color: var(--success); font-weight: 500; }
.loss { color: var(--danger); }
.muted { color: var(--text-muted); }
.dim { color: var(--text-dim); }

.btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 7px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover { background: var(--surface-2); border-color: var(--text-muted); }
.btn-primary { background: var(--text); color: white; border-color: var(--text); }
.btn-primary:hover { background: #292524; border-color: #292524; }
.btn-danger { color: var(--danger); border-color: var(--border-strong); }
.btn-danger:hover { background: #fef2f2; border-color: var(--danger); }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.division-block { margin-bottom: 24px; }

.division-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 16px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.team-color-bar {
  display: inline-block;
  width: 3px;
  height: 14px;
  vertical-align: middle;
  margin-right: 8px;
}

.leader-badge {
  display: inline-block;
  background: var(--text);
  color: white;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.5px;
}

.user-row { background: #fffbeb !important; }

.news-feed {
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

.news-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.headline { padding: 10px 0; border-bottom: 1px solid var(--border); }
.headline:last-child { border-bottom: none; }

.headline-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.headline-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.headline-body { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
.headline.scandal .headline-title { color: var(--danger); }
.headline.champ .headline-title { color: var(--warning); }
.headline.hof .headline-title { color: var(--info); }

.welcome {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100%;
  text-align: center;
  padding: 40px;
  max-width: 720px;
  margin: 0 auto;
}

.welcome-title { font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 12px; }

.welcome-subtitle {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 32px;
  max-width: 500px;
  line-height: 1.5;
}

.mode-choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
  max-width: 600px;
  margin-bottom: 32px;
}

.mode-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 24px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}

.mode-card:hover { border-color: var(--text); transform: translateY(-2px); }
.mode-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.mode-card p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

.welcome-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 40px;
  width: 100%;
}

.feature { background: var(--surface); border: 1px solid var(--border); padding: 16px; text-align: left; }
.feature-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.feature-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
}

.team-card:hover { border-color: var(--text-muted); }
.team-card.selected { border-color: var(--text); background: var(--surface-2); }

.team-card-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.team-card-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; margin-left: 8px; }
.team-card-city { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; margin-left: 8px; }
.team-card-record { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; margin-left: 8px; }
.team-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; margin-left: 8px; }

.recap-section { margin-bottom: 24px; }

.standout-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.standout-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px 16px;
  border-top: 3px solid var(--text);
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 12px;
  align-items: center;
}

.standout-card.offense { border-top-color: #2563eb; }
.standout-card.defense { border-top-color: #dc2626; }
.standout-card.special { border-top-color: #ca8a04; }

.standout-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}

.standout-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.standout-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.standout-stat { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; }

.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

.game-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.1s;
}

.game-card:hover { border-color: var(--text-muted); background: var(--surface-2); }
.game-card.user-game { border-left: 3px solid var(--text); }

.game-card-teams {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 6px;
}

.game-card-team { display: flex; align-items: center; gap: 8px; font-size: 13px; }

.game-card-team .team-abbr-inline {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 11px;
  min-width: 32px;
}

.game-card-team.winner { font-weight: 600; }
.game-card-team.loser { color: var(--text-muted); }
.game-card-score { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; min-width: 24px; text-align: right; }
.game-card-score.loser { color: var(--text-muted); font-weight: 400; }
.game-card-detail { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* BOX SCORE */
.boxscore-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
  padding: 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.boxscore-team { display: flex; flex-direction: column; gap: 4px; }
.boxscore-team.away { align-items: flex-end; text-align: right; }
.boxscore-team-name { font-size: 16px; font-weight: 600; }
.boxscore-team-record { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.boxscore-score-block { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; }
.boxscore-score { font-size: 32px; font-weight: 700; }
.boxscore-score.loser { color: var(--text-muted); }
.boxscore-dash { color: var(--text-dim); font-size: 18px; }

.boxscore-team-header {
  background: var(--surface-2);
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 600;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.boxscore-stat-cat {
  padding: 8px 16px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.box-row {
  display: grid;
  padding: 6px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  align-items: center;
}

.box-row.passing { grid-template-columns: 1fr 60px 60px 60px; }
.box-row.rushing { grid-template-columns: 1fr 60px 60px; }
.box-row.receiving { grid-template-columns: 1fr 60px 60px; }
.box-row.defense { grid-template-columns: 1fr 60px 60px; }
.box-row.kicking { grid-template-columns: 1fr 60px 60px; }

.box-row.head {
  background: var(--bg);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.box-row .stat-num { font-family: 'JetBrains Mono', monospace; text-align: right; }

/* DRAFT */
.draft-container { display: grid; grid-template-columns: 1fr 280px; gap: 0; height: 100%; }
.draft-main { padding: 20px 24px; overflow-y: auto; }
.draft-sidebar { background: var(--surface); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }

.draft-header-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 20px;
  align-items: center;
}

.draft-round-info { font-size: 12px; color: var(--text-muted); }
.draft-round-info strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-right: 4px; }
.draft-on-clock { font-size: 13px; font-weight: 500; }
.draft-on-clock.user-turn { color: var(--success); font-weight: 600; }

.draft-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

.filter-btn {
  padding: 4px 10px;
  font-size: 11px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

.filter-btn:hover { background: var(--surface-2); }
.filter-btn.active { background: var(--text); color: white; border-color: var(--text); }

.draft-pick-row {
  display: grid;
  grid-template-columns: 40px 50px 1fr 50px 60px;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  font-size: 12px;
}

.draft-pick-row.clickable { cursor: pointer; }
.draft-pick-row.clickable:hover { background: var(--surface-2); }
.draft-pick-row:last-child { border-bottom: none; }

.draft-pick-row .pick-btn {
  background: var(--text);
  color: white;
  border: none;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.draft-pick-row .pick-btn:hover { background: #292524; }

.draft-recent-pick {
  font-size: 11px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 8px;
  align-items: center;
}

.draft-recent-pick:last-child { border-bottom: none; }
.pick-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
.draft-recent-pick.user-pick { background: #fffbeb; padding-left: 6px; padding-right: 6px; }

.draft-roster-mini {
  display: grid;
  grid-template-columns: 50px 1fr 30px;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  align-items: center;
}

.draft-roster-mini:last-child { border-bottom: none; }

.game-row {
  display: grid;
  grid-template-columns: 1fr 70px 1fr;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.game-row:last-child { border-bottom: none; }
.team-side { display: flex; align-items: center; gap: 8px; }
.team-side.away { justify-content: flex-end; }

.team-abbr {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-muted);
  min-width: 36px;
  text-align: center;
}

.team-name-inline { font-weight: 500; }
.score { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
.score .at { color: var(--text-dim); }
.score .winner { color: var(--text); font-weight: 600; }
.score .loser { color: var(--text-muted); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 23, 0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(2px);
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 90%;
  max-width: 720px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title { font-size: 15px; font-weight: 600; }

.modal-close {
  background: none; border: none; font-size: 18px; cursor: pointer;
  color: var(--text-muted); padding: 4px; line-height: 1;
}

.modal-close:hover { color: var(--text); }
.modal-body { padding: 0; overflow-y: auto; flex: 1; }

.roster-row {
  display: grid;
  grid-template-columns: 36px 40px 40px 1fr 50px 60px 40px;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.1s;
}

.roster-row:hover { background: var(--surface-2); }
.roster-row:last-child { border-bottom: none; }

.roster-row.head {
  background: var(--surface-2);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: default;
  grid-template-columns: 36px 40px 40px 1fr 50px 60px 40px;
}

.position-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-2);
  padding: 2px 6px;
  border: 1px solid var(--border);
  text-align: center;
}

.rating {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  padding: 2px 7px;
  display: inline-block;
  min-width: 32px;
  text-align: center;
}

.rating-elite { background: #7c3aed; color: white; }
.rating-great { background: #2563eb; color: white; }
.rating-good { background: #15803d; color: white; }
.rating-avg { background: #ca8a04; color: white; }
.rating-poor { background: #dc2626; color: white; }

.jersey-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }

.hof-row {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 20px;
  align-items: center;
}

.hof-row:last-child { border-bottom: none; }
.hof-year-class { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.hof-name-main { font-size: 15px; font-weight: 600; margin-bottom: 2px; }

  font-size: 11px;

  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;

}

.record-holder { font-size: 12px; color: var(--text-muted); }

.stats-grid {
  display: grid;

  gap: 1px;
  background: var(--border);
}

.stat-block { background: var(--surface); padding: 14px 16px; }

.stat-block-label {
  font-size: 10px;

  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  margin-bottom: 4px;
}

  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 20px;
  padding: 20px;
  border-bottom: 1px solid var(--border);

  align-items: center;

.player-face-large svg, .player-face-small svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

.player-name-big { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }

.section-label {

.stat-table tr:last-child td { border-bottom: none; }

.leader-row {
  display: grid;

// Deterministic from a numeric seed (player.id or coach hash)
function seedRand(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

const SKIN_TONES = ['#f4d4ae','#e8b48f','#c08b5c','#9a6b3f','#6e4823','#4a2f1a'];
const HAIR_COLORS = ['#1a0f08','#3a2410','#6b4423','#8a5a2b','#b88547','#d4a04d','#888888','#cccccc','#5a3220'];
const EYE_COLORS = ['#3a2410','#1a4a6b','#2a5a3a','#5a3a2a','#1a1a1a'];

function pixelFaceSVG(seed, options = {}) {
  // 16x16 grid scaled up
  const r = seedRand(seed + 1);
  const skin = SKIN_TONES[Math.floor(r() * SKIN_TONES.length)];
  const hair = HAIR_COLORS[Math.floor(r() * HAIR_COLORS.length)];
  const eye = EYE_COLORS[Math.floor(r() * EYE_COLORS.length)];
  const hairStyle = Math.floor(r() * 6); // 0-5
  const facialHair = r() < 0.35; // 35% have facial hair
  const eyebrowThick = r() > 0.5;
  const mouthType = Math.floor(r() * 3); // 0=neutral, 1=slight smile, 2=serious
  const noseType = Math.floor(r() * 3);
  
  const helmet = options.helmet;
  const helmetColor = options.helmetColor || '#444';
  
  // Build grid
  const g = Array(16).fill(null).map(() => Array(16).fill(null));
  
  // Background: gradient block
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) g[y][x] = '#e7e5e4';
  
  // Face shape (rounded rectangle ~ rows 4-13, cols 4-11)
  for (let y = 4; y <= 13; y++) {
    for (let x = 4; x <= 11; x++) {
      if ((y === 4 || y === 13) && (x === 4 || x === 11)) continue; // round corners
      g[y][x] = skin;
    }
  }
  // Ears
  g[8][3] = skin; g[9][3] = skin;
  g[8][12] = skin; g[9][12] = skin;
  
  // Neck
  g[14][6] = skin; g[14][7] = skin; g[14][8] = skin; g[14][9] = skin;
  g[15][6] = skin; g[15][7] = skin; g[15][8] = skin; g[15][9] = skin;
  
  // Hair styles
  if (hairStyle === 0) {
    // Short crew cut
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
    g[2][5] = hair; g[2][6] = hair; g[2][7] = hair; g[2][8] = hair; g[2][9] = hair; g[2][10] = hair;
    g[4][4] = hair; g[4][11] = hair;
  } else if (hairStyle === 1) {
    // Buzzcut / very short
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
  } else if (hairStyle === 2) {
    // Side part
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
    g[2][5] = hair; g[2][6] = hair; g[2][7] = hair; g[2][8] = hair; g[2][9] = hair;
    g[4][4] = hair; g[4][5] = hair;
    g[5][4] = hair;
  } else if (hairStyle === 3) {
    // Curly / fro
    for (let x = 3; x <= 12; x++) g[3][x] = hair;
    for (let x = 4; x <= 11; x++) g[2][x] = hair;
    g[1][5] = hair; g[1][6] = hair; g[1][8] = hair; g[1][9] = hair; g[1][10] = hair;
    g[4][4] = hair; g[4][11] = hair;
    g[5][4] = hair; g[5][11] = hair;
  } else if (hairStyle === 4) {
    // Bald / receding
    g[3][5] = hair; g[3][6] = hair; g[3][9] = hair; g[3][10] = hair;
  } else {
    // Slicked back
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
    g[2][6] = hair; g[2][7] = hair; g[2][8] = hair; g[2][9] = hair;
  }
  
  // Eyebrows
  const browColor = hair;
  if (eyebrowThick) {
    g[6][5] = browColor; g[6][6] = browColor;
    g[6][9] = browColor; g[6][10] = browColor;
  } else {
    g[6][5] = browColor;
    g[6][10] = browColor;
  }
  
  // Eyes
  g[7][5] = eye; g[7][6] = '#fff';
  g[7][9] = '#fff'; g[7][10] = eye;
  
  // Nose
  if (noseType === 0) {
    g[8][7] = '#000'; g[8][8] = '#000';
  } else if (noseType === 1) {
    g[9][7] = '#000'; g[9][8] = '#000';
    g[8][8] = '#000';
  } else {
    g[8][8] = '#000';
    g[9][7] = '#000'; g[9][8] = '#000';
  }
  
  // Mouth
  if (mouthType === 0) {
    g[11][6] = '#000'; g[11][7] = '#000'; g[11][8] = '#000'; g[11][9] = '#000';
  } else if (mouthType === 1) {
    g[11][6] = '#000'; g[11][7] = '#000'; g[11][8] = '#000'; g[11][9] = '#000';
    g[10][6] = '#000'; g[10][9] = '#000';
  } else {
    g[11][7] = '#000'; g[11][8] = '#000';
  }
  
  // Facial hair
  if (facialHair) {
    const beardStyle = Math.floor(r() * 3);
    if (beardStyle === 0) {
      // mustache only
      g[10][6] = hair; g[10][7] = hair; g[10][8] = hair; g[10][9] = hair;
    } else if (beardStyle === 1) {
      // goatee
      g[12][7] = hair; g[12][8] = hair;
      g[13][6] = hair; g[13][7] = hair; g[13][8] = hair; g[13][9] = hair;
    } else {
      // full beard
      g[12][5] = hair; g[12][6] = hair; g[12][7] = hair; g[12][8] = hair; g[12][9] = hair; g[12][10] = hair;
      g[13][5] = hair; g[13][6] = hair; g[13][7] = hair; g[13][8] = hair; g[13][9] = hair; g[13][10] = hair;
    }
  }
  
  // Optional helmet overlay
  if (helmet) {
    for (let y = 1; y <= 5; y++) {
      for (let x = 3; x <= 12; x++) {
        if ((y === 1 && (x < 5 || x > 10))) continue;
        g[y][x] = helmetColor;
      }
    }
    // Helmet stripe
    g[2][7] = '#fff'; g[2][8] = '#fff';
    g[3][7] = '#fff'; g[3][8] = '#fff';
    g[4][7] = '#fff'; g[4][8] = '#fff';
    // Face mask hint
    g[8][3] = helmetColor; g[9][3] = helmetColor;
    g[8][12] = helmetColor; g[9][12] = helmetColor;
  }
  
  // Build SVG
  let rects = '';
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      if (g[y][x] && g[y][x] !== '#e7e5e4') {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${g[y][x]}"/>`;
      }
    }
  }
  
  return `<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <rect width="16" height="16" fill="#e7e5e4"/>
    ${rects}
  </svg>`;
}

function stringHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

    else if (year < 2015) firstNames = FIRST_NAMES_90S;
    else firstNames = FIRST_NAMES_2020S;
    let first = firstNames[Math.floor(Math.random() * firstNames.length)];
    let last = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
    // 6% get a suffix to add variety
    if (Math.random() < 0.06) {

          this.state.players.push(p);
          team.roster.push(p.id);
        }
      });
    });

  generatePlayer(position, teamId, overrideAge) {
    const age = overrideAge !== undefined ? overrideAge : 21 + Math.floor(Math.random() * 13);
    let rating = 50 + Math.floor(Math.random() * 40);
    if (age >= 26 && age <= 30) rating = Math.min(99, rating + 5);
    if (age >= 32) rating = Math.max(45, rating - 5);
    
    return {
      id: this.state.players.length,
      name: this.generateName(this.state.year),
      position, age, rating, team: teamId,
      jerseyNumber: this.assignJerseyNumber(position),
      yearsInLeague: Math.max(0, age - 22),
      careerStats: EMPTY_CAREER_STATS(),
      seasonStats: EMPTY_SEASON_STATS(),
      retired: false, hofInducted: false,
      awards: [], // array of {year, type}
      faceSeed: Math.floor(Math.random() * 1000000),
      draftYear: this.state.year  // for ROY eligibility
    };
  },

  assignJerseyNumber(position) {
    const r = { QB: [1, 19], RB: [20, 49], WR: [10, 19], TE: [80, 89], OL: [50, 79], DL: [50, 99], LB: [40, 59], CB: [20, 49], S: [20, 49], K: [1, 19] };
    const [min, max] = r[position] || [1, 99];
    return min + Math.floor(Math.random() * (max - min + 1));
  },

  // ============================================================
  // DRAFT
  // ============================================================

  startDraft() {
    this.state.draftPool = [];
    const totalNeeded = 32 * 52;
    
    const posDistribution = [];
    Object.entries(POSITION_COUNTS).forEach(([pos, count]) => {
      const proportional = Math.floor((count / 46) * totalNeeded);
      for (let i = 0; i < proportional; i++) posDistribution.push(pos);
    });
    while (posDistribution.length < totalNeeded) {
      posDistribution.push(POSITIONS_FOR_DRAFT[Math.floor(Math.random() * POSITIONS_FOR_DRAFT.length)]);
    }
    
    posDistribution.forEach(pos => {
      const p = this.generatePlayer(pos, null);
      this.state.draftPool.push(p);
      this.state.players.push(p);
    });
    
    this.state.draftPool.sort((a, b) => b.rating - a.rating);
    
    const initialOrder = [...Array(32).keys()].sort(() => Math.random() - 0.5);
    this.state.draftOrder = [];
    for (let round = 1; round <= 52; round++) {
      const order = round % 2 === 1 ? initialOrder : [...initialOrder].reverse();
      order.forEach(teamId => this.state.draftOrder.push({ round, teamId }));
    }
    
    this.state.draftActive = true;
    this.state.draftCurrentIdx = 0;
    this.state.draftPicks = [];
    
    this.updateUserTag();
    this.advanceDraftUntilUser();
    this.renderDraft();
  },

  advanceDraftUntilUser() {
    const userId = this.state.userTeamId;
    while (this.state.draftCurrentIdx < this.state.draftOrder.length) {
      const current = this.state.draftOrder[this.state.draftCurrentIdx];
      if (current.teamId === userId) return;
      this.cpuPick(current.teamId);
      this.state.draftCurrentIdx++;
    }
    this.finishDraft();
  },

  cpuPick(teamId) {
    const team = this.state.teams[teamId];
    const need = this.calculateTeamNeeds(team);
    const candidates = this.state.draftPool.slice(0, 20);
    let best = null;
    let bestScore = -1;
    candidates.forEach(p => {
      const needBonus = need[p.position] || 0;
      const score = p.rating + needBonus * 3 + Math.random() * 4;
      if (score > bestScore) { bestScore = score; best = p; }
    });
    if (!best) best = this.state.draftPool[0];
    this.applyPick(teamId, best);
  },

  calculateTeamNeeds(team) {
    const need = {};
    const counts = {};
    team.roster.forEach(id => {
      const p = this.state.players[id];
      counts[p.position] = (counts[p.position] || 0) + 1;
    });
    Object.entries(POSITION_COUNTS).forEach(([pos, target]) => {
      const have = counts[pos] || 0;
      need[pos] = Math.max(0, target - have);
    });
    return need;
  },

  applyPick(teamId, player) {
    player.team = teamId;
    this.state.teams[teamId].roster.push(player.id);
    const idx = this.state.draftPool.indexOf(player);
    if (idx !== -1) this.state.draftPool.splice(idx, 1);
    const orderInfo = this.state.draftOrder[this.state.draftCurrentIdx];
    this.state.draftPicks.push({
      overall: this.state.draftCurrentIdx + 1,
      round: orderInfo.round,
      teamId, playerId: player.id
    });
  },

  userPick(playerId) {
    const player = this.state.players[playerId];
    if (!player || player.team !== null) return;
    const current = this.state.draftOrder[this.state.draftCurrentIdx];
    if (current.teamId !== this.state.userTeamId) return;
    this.applyPick(this.state.userTeamId, player);
    this.state.draftCurrentIdx++;
    this.advanceDraftUntilUser();
    this.saveGame();
    this.renderDraft();
  },

  autoCompleteDraft() {
    if (!confirm('Auto-complete the rest of the draft for you? CPU will pick based on needs.')) return;
    while (this.state.draftCurrentIdx < this.state.draftOrder.length) {
      const current = this.state.draftOrder[this.state.draftCurrentIdx];
      this.cpuPick(current.teamId);
      this.state.draftCurrentIdx++;
    }
    this.finishDraft();
  },

  finishDraft() {
    this.state.draftActive = false;
    this.state.draftPool = [];

    this.addHeadline({
