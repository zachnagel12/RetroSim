<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Dynasty</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #fafaf9; --surface: #ffffff; --surface-2: #f5f5f4;
  --border: #e7e5e4; --border-strong: #d6d3d1;
  --text: #1c1917; --text-muted: #78716c; --text-dim: #a8a29e;
  --success: #15803d; --danger: #b91c1c; --warning: #b45309; --info: #1e40af;
}
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
.mono { font-family: 'JetBrains Mono', monospace; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; background: var(--text); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.brand-name { font-weight: 600; font-size: 15px; }
.brand-name span { color: var(--text-muted); font-weight: 400; }
.status-bar { display: flex; gap: 24px; align-items: center; }
.status-item { display: flex; flex-direction: column; gap: 2px; }
.status-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.status-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
.era-tag { background: var(--surface-2); border: 1px solid var(--border); padding: 4px 10px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.user-team-tag { background: var(--text); color: white; padding: 4px 10px; font-size: 11px; font-weight: 500; }
.header-actions { display: flex; gap: 8px; }
main { display: grid; grid-template-columns: 200px 1fr 320px; overflow: hidden; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
.nav-section { margin-bottom: 20px; }
.nav-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 20px 8px; font-weight: 600; }
.nav-item { padding: 7px 20px; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 10px; border-left: 2px solid transparent; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--surface-2); border-left-color: var(--text); font-weight: 500; }
.nav-item.user-team-item { color: var(--warning); }
.nav-item.user-team-item.active { border-left-color: var(--warning); }
.nav-icon { width: 16px; display: inline-flex; justify-content: center; opacity: 0.6; }
.nav-item.active .nav-icon { opacity: 1; }
.content { background: var(--bg); overflow-y: auto; padding: 24px 32px; }
.page-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 4px; }
.page-subtitle { color: var(--text-muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); margin-bottom: 16px; }
.card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.card-title { font-weight: 600; font-size: 13px; }
.card-meta { font-size: 12px; color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--surface-2); color: var(--text-muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.text-center { text-align: center; } .text-right { text-align: right; }
.mono-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.win { color: var(--success); font-weight: 500; } .loss { color: var(--danger); }
.muted { color: var(--text-muted); } .dim { color: var(--text-dim); }
.btn { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); padding: 7px 14px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); border-color: var(--text-muted); }
.btn-primary { background: var(--text); color: white; border-color: var(--text); }
.btn-primary:hover { background: #292524; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: #fef2f2; border-color: var(--danger); }
.btn-success { color: var(--success); }
.btn-success:hover { background: #f0fdf4; border-color: var(--success); }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.division-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 16px; background: var(--surface-2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.team-color-bar { display: inline-block; width: 3px; height: 14px; vertical-align: middle; margin-right: 8px; }
.leader-badge { display: inline-block; background: var(--text); color: white; font-size: 9px; font-weight: 600; padding: 1px 5px; margin-left: 6px; letter-spacing: 0.5px; }
.user-row { background: #fffbeb !important; }
.news-feed { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
.news-header { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; display: flex; justify-content: space-between; }
.headline { padding: 10px 0; border-bottom: 1px solid var(--border); }
.headline:last-child { border-bottom: none; }
.headline-date { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
.headline-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.headline-body { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
.headline.scandal .headline-title { color: var(--danger); }
.headline.champ .headline-title { color: var(--warning); }
.headline.hof .headline-title { color: var(--info); }
.headline.contract .headline-title { color: var(--info); }
.welcome { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100%; text-align: center; padding: 40px; max-width: 720px; margin: 0 auto; }
.welcome-title { font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 12px; }
.welcome-subtitle { font-size: 16px; color: var(--text-muted); margin-bottom: 32px; max-width: 500px; }
.mode-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 600px; margin-bottom: 32px; }
.mode-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; cursor: pointer; text-align: left; }
.mode-card:hover { border-color: var(--text); }
.mode-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.mode-card p { font-size: 13px; color: var(--text-muted); }
.welcome-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 40px; width: 100%; }
.feature { background: var(--surface); border: 1px solid var(--border); padding: 16px; text-align: left; }
.feature-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.feature-desc { font-size: 11px; color: var(--text-muted); }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.team-card { background: var(--surface); border: 1px solid var(--border); padding: 14px; cursor: pointer; position: relative; }
.team-card:hover { border-color: var(--text-muted); }
.team-card-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.team-card-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; margin-left: 8px; }
.team-card-city { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; margin-left: 8px; }
.team-card-record { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; margin-left: 8px; }
.team-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; margin-left: 8px; }
.recap-section { margin-bottom: 24px; }
.standout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.standout-card { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; border-top: 3px solid var(--text); display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.standout-card.offense { border-top-color: #2563eb; }
.standout-card.defense { border-top-color: #dc2626; }
.standout-card.special { border-top-color: #ca8a04; }
.standout-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.standout-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.standout-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.standout-stat { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; }
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.game-card { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; cursor: pointer; }
.game-card:hover { border-color: var(--text-muted); background: var(--surface-2); }
.game-card.user-game { border-left: 3px solid var(--text); }
.game-card-teams { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.game-card-team { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.game-card-team .team-abbr-inline { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text-muted); font-size: 11px; min-width: 32px; }
.game-card-team.winner { font-weight: 600; }
.game-card-team.loser { color: var(--text-muted); }
.game-card-score { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; min-width: 24px; text-align: right; }
.game-card-score.loser { color: var(--text-muted); font-weight: 400; }
.game-card-detail { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.boxscore-header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; padding: 20px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.boxscore-team { display: flex; flex-direction: column; gap: 4px; }
.boxscore-team.away { align-items: flex-end; text-align: right; }
.boxscore-team-name { font-size: 16px; font-weight: 600; }
.boxscore-team-record { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.boxscore-score-block { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; }
.boxscore-score { font-size: 32px; font-weight: 700; }
.boxscore-score.loser { color: var(--text-muted); }
.boxscore-dash { color: var(--text-dim); font-size: 18px; }
.boxscore-team-header { background: var(--surface-2); padding: 10px 16px; font-size: 12px; font-weight: 600; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.boxscore-stat-cat { padding: 8px 16px; font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; background: var(--bg); border-bottom: 1px solid var(--border); }
.box-row { display: grid; padding: 6px 16px; border-bottom: 1px solid var(--border); font-size: 12px; align-items: center; }
.box-row.passing { grid-template-columns: 1fr 60px 60px 60px; }
.box-row.rushing, .box-row.receiving, .box-row.defense, .box-row.kicking, .box-row.punting { grid-template-columns: 1fr 80px 60px; }
.box-row.head { background: var(--bg); font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.box-row .stat-num { font-family: 'JetBrains Mono', monospace; text-align: right; }
.draft-container { display: grid; grid-template-columns: 1fr 280px; gap: 0; height: 100%; }
.draft-main { padding: 20px 24px; overflow-y: auto; }
.draft-sidebar { background: var(--surface); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
.draft-header-bar { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
.draft-round-info { font-size: 12px; color: var(--text-muted); }
.draft-round-info strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-right: 4px; }
.draft-on-clock { font-size: 13px; font-weight: 500; }
.draft-on-clock.user-turn { color: var(--success); font-weight: 600; }
.draft-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn { padding: 4px 10px; font-size: 11px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.filter-btn:hover { background: var(--surface-2); }
.filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
.draft-pick-row { display: grid; grid-template-columns: 40px 50px 1fr 50px 60px; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; font-size: 12px; }
.draft-pick-row.clickable { cursor: pointer; }
.draft-pick-row.clickable:hover { background: var(--surface-2); }
.draft-pick-row .pick-btn { background: var(--text); color: white; border: none; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
.draft-recent-pick { font-size: 11px; padding: 6px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: center; }
.pick-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
.draft-recent-pick.user-pick { background: #fffbeb; padding-left: 6px; padding-right: 6px; }
.draft-roster-mini { display: grid; grid-template-columns: 50px 1fr 30px; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 11px; align-items: center; }
.game-row { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.team-side { display: flex; align-items: center; gap: 8px; }
.team-side.away { justify-content: flex-end; }
.team-abbr { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; color: var(--text-muted); min-width: 36px; text-align: center; }
.team-name-inline { font-weight: 500; }
.score { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
.score .at { color: var(--text-dim); }
.score .winner { color: var(--text); font-weight: 600; }
.score .loser { color: var(--text-muted); }
.modal-overlay { position: fixed; inset: 0; background: rgba(28, 25, 23, 0.4); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(2px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); width: 90%; max-width: 720px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); padding: 4px; line-height: 1; }
.modal-body { padding: 0; overflow-y: auto; flex: 1; }
.roster-row { display: grid; grid-template-columns: 36px 40px 40px 1fr 50px 60px 80px; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; font-size: 13px; cursor: pointer; }
.roster-row:hover { background: var(--surface-2); }
.roster-row.head { background: var(--surface-2); font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; cursor: default; }
.position-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; background: var(--surface-2); padding: 2px 6px; border: 1px solid var(--border); text-align: center; }
.rating { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; padding: 2px 7px; display: inline-block; min-width: 32px; text-align: center; }
.rating-elite { background: #7c3aed; color: white; }
.rating-great { background: #2563eb; color: white; }
.rating-good { background: #15803d; color: white; }
.rating-avg { background: #ca8a04; color: white; }
.rating-poor { background: #dc2626; color: white; }
.jersey-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.salary-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); text-align: right; }
.salary-tag.high { color: var(--warning); font-weight: 500; }
.salary-tag.elite { color: var(--danger); font-weight: 600; }
.hof-row { padding: 14px 16px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 80px 1fr auto; gap: 20px; align-items: center; }
.hof-year-class { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.hof-name-main { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.hof-pos { font-size: 11px; color: var(--text-muted); }
.hof-stats { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); text-align: right; }
.champ-row { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 20px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.champ-year { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
.champ-team { font-weight: 500; }
.champ-record { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
.champ-runnerup { font-size: 12px; color: var(--text-muted); }
.record-item { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.record-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
.record-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; margin-bottom: 2px; }
.record-holder { font-size: 12px; color: var(--text-muted); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1px; background: var(--border); }
.stat-block { background: var(--surface); padding: 14px 16px; }
.stat-block-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 4px; }
.stat-block-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; }
.player-detail-header { display: grid; grid-template-columns: 96px 1fr; gap: 20px; padding: 20px; border-bottom: 1px solid var(--border); background: var(--surface-2); align-items: center; }
.player-face-large { width: 96px; height: 96px; background: white; border: 1px solid var(--border); }
.player-face-small { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); }
.player-face-large svg, .player-face-small svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.player-name-big { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.player-meta { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
.player-detail-body { padding: 20px; }
.section-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.stat-table { width: 100%; font-size: 13px; margin-bottom: 16px; }
.stat-table td { padding: 6px 0; border-bottom: 1px solid var(--border); }
.stat-table td:first-child { color: var(--text-muted); font-size: 12px; }
.stat-table td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.leader-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; }
.leader-rank { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
.leader-name { font-weight: 500; }
.leader-team { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-left: 6px; }
.leader-stat { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; text-align: right; }
.empty-state { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
.award-card { background: var(--surface); border: 1px solid var(--border); padding: 18px; margin-bottom: 12px; }
.award-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.award-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.award-formula { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.4; }

  const r = seedRand(seed + 1);

  } else if (hairStyle === 1) {
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
  } else if (hairStyle === 2) {
    for (let x = 4; x <= 11; x++) g[3][x] = hair;
    g[2][5] = hair; g[2][6] = hair; g[2][7] = hair; g[2][8] = hair; g[2][9] = hair;
    g[4][4] = hair; g[4][5] = hair; g[5][4] = hair;

    for (let x = 3; x <= 12; x++) g[3][x] = hair;
    for (let x = 4; x <= 11; x++) g[2][x] = hair;
    g[1][5] = hair; g[1][6] = hair; g[1][8] = hair; g[1][9] = hair; g[1][10] = hair;
    g[4][4] = hair; g[4][11] = hair; g[5][4] = hair; g[5][11] = hair;

    g[3][5] = hair; g[3][6] = hair; g[3][9] = hair; g[3][10] = hair;

  if (facialHair) {
    const beardStyle = Math.floor(r() * 3);
    if (beardStyle === 0) { g[10][6] = hair; g[10][7] = hair; g[10][8] = hair; g[10][9] = hair; }
    else if (beardStyle === 1) { g[12][7] = hair; g[12][8] = hair; g[13][6] = hair; g[13][7] = hair; g[13][8] = hair; g[13][9] = hair; }
    else { g[12][5] = hair; g[12][6] = hair; g[12][7] = hair; g[12][8] = hair; g[12][9] = hair; g[12][10] = hair; g[13][5] = hair; g[13][6] = hair; g[13][7] = hair; g[13][8] = hair; g[13][9] = hair; g[13][10] = hair; }
  }
  let rects = '';
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (g[y][x] && g[y][x] !== '#e7e5e4') rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + g[y][x] + '"/>';
  }
  return '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="16" height="16" fill="#e7e5e4"/>' + rects + '</svg>';
}

function stringHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// NFL-realistic age distribution
function realisticNFLAge() {
  const buckets = [[21,2],[22,14],[23,16],[24,14],[25,12],[26,10],[27,9],[28,7],[29,5],[30,4],[31,3],[32,2],[33,1],[34,0.5],[35,0.3]];
  const total = buckets.reduce((s,[_,w]) => s+w, 0);
  let r = Math.random() * total;
  for (const [age,w] of buckets) { if (r < w) return age; r -= w; }
  return 25;
}

function rookieAge() {
  const r = Math.random();
  if (r < 0.4) return 22;
  if (r < 0.75) return 23;
  if (r < 0.92) return 21;
  return 24;
}

// CONTRACTS
function calculateContractAAV(position, rating, age, year) {
  const cap = getSalaryCap(year);
  const posValue = POSITION_VALUE[position] || 1.0;
  let ovrFraction;
  if (rating >= 95) ovrFraction = 0.18;
  else if (rating >= 90) ovrFraction = 0.13;
  else if (rating >= 85) ovrFraction = 0.085;
  else if (rating >= 80) ovrFraction = 0.055;
  else if (rating >= 75) ovrFraction = 0.030;
  else if (rating >= 70) ovrFraction = 0.018;
  else if (rating >= 65) ovrFraction = 0.010;
  else if (rating >= 60) ovrFraction = 0.006;
  else ovrFraction = 0.0035;
  let aav = cap * ovrFraction * posValue;
  if (position === 'RB' && age >= 28) aav *= 0.5;
  else if (position === 'RB' && age >= 26) aav *= 0.75;
  else if (age >= 32) aav *= 0.65;
  else if (age >= 30) aav *= 0.85;
  else if (age <= 23) aav *= 0.92;
  aav = Math.max(800_000, aav);
  return Math.round(aav / 50_000) * 50_000;
}

function determineContractYears(rating, age) {
  if (age >= 32) return 1 + Math.floor(Math.random() * 2);
  if (age >= 29) return 2 + Math.floor(Math.random() * 2);
  if (rating >= 85 && age <= 27) return 3 + Math.floor(Math.random() * 3);
  if (rating >= 75) return 2 + Math.floor(Math.random() * 3);
  return 1 + Math.floor(Math.random() * 2);
}

function generateContract(position, rating, age, year, isRookie) {
  const years = isRookie ? 4 : determineContractYears(rating, age);
  const aav = calculateContractAAV(position, rating, age, year);
  const totalValue = aav * years;
  let bonusPct = 0;
  if (years >= 4) bonusPct = 0.35 + Math.random() * 0.15;
  else if (years >= 2) bonusPct = 0.20 + Math.random() * 0.15;
  else bonusPct = 0.05 + Math.random() * 0.10;
  if (isRookie) bonusPct = 0.25;
  const signingBonus = Math.round(totalValue * bonusPct / 100_000) * 100_000;
  const remaining = totalValue - signingBonus;
  const weights = [];
  for (let i = 0; i < years; i++) weights.push(1 + i * 0.08);
  const totalWeight = weights.reduce((s,w) => s+w, 0);
  const baseSalaries = weights.map(w => Math.round(remaining * w / totalWeight / 50_000) * 50_000);
  for (let i = 0; i < baseSalaries.length; i++) if (baseSalaries[i] < 800_000) baseSalaries[i] = 800_000;
  return {
    years, yearsRemaining: years, aav, totalValue, signingBonus,
    bonusProrationYears: Math.min(5, years),
    baseSalaries, signedYear: year, signedAtRating: rating
  };
}

function currentCapHit(contract) {
  if (!contract || contract.yearsRemaining <= 0) return 0;
  const currentBase = contract.baseSalaries[0] || 0;
  const yearIntoContract = contract.years - contract.yearsRemaining;
  const proratedThisYear = yearIntoContract < contract.bonusProrationYears
    ? contract.signingBonus / contract.bonusProrationYears : 0;
  return Math.round(currentBase + proratedThisYear);
}

function deadCapIfReleased(contract) {
  if (!contract) return 0;
  const yearIntoContract = contract.years - contract.yearsRemaining;
  const remainingProration = Math.max(0, contract.bonusProrationYears - yearIntoContract);
  return Math.round((contract.signingBonus / contract.bonusProrationYears) * remainingProration);
}

function teamCapUsed(team, players) {
  let used = 0;
  team.roster.forEach(id => {
    const p = players[id];
    if (p && !p.retired && p.contract) used += currentCapHit(p.contract);
  });
  used += (team.deadCap || 0);
  return used;
}

  generateName(year) {

  generateAllPlayers() {

          this.state.players.push(p);

      });
    });

  generatePlayer(position, teamId, overrideAge) {
    const age = overrideAge !== undefined ? overrideAge : realisticNFLAge();
    let rating = 50 + Math.floor(Math.random() * 40);
    if (age >= 26 && age <= 29) rating = Math.min(99, rating + 6);
    else if (age >= 32) rating = Math.max(45, rating - 5);
    else if (age <= 22) rating = Math.max(50, rating - 2);
    return {
      id: this.state.players.length,
      name: this.generateName(this.state.year),
      position, age, rating, team: teamId,
      jerseyNumber: this.assignJerseyNumber(position),
      yearsInLeague: Math.max(0, age - 22),

      seasonStats: EMPTY_SEASON_STATS(),
      retired: false, hofInducted: false, awards: [],
      faceSeed: Math.floor(Math.random() * 1000000),
      draftYear: this.state.year, contract: null
    };
  },

  assignJerseyNumber(position) {
    const r = { QB:[1,19], RB:[20,49], WR:[10,19], TE:[80,89], OL:[50,79], DL:[50,99], LB:[40,59], CB:[20,49], S:[20,49], K:[1,19], P:[1,19] };
    const [min, max] = r[position] || [1, 99];
    return min + Math.floor(Math.random() * (max - min + 1));
  },

  // DRAFT
  draftValue(player) {
    const posBonus = (POSITION_VALUE[player.position] || 1) * 15;
    const ageBonus = Math.max(0, 25 - player.age) * 0.8;
    return player.rating + posBonus + ageBonus;
  },

  startDraft() {
    this.state.draftPool = [];
    const totalNeeded = 32 * ROSTER_SIZE;
    const posDistribution = [];
    Object.entries(POSITION_COUNTS).forEach(([pos, count]) => {
      const proportional = Math.floor((count / ROSTER_SIZE) * totalNeeded);
      for (let i = 0; i < proportional; i++) posDistribution.push(pos);
    });
    while (posDistribution.length < totalNeeded) {
      posDistribution.push(POSITIONS_FOR_DRAFT[Math.floor(Math.random() * POSITIONS_FOR_DRAFT.length)]);
    }
    posDistribution.forEach(pos => {
      const p = this.generatePlayer(pos, null, rookieAge());
      p.yearsInLeague = 0;
      p.draftYear = this.state.year;
      this.state.draftPool.push(p);
      this.state.players.push(p);
    });
    this.state.draftPool.sort((a, b) => this.draftValue(b) - this.draftValue(a));
    const initialOrder = [...Array(32).keys()].sort(() => Math.random() - 0.5);
    this.state.draftOrder = [];
    for (let round = 1; round <= ROSTER_SIZE; round++) {
      const order = round % 2 === 1 ? initialOrder : [...initialOrder].reverse();
      order.forEach(teamId => this.state.draftOrder.push({ round, teamId }));
    }
    this.state.draftActive = true;
    this.state.draftCurrentIdx = 0;
    this.state.draftPicks = [];
    this.updateUserTag();
    this.advanceDraftUntilUser();
    this.renderDraft();
  },

  advanceDraftUntilUser() {
    const userId = this.state.userTeamId;
    while (this.state.draftCurrentIdx < this.state.draftOrder.length) {
      const current = this.state.draftOrder[this.state.draftCurrentIdx];
      if (current.teamId === userId) return;
      this.cpuPick(current.teamId);
      this.state.draftCurrentIdx++;
    }
    this.finishDraft();
  },

  cpuPick(teamId) {
    const team = this.state.teams[teamId];
    const need = this.calculateTeamNeeds(team);
    const candidates = this.state.draftPool.slice(0, 25);
    let best = null;
    let bestScore = -1;
    candidates.forEach(p => {
      const needBonus = (need[p.position] || 0) * 4;
      const score = this.draftValue(p) + needBonus + Math.random() * 3;
      if (score > bestScore) { bestScore = score; best = p; }
    });
    if (!best) best = this.state.draftPool[0];
    this.applyPick(teamId, best);
  },

  calculateTeamNeeds(team) {
    const need = {};
    const counts = {};
    team.roster.forEach(id => {
      const p = this.state.players[id];
      counts[p.position] = (counts[p.position] || 0) + 1;
    });
    Object.entries(POSITION_COUNTS).forEach(([pos, target]) => {
      const have = counts[pos] || 0;
      need[pos] = Math.max(0, target - have);
    });
    return need;
  },

  applyPick(teamId, player) {
    player.team = teamId;
    player.contract = generateContract(player.position, player.rating, player.age, this.state.year, true);
    this.state.teams[teamId].roster.push(player.id);
    const idx = this.state.draftPool.indexOf(player);
    if (idx !== -1) this.state.draftPool.splice(idx, 1);
    const orderInfo = this.state.draftOrder[this.state.draftCurrentIdx];
    this.state.draftPicks.push({
      overall: this.state.draftCurrentIdx + 1,
      round: orderInfo.round,
      teamId, playerId: player.id
    });
  },

  userPick(playerId) {
    const player = this.state.players[playerId];
    if (!player || player.team !== null) return;
    const current = this.state.draftOrder[this.state.draftCurrentIdx];
    if (current.teamId !== this.state.userTeamId) return;
    this.applyPick(this.state.userTeamId, player);
    this.state.draftCurrentIdx++;
    this.advanceDraftUntilUser();
    this.saveGame();
    this.renderDraft();
  },

  autoCompleteDraft() {
    if (!confirm('Auto-complete the rest of the draft for you?')) return;
    while (this.state.draftCurrentIdx < this.state.draftOrder.length) {
      const current = this.state.draftOrder[this.state.draftCurrentIdx];
      this.cpuPick(current.teamId);
      this.state.draftCurrentIdx++;

    this.finishDraft();

    sidebarHtml += '</div>';

    if (userTeam) {
      const counts = {};
      userRoster.forEach(p => { counts[p.position] = (counts[p.position] || 0) + 1; });
      sidebarHtml += '<div style="margin-bottom:20px"><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">' + userTeam.abbr + ' roster · ' + userRoster.length + '/' + ROSTER_SIZE + '</div>' +
        '<div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;line-height:1.6">' +
        POSITIONS_FOR_DRAFT.map(pos => '<span style="display:inline-block;margin-right:8px">' + pos + ': <strong style="color:var(--text)">' + (counts[pos] || 0) + '</strong>/' + POSITION_COUNTS[pos] + '</span>').join('') + '</div>';
      userRoster.sort((a, b) => b.rating - a.rating).slice(0, 12).forEach(p => {
        const rc = this.ratingClass(p.rating);
        sidebarHtml += '<div class="draft-roster-mini">' +
          '<span class="position-tag">' + p.position + '</span>' +
          '<span style="font-size:11px">' + p.name + '</span>' +
          '<span class="rating ' + rc + '" style="font-size:10px;padding:1px 5px;min-width:24px">' + p.rating + '</span></div>';
      });
      if (userRoster.length > 12) sidebarHtml += '<div style="font-size:10px;color:var(--text-muted);margin-top:6px">+ ' + (userRoster.length - 12) + ' more</div>';
      sidebarHtml += '</div>';
    }

    document.getElementById('content').innerHTML = '<div class="draft-container"><div class="draft-main">' + html + '</div><div class="draft-sidebar">' + sidebarHtml + '</div></div>';
  },

  setDraftFilter(pos) { this.draftFilter = pos; this.renderDraft(); },

  // SIM
  generateSchedule() {
    this.state.schedule = [];
    for (let week = 1; week <= 16; week++) {
      const shuffled = [...this.state.teams].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffled.length; i += 2) {
        if (shuffled[i+1]) this.state.schedule.push({
          week, homeTeam: shuffled[i].id, awayTeam: shuffled[i+1].id,
          played: false, homeScore: 0, awayScore: 0, playerStats: {}
        });
      }
    }
  },

  getCurrentEra() {
    return ERAS.find(e => this.state.year >= e.start && this.state.year <= e.end) || ERAS[ERAS.length - 1];
  },

  simWeek() {
    if (!this.state || this.state.draftActive) return;
    if (this.state.week >= 16) { this.endSeason(); return; }
    this.state.week++;
    const era = this.getCurrentEra();
    const weekGames = this.state.schedule.filter(g => g.week === this.state.week && !g.played);
    weekGames.forEach(g => this.simGame(g, era));
    this.generateWeeklyHeadlines();
    if (Math.random() < 0.08) this.generateScandal();
    this.state.lastWeekRecap = this.buildWeekRecap(weekGames);
    document.getElementById('newsFeed').style.display = '';
    document.getElementById('mainGrid').style.gridTemplateColumns = '200px 1fr 320px';
    this.saveGame();
    this.currentView = 'recap';
    this.render();
  },

  simGame(g, era) {
    const home = this.state.teams[g.homeTeam];
    const away = this.state.teams[g.awayTeam];
    const hs = this.getTeamStrength(home);
    const as = this.getTeamStrength(away);
    const homeWinProb = (hs / (hs + as)) + 0.05;
    const homeWins = Math.random() < homeWinProb;
    const base = 14 + Math.floor(era.gameRate * 8);
    const hScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? 7 : -7));
    const aScore = Math.max(3, base + Math.floor(Math.random() * 20) + (homeWins ? -7 : 7));
    g.homeScore = homeWins ? Math.max(hScore, aScore + 1) : hScore;
    g.awayScore = !homeWins ? Math.max(aScore, hScore + 1) : aScore;
    g.played = true;
    g.playerStats = {};
    if (g.homeScore > g.awayScore) { home.wins++; away.losses++; home.coachWins++; away.coachLosses++; }
    else { away.wins++; home.losses++; away.coachWins++; home.coachLosses++; }
    home.pointsFor += g.homeScore; home.pointsAgainst += g.awayScore;
    away.pointsFor += g.awayScore; away.pointsAgainst += g.homeScore;
    this.generateGameStats(g, home, away, era);
  },

  getTeamStrength(team) {
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    if (!roster.length) return 50;
    const sorted = [...roster].sort((a, b) => b.rating - a.rating).slice(0, 22);
    return sorted.reduce((s, p) => s + p.rating, 0) / sorted.length;
  },

  generateGameStats(gameObj, home, away, era) {
    [{ team: home, score: gameObj.homeScore }, { team: away, score: gameObj.awayScore }].forEach(({ team, score }) => {
      const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
      const ensureStats = (pid) => {
        if (!gameObj.playerStats[pid]) gameObj.playerStats[pid] = EMPTY_GAME_STATS();
        return gameObj.playerStats[pid];
      };
      const markPlayed = (p) => { p.seasonStats.gamesPlayed = (p.seasonStats.gamesPlayed || 0) + 1; };

      const qbs = roster.filter(p => p.position === 'QB').sort((a, b) => b.rating - a.rating);
      if (qbs[0]) {
        const qb = qbs[0];
        const yds = Math.floor((150 + Math.random() * 220) * era.gameRate * (qb.rating / 75));
        const att = Math.floor(20 + Math.random() * 18);
        const comp = Math.floor(att * (0.55 + Math.random() * 0.2));
        const tds = Math.floor(Math.random() * 4 * era.passEmph * 1.5);
        const ints = Math.random() < 0.4 ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(qb.id);
        gs.passingYards += yds; gs.passingTDs += tds; gs.attempts += att; gs.completions += comp; gs.interceptionsThrown += ints; gs.touchdowns += tds;
        qb.seasonStats.passingYards += yds; qb.seasonStats.passingTDs += tds;
        qb.seasonStats.attempts += att; qb.seasonStats.completions += comp;
        qb.seasonStats.interceptionsThrown += ints; qb.seasonStats.touchdowns += tds;
        markPlayed(qb);
      }

      const rbs = roster.filter(p => p.position === 'RB').sort((a, b) => b.rating - a.rating);
      rbs.slice(0, 2).forEach((rb, i) => {
        const share = i === 0 ? 0.7 : 0.3;
        const yds = Math.floor((50 + Math.random() * 100) * (2 - era.passEmph) * (rb.rating / 75) * share);
        const car = Math.floor((10 + Math.random() * 15) * share * 2);
        const tds = Math.random() < (i === 0 ? 0.5 : 0.2) ? Math.floor(Math.random() * 2) + (Math.random() < 0.3 ? 1 : 0) : 0;
        const gs = ensureStats(rb.id);
        gs.rushingYards += yds; gs.carries += car; gs.rushingTDs += tds; gs.touchdowns += tds;
        rb.seasonStats.rushingYards += yds; rb.seasonStats.carries += car;
        rb.seasonStats.rushingTDs += tds; rb.seasonStats.touchdowns += tds;
        markPlayed(rb);
      });

      const wrs = roster.filter(p => p.position === 'WR').sort((a, b) => b.rating - a.rating);
      wrs.slice(0, 3).forEach((wr, i) => {
        const share = [0.45, 0.30, 0.20][i] || 0.1;
        const yds = Math.floor((50 + Math.random() * 90) * era.gameRate * (wr.rating / 75) * share * 2);
        const rec = Math.floor((2 + Math.random() * 6) * share * 2);
        const tds = Math.random() < 0.4 * era.passEmph ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(wr.id);
        gs.receivingYards += yds; gs.receptions += rec; gs.receivingTDs += tds; gs.touchdowns += tds;
        wr.seasonStats.receivingYards += yds; wr.seasonStats.receptions += rec;
        wr.seasonStats.receivingTDs += tds; wr.seasonStats.touchdowns += tds;
        markPlayed(wr);
      });

      const tes = roster.filter(p => p.position === 'TE').sort((a, b) => b.rating - a.rating);
      if (tes[0]) {
        const te = tes[0];
        const yds = Math.floor((20 + Math.random() * 60) * (te.rating / 75));
        const rec = Math.floor(1 + Math.random() * 5);
        const tds = Math.random() < 0.25 ? 1 : 0;
        const gs = ensureStats(te.id);
        gs.receivingYards += yds; gs.receptions += rec; gs.receivingTDs += tds; gs.touchdowns += tds;
        te.seasonStats.receivingYards += yds; te.seasonStats.receptions += rec;
        te.seasonStats.receivingTDs += tds; te.seasonStats.touchdowns += tds;
        markPlayed(te);
      }

      const dls = roster.filter(p => p.position === 'DL').sort((a, b) => b.rating - a.rating);
      dls.slice(0, 4).forEach(dl => {
        const sacks = Math.random() < (dl.rating / 100) ? Math.floor(Math.random() * 2) + (Math.random() < 0.2 ? 1 : 0) : 0;
        const tackles = Math.floor(2 + Math.random() * 6);
        const gs = ensureStats(dl.id);
        gs.sacks += sacks; gs.tackles += tackles;
        dl.seasonStats.sacks += sacks; dl.seasonStats.tackles += tackles;
        markPlayed(dl);
      });

      const lbs = roster.filter(p => p.position === 'LB').sort((a, b) => b.rating - a.rating);
      lbs.slice(0, 3).forEach(lb => {
        const tackles = Math.floor(3 + Math.random() * 8);
        const sacks = Math.random() < 0.25 ? Math.floor(Math.random() * 2) : 0;
        const gs = ensureStats(lb.id);
        gs.tackles += tackles; gs.sacks += sacks;
        lb.seasonStats.tackles += tackles; lb.seasonStats.sacks += sacks;
        markPlayed(lb);
      });

      const dbs = roster.filter(p => p.position === 'CB' || p.position === 'S').sort((a, b) => b.rating - a.rating);
      dbs.slice(0, 4).forEach(db => {
        const tackles = Math.floor(1 + Math.random() * 6);
        const ints = Math.random() < (db.rating / 250) ? 1 : 0;
        const gs = ensureStats(db.id);
        gs.tackles += tackles; gs.interceptionsMade += ints;
        db.seasonStats.tackles += tackles; db.seasonStats.interceptionsMade += ints;
        markPlayed(db);
      });

      const kickers = roster.filter(p => p.position === 'K').sort((a, b) => b.rating - a.rating);
      if (kickers[0]) {
        const k = kickers[0];
        const fgAtt = Math.floor(1 + Math.random() * 4);
        const fgMade = Math.floor(fgAtt * (0.6 + (k.rating / 200)));
        const xp = Math.max(0, Math.floor(score / 7) - Math.floor(Math.random() * 2));
        const gs = ensureStats(k.id);
        gs.fieldGoalsMade += fgMade; gs.fieldGoalsAttempted += fgAtt; gs.extraPoints += xp;
        k.seasonStats.fieldGoalsMade += fgMade; k.seasonStats.fieldGoalsAttempted += fgAtt;
        k.seasonStats.extraPoints += xp;
        markPlayed(k);
      }

      // Punter
      const punters = roster.filter(p => p.position === 'P').sort((a, b) => b.rating - a.rating);
      if (punters[0]) {
        const pu = punters[0];
        const punts = 3 + Math.floor(Math.random() * 5);
        const avgYards = 38 + Math.floor((pu.rating / 100) * 14) + Math.floor(Math.random() * 6);
        const totalYards = punts * avgYards;
        const inside20 = Math.floor(punts * (0.25 + (pu.rating / 400)));
        const gs = ensureStats(pu.id);
        gs.punts += punts; gs.puntYards += totalYards; gs.puntsInside20 += inside20;
        pu.seasonStats.punts += punts; pu.seasonStats.puntYards += totalYards;
        pu.seasonStats.puntsInside20 += inside20;
        markPlayed(pu);
      }
    });
  },

  buildWeekRecap(weekGames) {
    const offensiveScores = [], defensiveScores = [], specialScores = [];
    weekGames.forEach(g => {
      Object.entries(g.playerStats).forEach(([pid, stats]) => {
        const player = this.state.players[pid];
        if (!player) return;
        const offScore = stats.passingYards * 0.04 + stats.passingTDs * 6 +
                         stats.rushingYards * 0.1 + stats.rushingTDs * 6 +
                         stats.receivingYards * 0.1 + stats.receivingTDs * 6;
        const defScore = stats.sacks * 5 + stats.interceptionsMade * 8 + stats.tackles * 0.5;
        const punterAvg = stats.punts > 0 ? stats.puntYards / stats.punts : 0;
        const spcScore = stats.fieldGoalsMade * 4 + stats.extraPoints * 1 +
                         (stats.punts > 0 ? Math.max(0, (punterAvg - 40) * 2) + stats.puntsInside20 * 3 : 0);
        if (offScore > 5) offensiveScores.push({ player, stats, score: offScore });
        if (defScore > 3) defensiveScores.push({ player, stats, score: defScore });
        if (spcScore > 2) specialScores.push({ player, stats, score: spcScore });
      });
    });
    offensiveScores.sort((a, b) => b.score - a.score);
    defensiveScores.sort((a, b) => b.score - a.score);
    specialScores.sort((a, b) => b.score - a.score);
    return {
      week: this.state.week,
      games: weekGames.map(g => ({ ...g })),
      offensiveStandout: offensiveScores[0] || null,
      defensiveStandout: defensiveScores[0] || null,
      specialStandout: specialScores[0] || null
    };
  },

  generateWeeklyHeadlines() {
    const games = this.state.schedule.filter(g => g.week === this.state.week && g.played);
    let biggest = null, closest = null;
    let bm = 0, cm = 999;
    games.forEach(g => {
      const m = Math.abs(g.homeScore - g.awayScore);
      if (m > bm) { bm = m; biggest = g; }
      if (m < cm) { cm = m; closest = g; }
    });
    if (biggest && bm >= 21) {
      const w = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.homeTeam] : this.state.teams[biggest.awayTeam];
      const l = biggest.homeScore > biggest.awayScore ? this.state.teams[biggest.awayTeam] : this.state.teams[biggest.homeTeam];
      this.addHeadline({ title: w.city + ' ' + w.name + ' rout ' + l.city + ' ' + l.name, body: w.city + ' dominated ' + l.city + ' ' + Math.max(biggest.homeScore, biggest.awayScore) + '–' + Math.min(biggest.homeScore, biggest.awayScore) + '.' });
    }
  },

  generateScandal() {
    const t = SCANDAL_TEMPLATES[Math.floor(Math.random() * SCANDAL_TEMPLATES.length)];
    const team = this.state.teams[Math.floor(Math.random() * this.state.teams.length)];
    const tf = team.city + ' ' + team.name;
    this.addHeadline({
      type: 'scandal',
      title: t.title.replace('{team}', tf).replace('{coach}', team.coachName),
      body: t.body.replace('{team}', tf)
    });
  },

  // AWARDS
  awardScores() {
    const players = this.state.players.filter(p => !p.retired && p.seasonStats.gamesPlayed > 0);
    const mvp = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (p.position === 'QB') {
        score = s.passingYards * 0.06 + s.passingTDs * 10 - s.interceptionsThrown * 8 + s.rushingYards * 0.08 + s.rushingTDs * 6;
        score *= 1.4;
      } else if (p.position === 'RB') {
        score = s.rushingYards * 0.12 + s.rushingTDs * 8 + s.receivingYards * 0.08 + s.receivingTDs * 6;
      } else if (p.position === 'WR' || p.position === 'TE') {
        score = s.receivingYards * 0.10 + s.receivingTDs * 8;
      }
      const team = this.state.teams[p.team];
      const winPct = team.wins / Math.max(1, team.wins + team.losses);
      score *= (0.7 + winPct * 0.6);
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const opoy = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (['QB','RB','WR','TE'].includes(p.position)) {
        score = s.passingYards * 0.04 + s.passingTDs * 8 + s.rushingYards * 0.1 + s.rushingTDs * 7 + s.receivingYards * 0.1 + s.receivingTDs * 7;
      }
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const dpoy = players.map(p => {
      const s = p.seasonStats;
      let score = 0;
      if (['DL','LB','CB','S'].includes(p.position)) {
        score = s.sacks * 6 + s.interceptionsMade * 8 + s.tackles * 0.8;
        if (p.position === 'DL') score *= 1.1;
      }
      return { player: p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const oroy = players.filter(p => p.draftYear === this.state.year && ['QB','RB','WR','TE'].includes(p.position))
      .map(p => {
        const s = p.seasonStats;
        const score = s.passingYards * 0.04 + s.passingTDs * 8 + s.rushingYards * 0.1 + s.rushingTDs * 7 + s.receivingYards * 0.1 + s.receivingTDs * 7;
        return { player: p, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const droy = players.filter(p => p.draftYear === this.state.year && ['DL','LB','CB','S'].includes(p.position))
      .map(p => {
        const s = p.seasonStats;
        const score = s.sacks * 6 + s.interceptionsMade * 8 + s.tackles * 0.8;
        return { player: p, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    const coy = this.state.teams.map(t => {
      const prevWP = t.historicalStats.seasons > 0 ? t.historicalStats.wins / Math.max(1, t.historicalStats.wins + t.historicalStats.losses) : 0.5;
      const curWP = t.wins / Math.max(1, t.wins + t.losses);
      const improvement = curWP - prevWP;
      const score = t.wins * 10 + improvement * 80;
      return { team: t, score };
    }).sort((a, b) => b.score - a.score);

    return { mvp, opoy, dpoy, oroy, droy, coy };
  },

  // CONTRACT ACTIONS
  restructureContract(playerId, mode) {
    const p = this.state.players[playerId];
    if (!p || !p.contract) return;
    const c = p.contract;
    if (c.yearsRemaining < 2) { alert('Contract has only one year remaining.'); return; }
    if (mode === 'restructure') {
      const currentBase = c.baseSalaries[0];
      const convertible = currentBase - 800_000;
      if (convertible <= 0) { alert('No salary available to convert.'); return; }
      const converting = Math.round(convertible * 0.75 / 50_000) * 50_000;
      c.baseSalaries[0] -= converting;
      c.signingBonus += converting;
      c.bonusProrationYears = Math.min(5, c.yearsRemaining);
      this.addHeadline({ type:'contract', title: p.name + ' restructures contract', body: this.state.teams[p.team].abbr + ' converts ' + formatMoney(converting) + ' to bonus, lowering current cap hit.' });
    } else if (mode === 'frontload') {
      const lastIdx = c.yearsRemaining - 1;
      if (lastIdx === 0) return;
      const moveAmount = Math.round(c.baseSalaries[lastIdx] * 0.25 / 50_000) * 50_000;
      if (c.baseSalaries[lastIdx] - moveAmount < 800_000) { alert('Cannot frontload further.'); return; }
      c.baseSalaries[lastIdx] -= moveAmount;
      c.baseSalaries[0] += moveAmount;
      this.addHeadline({ type:'contract', title: p.name + '\'s contract frontloaded', body: this.state.teams[p.team].abbr + ' shifts ' + formatMoney(moveAmount) + ' into year one.' });
    } else if (mode === 'backload') {
      const moveAmount = Math.round(c.baseSalaries[0] * 0.25 / 50_000) * 50_000;
      if (c.baseSalaries[0] - moveAmount < 800_000) { alert('Cannot backload further.'); return; }
      c.baseSalaries[0] -= moveAmount;
      c.baseSalaries[c.yearsRemaining - 1] += moveAmount;
      this.addHeadline({ type:'contract', title: p.name + '\'s contract backloaded', body: this.state.teams[p.team].abbr + ' shifts ' + formatMoney(moveAmount) + ' to final year.' });
    }
    this.saveGame();
    closeModal();
    this.showPlayer(playerId);
  },

  releasePlayer(playerId) {
    const p = this.state.players[playerId];
    if (!p || p.team === null) return;
    const team = this.state.teams[p.team];
    const dead = deadCapIfReleased(p.contract);
    if (!confirm('Release ' + p.name + '? Dead cap hit: ' + formatMoney(dead) + '.')) return;
    team.deadCap = (team.deadCap || 0) + dead;
    team.roster = team.roster.filter(id => id !== playerId);
    p.team = null;
    p.contract = null;
    this.addHeadline({ type:'contract', title: team.city + ' ' + team.name + ' release ' + p.name, body: p.position + ' ' + p.name + ' is now a free agent. Dead cap: ' + formatMoney(dead) + '.' });
    this.saveGame();
    closeModal();
    this.render();
  },

  extendContract(playerId) {
    const p = this.state.players[playerId];
    if (!p || !p.contract) return;
    const newContract = generateContract(p.position, p.rating, p.age, this.state.year, false);
    if (!confirm('Extend ' + p.name + ' for ' + newContract.years + ' years, ' + formatMoney(newContract.totalValue) + ' (' + formatMoney(newContract.aav) + '/yr, ' + formatMoney(newContract.signingBonus) + ' bonus)?')) return;
    p.contract = newContract;
    this.addHeadline({ type:'contract', title: p.name + ' signs extension', body: this.state.teams[p.team].abbr + ' extends ' + p.position + ' ' + p.name + ' for ' + newContract.years + ' years, ' + formatMoney(newContract.totalValue) + '.' });
    this.saveGame();
    closeModal();
    this.showPlayer(playerId);
  },

  toggleAGM() {
    this.state.useAssistantGM = !this.state.useAssistantGM;
    this.saveGame();
    this.render();
  },

  // AGM logic
  runAssistantGM(team) {
    const players = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const cap = getSalaryCap(this.state.year);
    const byValue = [...players].sort((a, b) => (b.rating * (POSITION_VALUE[b.position] || 1)) - (a.rating * (POSITION_VALUE[a.position] || 1)));
    // Extend stars with 1 year left
    byValue.slice(0, 5).forEach(p => {
      if (p.contract && p.contract.yearsRemaining === 1 && p.rating >= 75 && p.age <= 30) {
        p.contract = generateContract(p.position, p.rating, p.age, this.state.year, false);
      }
    });
    // Restructure top contracts if over cap
    if (teamCapUsed(team, this.state.players) > cap) {
      const restructureCandidates = byValue.filter(p => p.contract && p.contract.yearsRemaining >= 2 && currentCapHit(p.contract) > cap * 0.05);
      for (const p of restructureCandidates) {
        if (teamCapUsed(team, this.state.players) <= cap) break;
        const convertible = p.contract.baseSalaries[0] - 800_000;
        if (convertible > 500_000) {
          const converting = Math.round(convertible * 0.75 / 50_000) * 50_000;
          p.contract.baseSalaries[0] -= converting;
          p.contract.signingBonus += converting;
          p.contract.bonusProrationYears = Math.min(5, p.contract.yearsRemaining);
        }
      }
    }
    // Release worst if still over
    if (teamCapUsed(team, this.state.players) > cap) {
      const releaseCandidates = [...players].sort((a, b) => a.rating - b.rating);
      for (const p of releaseCandidates) {
        if (teamCapUsed(team, this.state.players) <= cap) break;
        if (!p.contract) continue;
        const savings = currentCapHit(p.contract) - deadCapIfReleased(p.contract);
        if (savings > 0) {
          team.deadCap = (team.deadCap || 0) + deadCapIfReleased(p.contract);
          team.roster = team.roster.filter(id => id !== p.id);
          p.team = null;
          p.contract = null;
        }
      }
    }
  },

  // END SEASON
  endSeason() {
    const sorted = [...this.state.teams].sort((a, b) => {
      const aWP = a.wins / Math.max(1, a.wins + a.losses);
      const bWP = b.wins / Math.max(1, b.wins + b.losses);
      if (bWP !== aWP) return bWP - aWP;
      return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
    });
    const champion = sorted[0];
    const runnerUp = sorted[1];
    champion.championships++;
    this.state.champions.push({
      year: this.state.year, team: champion.city + ' ' + champion.name,
      teamId: champion.id, record: champion.wins + '-' + champion.losses,
      runnerUp: runnerUp.city + ' ' + runnerUp.name
    });
    const aw = this.awardScores();
    const awardRecord = { year: this.state.year };
    const award = (key, list, type) => {
      if (list[0]) {
        if (list[0].player) {
          list[0].player.awards.push({ year: this.state.year, type });
          awardRecord[key] = { playerId: list[0].player.id, name: list[0].player.name };
        } else if (list[0].team) {
          awardRecord[key] = { teamId: list[0].team.id, name: list[0].team.coachName };
        }
      }
    };
    award('mvp', aw.mvp, 'MVP');
    award('opoy', aw.opoy, 'OPOY');
    award('dpoy', aw.dpoy, 'DPOY');
    award('oroy', aw.oroy, 'OROY');
    award('droy', aw.droy, 'DROY');
    if (aw.coy[0]) {
      aw.coy[0].team.coachOfYears++;
      awardRecord.coy = { teamId: aw.coy[0].team.id, name: aw.coy[0].team.coachName };
    }
    this.state.awardsHistory.unshift(awardRecord);
    this.addHeadline({ type:'champ', title: champion.city + ' ' + champion.name + ' win the ' + this.state.year + ' championship', body: champion.city + ' defeated ' + runnerUp.city + ' to claim the title.' });
    if (awardRecord.mvp) this.addHeadline({ title: awardRecord.mvp.name + ' named ' + this.state.year + ' MVP', body: 'Top individual honor.' });

    const topPlayers = this.state.players.filter(p => !p.retired);
    topPlayers.forEach(p => {
      if (p.seasonStats.passingYards > this.state.records.seasonPassingYards.value) {
        this.state.records.seasonPassingYards = { value: p.seasonStats.passingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.rushingYards > this.state.records.seasonRushingYards.value) {
        this.state.records.seasonRushingYards = { value: p.seasonStats.rushingYards, player: p.name, year: this.state.year };
      }
      if (p.seasonStats.receivingYards > this.state.records.seasonReceivingYards.value) {
        this.state.records.seasonReceivingYards = { value: p.seasonStats.receivingYards, player: p.name, year: this.state.year };
      }
    });

    this.state.teams.forEach(t => {
      t.historicalStats.wins += t.wins;
      t.historicalStats.losses += t.losses;
      t.historicalStats.pointsFor += t.pointsFor;
      t.historicalStats.pointsAgainst += t.pointsAgainst;
      t.historicalStats.seasons++;
      if (t.id === champion.id) t.historicalStats.championships++;
      if (t.wins >= 10) t.historicalStats.playoffApps++;
    });

    // Age, retire, advance contracts
    this.state.players.forEach(p => {
      if (p.retired) return;
      p.careerStats.passingYards += p.seasonStats.passingYards;
      p.careerStats.passingTDs += p.seasonStats.passingTDs;
      p.careerStats.rushingYards += p.seasonStats.rushingYards;
      p.careerStats.rushingTDs += p.seasonStats.rushingTDs;
      p.careerStats.receivingYards += p.seasonStats.receivingYards;
      p.careerStats.receivingTDs += p.seasonStats.receivingTDs;
      p.careerStats.sacks += p.seasonStats.sacks;
      p.careerStats.interceptionsMade += p.seasonStats.interceptionsMade;
      p.careerStats.tackles += p.seasonStats.tackles;
      p.careerStats.fieldGoalsMade += p.seasonStats.fieldGoalsMade;
      p.careerStats.punts += p.seasonStats.punts;
      p.careerStats.puntYards += p.seasonStats.puntYards;
      p.careerStats.touchdowns += p.seasonStats.touchdowns;
      p.careerStats.gamesPlayed += p.seasonStats.gamesPlayed || 16;
      p.careerStats.seasonsPlayed++;
      p.age++;
      p.yearsInLeague++;
      if (p.age >= 30) p.rating = Math.max(40, p.rating - Math.floor(Math.random() * 4));
      else if (p.age <= 25) p.rating = Math.min(99, p.rating + Math.floor(Math.random() * 3));
      // Advance contract
      if (p.contract) {
        p.contract.yearsRemaining--;
        p.contract.baseSalaries.shift();
        if (p.contract.yearsRemaining <= 0) {
          if (p.team !== null) {
            this.state.teams[p.team].roster = this.state.teams[p.team].roster.filter(id => id !== p.id);
            p.team = null;
          }
          p.contract = null;
        }
      }
      // Retirement
      if (p.age >= 35 || (p.age >= 32 && Math.random() < 0.3) || p.rating < 55) {
        p.retired = true;
        p.retiredYear = this.state.year;
        if (p.team !== null) {
          this.state.teams[p.team].roster = this.state.teams[p.team].roster.filter(id => id !== p.id);
          p.team = null;
        }
        p.contract = null;
        const isHOF = p.yearsInLeague >= 8 && (p.careerStats.passingYards > 25000 || p.careerStats.rushingYards > 8000 || p.careerStats.receivingYards > 8000 || p.careerStats.touchdowns > 100 || p.awards.length >= 2);
        if (isHOF) {
          p.hofInducted = true;
          this.state.hallOfFame.push({
            playerId: p.id, name: p.name, position: p.position,
            inductedYear: this.state.year + 5,
            careerStats: { ...p.careerStats },
            yearsInLeague: p.yearsInLeague, awards: [...p.awards]
          });
          this.addHeadline({ type:'hof', title: p.name + ' retires after ' + p.yearsInLeague + ' seasons', body: 'Legendary ' + p.position + '. ' + this.formatCareerStats(p) + '.' });
        }
      }
      p.seasonStats = EMPTY_SEASON_STATS();
    });

    this.state.teams.forEach(team => {
      if (team.wins >= 10) team.playoffAppearances++;
      team.wins = 0; team.losses = 0; team.pointsFor = 0; team.pointsAgainst = 0;
      team.deadCap = Math.floor((team.deadCap || 0) * 0.3);
      if (Math.random() < 0.1) {
        team.coachName = this.generateName(this.state.year);
        team.coachId = 'coach_' + team.id + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        team.coachWins = 0; team.coachLosses = 0;
      }
    });

    this.state.year++;
    this.state.week = 0;
    this.state.lastWeekRecap = null;

    // Free agency: refill rosters
    this.runFreeAgency();
    // Run AGM for each team (skip user if toggle off)
    this.state.teams.forEach(team => {
      const isUser = team.id === this.state.userTeamId;
      if (!isUser || this.state.useAssistantGM) this.runAssistantGM(team);
    });

    const newEra = this.getCurrentEra();
    if (newEra.start === this.state.year) {
      this.addHeadline({ title: 'New era begins: ' + newEra.name, body: 'The ' + newEra.name + ' arrives.' });
    }
    this.generateSchedule();
    this.addHeadline({ title: this.state.year + ' season opens', body: 'Salary cap rises to ' + formatMoney(getSalaryCap(this.state.year)) + '.' });
    this.currentView = this.state.userTeamId !== null ? 'myteam' : 'standings';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('[data-view="' + this.currentView + '"]').classList.add('active');
    this.saveGame();
    this.render();
  },

  runFreeAgency() {
    this.state.teams.forEach(team => {
      const byPos = {};
      team.roster.forEach(id => {
        const p = this.state.players[id];
        byPos[p.position] = (byPos[p.position] || 0) + 1;
      });
      Object.entries(POSITION_COUNTS).forEach(([pos, needed]) => {
        const cur = byPos[pos] || 0;
        const gaps = needed - cur;
        for (let i = 0; i < gaps; i++) {
          const fas = this.state.players.filter(p => p.team === null && !p.retired && p.position === pos);
          if (fas.length > 0 && Math.random() < 0.5) {
            fas.sort((a, b) => b.rating - a.rating);
            const fa = fas[0];
            fa.team = team.id;
            fa.contract = generateContract(fa.position, fa.rating, fa.age, this.state.year, false);
            team.roster.push(fa.id);
          } else {
            const rp = this.generatePlayer(pos, team.id, rookieAge());
            rp.yearsInLeague = 0;
            rp.draftYear = this.state.year;
            rp.contract = generateContract(pos, rp.rating, rp.age, this.state.year, true);
            this.state.players.push(rp);
            team.roster.push(rp.id);
          }
        }
      });
    });
    // Cleanup old FAs
    this.state.players.forEach(p => {
      if (p.team === null && !p.retired && (p.age >= 34 || p.rating < 60)) {
        p.retired = true;
        p.retiredYear = this.state.year;
      }
    });
  },

  formatCareerStats(p) {
    const s = [];
    if (p.careerStats.passingYards > 0) s.push(p.careerStats.passingYards.toLocaleString() + ' pass yds');
    if (p.careerStats.rushingYards > 0) s.push(p.careerStats.rushingYards.toLocaleString() + ' rush yds');
    if (p.careerStats.receivingYards > 0) s.push(p.careerStats.receivingYards.toLocaleString() + ' rec yds');
    if (p.careerStats.touchdowns > 0) s.push(p.careerStats.touchdowns + ' TDs');
    return s.join(', ');
  },

  addHeadline(h) {
    this.state.headlines.unshift({ ...h, year: this.state.year, week: this.state.week });
    if (this.state.headlines.length > 200) this.state.headlines.pop();
  },

  ratingClass(r) {
    if (r >= 90) return 'rating-elite';
    if (r >= 80) return 'rating-great';
    if (r >= 70) return 'rating-good';
    if (r >= 60) return 'rating-avg';
    return 'rating-poor';
  },

  salaryClass(hit, cap) {
    const pct = hit / cap;
    if (pct > 0.10) return 'elite';
    if (pct > 0.05) return 'high';
    return '';
  },

  // RENDER ROUTER
  render() {
    if (!this.state) return;
    document.getElementById('currentYear').textContent = this.state.year;
    document.getElementById('currentWeek').textContent = this.state.week + '/16';
    document.getElementById('eraBadge').textContent = this.getCurrentEra().name;
    document.getElementById('simBtn').textContent = this.state.week >= 16 ? 'End Season →' : 'Simulate Week →';
    this.renderNews();
    switch (this.currentView) {
      case 'recap': this.renderRecap(); break;
      case 'standings': this.renderStandings(); break;
      case 'schedule': this.renderSchedule(); break;
      case 'teams': this.renderTeams(); break;
      case 'players': this.renderPlayers(); break;
      case 'statistics': this.renderStatistics(); break;
      case 'awards': this.renderAwards(); break;
      case 'myteam': this.renderMyTeam(); break;
      case 'capspace': this.renderCapSpace(); break;
      case 'hof': this.renderHOF(); break;
      case 'records': this.renderRecords(); break;
      case 'champions': this.renderChampions(); break;
      case 'about': this.renderAbout(); break;
      default: this.renderStandings();
    }
  },

    let html = '<div class="page-header">' +
      '<div class="page-title">' + team.city + ' ' + team.name + '</div>' +
      '<div class="page-subtitle">' + team.conference + ' ' + team.division + ' · Your franchise · ' + this.state.year + ' season</div>' +
      '</div>' +
      '<div class="my-team-hero">' +
      '<div class="my-team-hero-left">' +
      '<div class="my-team-color" style="background:' + team.primary + '"></div>' +
      '<div><div class="my-team-name">' + team.city + ' ' + team.name + '</div>' +
      '<div class="my-team-meta">' + team.conference + ' ' + team.division + '</div></div></div>' +
      '<div class="my-team-stats">' +
      '<div class="my-team-stat"><div class="my-team-stat-label">Record</div><div class="my-team-stat-value">' + team.wins + '–' + team.losses + '</div></div>' +
      '<div class="my-team-stat"><div class="my-team-stat-label">PCT</div><div class="my-team-stat-value">' + pct + '</div></div>' +
      '<div class="my-team-stat"><div class="my-team-stat-label">PF</div><div class="my-team-stat-value">' + team.pointsFor + '</div></div>' +
      '<div class="my-team-stat"><div class="my-team-stat-label">PA</div><div class="my-team-stat-value">' + team.pointsAgainst + '</div></div>' +
      '<div class="my-team-stat"><div class="my-team-stat-label">Titles</div><div class="my-team-stat-value">' + team.championships + '</div></div>' +
      '</div></div>' +
      '<div class="card"><div class="card-header">' +
      '<div class="card-title">Salary cap · ' + this.state.year + '</div>' +
      '<div class="card-meta">' + formatMoney(capUsed) + ' of ' + formatMoney(cap) + ' · ' + formatMoney(capSpace) + ' space</div>' +
      '</div><div style="padding:16px">' +
      '<div class="cap-bar-container"><div class="cap-bar-fill ' + capClass + '" style="width:' + Math.min(100, capPct) + '%"></div>' +
      '<div class="cap-bar-label">' + capPct.toFixed(1) + '% used</div></div>' +
      (team.deadCap > 0 ? '<div style="margin-top:8px;font-size:11px;color:var(--text-muted)">Dead cap: <strong class="mono">' + formatMoney(team.deadCap) + '</strong></div>' : '') +
      '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-sm" onclick="game.currentView=\'capspace\';document.querySelectorAll(\'.nav-item\').forEach(n=>n.classList.remove(\'active\'));document.querySelector(\'[data-view=capspace]\').classList.add(\'active\');game.render()">Manage cap →</button></div>' +
      '</div></div>' +
      '<div class="coach-card">' +
      '<div class="coach-face">' + pixelFaceSVG(stringHash(team.coachId)) + '</div>' +
      '<div><div class="coach-label">Head Coach</div>' +
      '<div class="coach-name">' + team.coachName + '</div>' +
      '<div class="coach-meta">Career: ' + team.coachWins + '–' + team.coachLosses + (team.coachOfYears > 0 ? ' · ' + team.coachOfYears + 'x Coach of the Year' : '') + '</div></div></div>';
    html += this.renderRosterCard(team, 'fullPage');
    document.getElementById('content').innerHTML = html;
  },

  renderRosterCard(team, ctx) {
    const allRoster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const filtered = this.rosterPosFilter === 'ALL' ? allRoster : allRoster.filter(p => p.position === this.rosterPosFilter);
    filtered.sort((a, b) => b.rating - a.rating);
    const cap = getSalaryCap(this.state.year);
    let html = '<div class="card"><div class="card-header">' +
      '<div class="card-title">Roster</div>' +
      '<div class="card-meta">' + filtered.length + ' of ' + allRoster.length + '/' + ROSTER_SIZE + ' active</div>' +
      '</div>' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border)"><div class="draft-filters" style="margin:0">' +
      ['ALL'].concat(POSITIONS_FOR_DRAFT).map(pos =>
        '<button class="filter-btn ' + (this.rosterPosFilter === pos ? 'active' : '') + '" onclick="game.setRosterFilter(\'' + pos + '\', \'' + ctx + '\', ' + team.id + ')">' + pos + '</button>'
      ).join('') + '</div></div>' +
      '<div class="roster-row head"><div>#</div><div>POS</div><div></div><div>NAME</div><div>AGE</div><div>OVR</div><div>CAP</div></div>';
    if (filtered.length === 0) html += '<div class="empty-state" style="padding:32px">No players at this position</div>';
    else filtered.forEach(p => {
      const rc = this.ratingClass(p.rating);
      const hit = p.contract ? currentCapHit(p.contract) : 0;
      const sc = this.salaryClass(hit, cap);
      html += '<div class="roster-row" onclick="game.showPlayer(' + p.id + ')">' +
        '<div class="jersey-num">' + p.jerseyNumber + '</div>' +
        '<div><span class="position-tag">' + p.position + '</span></div>' +
        '<div class="player-face-small">' + pixelFaceSVG(p.faceSeed) + '</div>' +
        '<div>' + p.name + '</div>' +
        '<div class="mono-num">' + p.age + '</div>' +
        '<div><span class="rating ' + rc + '">' + p.rating + '</span></div>' +
        '<div class="salary-tag ' + sc + '">' + formatMoney(hit) + '</div></div>';
    });
    html += '</div>';
    return html;
  },

  setRosterFilter(pos, ctx, teamId) {
    this.rosterPosFilter = pos;
    if (ctx === 'fullPage') this.renderMyTeam();
    else if (ctx === 'modal') this.showTeam(teamId);
  },

  // CAP SPACE PAGE
  renderCapSpace() {
    if (this.state.userTeamId === null || this.state.userTeamId === undefined) {
      this.currentView = 'standings'; this.render(); return;
    }
    const team = this.state.teams[this.state.userTeamId];
    const roster = team.roster.map(id => this.state.players[id]).filter(p => p && !p.retired);
    const cap = getSalaryCap(this.state.year);
    const capUsed = teamCapUsed(team, this.state.players);
    const capSpace = cap - capUsed;
    const capPct = (capUsed / cap) * 100;
    const capClass = capPct > 100 ? 'over' : capPct > 90 ? 'warning' : '';
    let html = '<div class="page-header">' +
      '<div class="page-title">Cap & Contracts</div>' +
      '<div class="page-subtitle">' + team.city + ' ' + team.name + ' · ' + this.state.year + ' salary cap management</div>' +
      '</div>' +
      '<div class="card"><div class="card-header"><div class="card-title">' + this.state.year + ' Salary cap overview</div></div>' +
      '<div style="padding:16px">' +
      '<div class="cap-bar-container"><div class="cap-bar-fill ' + capClass + '" style="width:' + Math.min(100, capPct) + '%"></div>' +
      '<div class="cap-bar-label">' + capPct.toFixed(1) + '% used</div></div>' +
      '<div class="stats-grid" style="margin-top:16px">' +
      '<div class="stat-block"><div class="stat-block-label">Cap limit</div><div class="stat-block-value" style="font-size:15px">' + formatMoney(cap) + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Cap used</div><div class="stat-block-value" style="font-size:15px">' + formatMoney(capUsed) + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Cap space</div><div class="stat-block-value" style="font-size:15px;color:' + (capSpace < 0 ? 'var(--danger)' : 'var(--success)') + '">' + formatMoney(capSpace) + '</div></div>' +
      '<div class="stat-block"><div class="stat-block-label">Dead cap</div><div class="stat-block-value" style="font-size:15px">' + formatMoney(team.deadCap || 0) + '</div></div>' +
